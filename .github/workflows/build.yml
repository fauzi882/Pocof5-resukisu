#!/system/bin/sh
# Marble Full Power - Post Boot Script
# Generated by kanha builder - ALL FEATURES

while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done
sleep 3

# === INTEGRITY BYPASS ===
resetprop -n ro.boot.vbmeta.device_state locked
resetprop -n ro.boot.verifiedbootstate green
resetprop -n ro.boot.flash.locked 1
resetprop -n ro.boot.veritymode enforcing
resetprop -n ro.boot.warranty_bit 0
resetprop -n ro.warranty_bit 0
resetprop -n ro.debuggable 0
resetprop -n ro.secure 1
resetprop -n vendor.boot.vbmeta.device_state locked
resetprop -n vendor.boot.verifiedbootstate green
resetprop -n ro.build.type user
resetprop -n ro.build.tags release-keys
resetprop -n ro.build.selinux 1

# === KERNEL HARDENING (sysctl) ===
# Memory protection
echo 1 > /proc/sys/kernel/kptr_restrict
echo 1 > /proc/sys/kernel/dmesg_restrict
echo 3 > /proc/sys/kernel/perf_event_paranoid
echo 1 > /proc/sys/kernel/unprivileged_bpf_disabled
echo 2 > /proc/sys/kernel/randomize_va_space
echo 2 > /proc/sys/kernel/yama/ptrace_scope
echo 0 > /proc/sys/kernel/sysrq
echo 1 > /proc/sys/kernel/modules_disabled 2>/dev/null || true
echo 200 > /proc/sys/kernel/pid_max 2>/dev/null || true

# Filesystem protection
echo 1 > /proc/sys/fs/protected_hardlinks
echo 1 > /proc/sys/fs/protected_symlinks
echo 1 > /proc/sys/fs/protected_fifos 2>/dev/null || true
echo 1 > /proc/sys/fs/protected_regular 2>/dev/null || true

# Suid dump disable
echo 0 > /proc/sys/fs/suid_dumpable

# === NETWORK SECURITY FULL ===
# IPv4 hardening
echo 1 > /proc/sys/net/ipv4/tcp_syncookies
echo 1 > /proc/sys/net/ipv4/tcp_rfc1337
echo 0 > /proc/sys/net/ipv4/tcp_timestamps
echo 1 > /proc/sys/net/ipv4/conf/all/rp_filter
echo 1 > /proc/sys/net/ipv4/conf/default/rp_filter
echo 0 > /proc/sys/net/ipv4/conf/all/accept_redirects
echo 0 > /proc/sys/net/ipv4/conf/default/accept_redirects
echo 0 > /proc/sys/net/ipv4/conf/all/send_redirects
echo 0 > /proc/sys/net/ipv4/conf/default/send_redirects
echo 0 > /proc/sys/net/ipv4/conf/all/accept_source_route
echo 0 > /proc/sys/net/ipv4/conf/all/secure_redirects
echo 1 > /proc/sys/net/ipv4/conf/all/log_martians
echo 1 > /proc/sys/net/ipv4/icmp_echo_ignore_broadcasts
echo 1 > /proc/sys/net/ipv4/icmp_ignore_bogus_error_responses
echo 0 > /proc/sys/net/ipv4/ip_forward
# IPv6 hardening
echo 0 > /proc/sys/net/ipv6/conf/all/accept_redirects
echo 0 > /proc/sys/net/ipv6/conf/all/accept_source_route
echo 0 > /proc/sys/net/ipv6/conf/all/accept_ra
echo 0 > /proc/sys/net/ipv6/conf/default/accept_ra

# === TCP FULL OPTIMIZATION ===
echo bbr > /proc/sys/net/ipv4/tcp_congestion_control
echo fq > /proc/sys/net/core/default_qdisc
echo 0 > /proc/sys/net/ipv4/tcp_slow_start_after_idle
echo 1 > /proc/sys/net/ipv4/tcp_fastopen
echo 1 > /proc/sys/net/ipv4/tcp_sack
echo 1 > /proc/sys/net/ipv4/tcp_fack
echo 1 > /proc/sys/net/ipv4/tcp_window_scaling
echo 1 > /proc/sys/net/ipv4/tcp_moderate_rcvbuf
echo 4194304 > /proc/sys/net/core/rmem_max
echo 4194304 > /proc/sys/net/core/wmem_max
echo 4194304 > /proc/sys/net/core/rmem_default
echo 4194304 > /proc/sys/net/core/wmem_default
echo 16384 65536 4194304 > /proc/sys/net/ipv4/tcp_rmem
echo 16384 65536 4194304 > /proc/sys/net/ipv4/tcp_wmem
echo 0 > /proc/sys/net/ipv4/tcp_ecn
echo 5 > /proc/sys/net/ipv4/tcp_keepalive_probes
echo 30 > /proc/sys/net/ipv4/tcp_keepalive_intvl
echo 120 > /proc/sys/net/ipv4/tcp_keepalive_time

# BPF JIT hardening
echo 2 > /proc/sys/net/core/bpf_jit_harden

# === SIGNAL & RADIO BOOST ===
resetprop -n persist.vendor.radio.add_power_save 0
resetprop -n persist.vendor.radio.apm_sim_not_pwdn 1
resetprop -n persist.vendor.radio.sib16_support 1
resetprop -n persist.vendor.radio.rat_on combo
resetprop -n persist.radio.calls.on.ims true
resetprop -n persist.vendor.radio.lte_to_1x_cc_idle 1
resetprop -n persist.vendor.radio.force_on_dc true
resetprop -n ril.subscription.types NV,RUIM
resetprop -n DEVICE_PROVISIONED 1

# === GPS OPTIMIZATION ===
resetprop -n persist.gps.qc_nlp_in_use 1
resetprop -n persist.loc.nlp_name com.qualcomm.location
resetprop -n ro.gps.agps_provider 1
resetprop -n persist.vendor.gps.hal.start.mode 2
resetprop -n persist.gps.gpsonewayfix true
resetprop -n persist.gps.xtra-daemon.disabled false

# === CPU GOVERNOR ===
GOV=schedutil
for pol in /sys/devices/system/cpu/cpufreq/policy*; do
  echo $GOV > "$pol/scaling_governor" 2>/dev/null || true
done
# Schedutil tuning
for pol in /sys/devices/system/cpu/cpufreq/policy*; do
  echo 500  > "$pol/schedutil/up_rate_limit_us" 2>/dev/null || true
  echo 2000 > "$pol/schedutil/down_rate_limit_us" 2>/dev/null || true
  echo 0    > "$pol/schedutil/iowait_boost_enable" 2>/dev/null || true
done

# === MEMORY OPTIMIZATION ===
echo 100 > /proc/sys/vm/swappiness
echo 10  > /proc/sys/vm/dirty_ratio
echo 5   > /proc/sys/vm/dirty_background_ratio
echo 500 > /proc/sys/vm/dirty_writeback_centisecs
echo 3   > /proc/sys/vm/drop_caches 2>/dev/null || true
echo 0   > /proc/sys/vm/oom_kill_allocating_task
echo 0   > /proc/sys/vm/overcommit_memory
echo 60  > /proc/sys/vm/overcommit_ratio
echo 1   > /proc/sys/vm/compact_unevictable_allowed 2>/dev/null || true

# === DOLBY ATMOS AUDIO ===
resetprop -n audio.deep_buffer.media true
resetprop -n audio.offload.buffer.size.kb 32
resetprop -n audio.offload.gapless.enabled true
resetprop -n audio.offload.multiple.enabled false
resetprop -n audio.offload.min.duration.secs 30
resetprop -n ro.config.media_vol_steps 25
resetprop -n persist.audio.fluence.speaker true
resetprop -n persist.audio.fluence.voicecall true
resetprop -n persist.audio.fluence.voicerec true
resetprop -n ro.vendor.audio.sdk.fluencetype fluence
resetprop -n persist.vendor.audio.fluence.for.speaker true
resetprop -n persist.vendor.audio.hw.binder.size.kbyte 1024

# === I/O SCHEDULER ===
for q in /sys/block/*/queue; do
  [ -d "$q" ] || continue
  echo mq-deadline > "$q/scheduler" 2>/dev/null || true
  echo 64          > "$q/read_ahead_kb" 2>/dev/null || true
  echo 0           > "$q/add_random" 2>/dev/null || true
  echo 0           > "$q/rotational" 2>/dev/null || true
  echo 2           > "$q/rq_affinity" 2>/dev/null || true
  echo 256         > "$q/nr_requests" 2>/dev/null || true
done

# === THERMAL OPTIMIZATION ===
resetprop -n sys.config.thermal.version 3 2>/dev/null || true

# === SELINUX PERMISSIVE (post-bypass) ===
setenforce 0 2>/dev/null || true

log -t marble-fullpower "Post-boot tuning complete - ALL FEATURES ACTIVE"
SCRIPTEOF
          chmod 755 marble_fullpower_tune.sh

          # Build info
          BUILD_DATE=$(date +"%Y%m%d-%H%M")
          cat > BUILD_INFO.txt << INFOEOF
============================================
MARBLE FULL POWER KERNEL
============================================
Date:          $(date -u '+%Y-%m-%d %H:%M:%S UTC')
Device:        Poco F5 (marble) - SM7475
Branch:        ${{ github.event.inputs.kernel_branch }}
KSU:           BakaSU ${{ github.event.inputs.ksu_version_override }}
SuSFS:         ${{ github.event.inputs.enable_susfs }}
Security:      ${{ github.event.inputs.security_level }}
TCP:           ${{ github.event.inputs.tcp_profile }}
CPU Governor:  ${{ github.event.inputs.cpu_governor }}
Dolby:         ${{ github.event.inputs.enable_dolby }}
GPS Fix:       ${{ github.event.inputs.enable_gps_fix }}
Signal Boost:  ${{ github.event.inputs.enable_signal_boost }}
Bypass:        ${{ github.event.inputs.enable_integrity_bypass }}
Full Security: ${{ github.event.inputs.enable_full_security }}
LTO:           ${{ github.event.inputs.enable_lto }}

Security Tiers:
  T1: Memory Hardening     (INIT_ON_ALLOC/FREE, KFENCE, PAGE_POISON)
  T2: Kernel Hardening     (KASLR, STACKLEAK, RANDSTRUCT, VMAP_STACK)
  T3: ARM64 Hardware       (PAC, BTI, MTE, SCS, KPTI, CFI)
  T4: Network Security     (Netfilter, XDP, WireGuard, IPsec)
  T5: eBPF + LSM           (BPF_LSM, Seccomp-BPF, BPF JIT harden)
  T6: Crypto               (AES-CE, ChaCha20, BLAKE2, DRBG, no MD5/RC4)
  T7: Audit + IMA/EVM      (IMA appraise, EVM, full audit)
  T8: Process/Namespace    (Yama, cgroups, capabilities, namespaces)
  +   Spectre/Meltdown     (KPTI, PAC, branch predictor hardening)
  +   Covert Channel        (timing attack mitigations)
  +   Android Security      (Binder, Keystore, Verified Boot)
  +   Qualcomm Security     (SCM, TrustZone integration)
============================================
INFOEOF

          # Copy kernel
          if [ -f "../kernel/out/arch/arm64/boot/Image" ]; then
            cp ../kernel/out/arch/arm64/boot/Image .
          elif [ -f "../kernel/out/arch/arm64/boot/Image.gz" ]; then
            cp ../kernel/out/arch/arm64/boot/Image.gz .
          else
            echo "ERROR: kernel image tidak ditemukan"; exit 1
          fi

          # Copy modules
          if [ -d "../kernel/out" ]; then
            mkdir -p modules/vendor/lib/modules
            find ../kernel/out -name "*.ko" \
              -exec cp {} modules/vendor/lib/modules/ \; 2>/dev/null || true
          fi

          ZIP_NAME="Marble-FullPower-BakaSU-${BUILD_DATE}.zip"
          zip -r9 "../${ZIP_NAME}" * -x "*.git*"
          echo "ZIP_OUTPUT=${ZIP_NAME}" >> $GITHUB_ENV
          echo ">>> ZIP: ${ZIP_NAME}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Marble-FullPower-Kernel-BakaSU
          path: ${{ env.ZIP_OUTPUT }}
          retention-days: 14
