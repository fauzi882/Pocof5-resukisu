name: Build Marble Kernel (Latest BakaSU Sync + Clean No-Dirty + Full Security)

on:
  workflow_dispatch:
    inputs:
      root_variant:
        description: 'Pilih Varian Root (BakaSU / ReSukiSU atau KernelSU Next)'
        required: true
        default: 'bakasu'
        type: choice
        options:
          - bakasu
          - kernelsu-next
      ksu_version_override:
        description: 'Versi Driver KSU/BakaSU (Kosongkan untuk auto-sync ke Manajer terbaru 35252)'
        required: false
        default: '35252'
        type: string
      enable_susfs:
        description: 'Integrasikan Patch SuSFS (Stealth Root Hiding Level Kernel)'
        required: true
        default: true
        type: boolean
      security_level:
        description: 'Level Keamanan & Hardening (Stealth Anti-Deteksi + Network Shield)'
        required: true
        default: 'maximum_stealth'
        type: choice
        options:
          - maximum_stealth
          - standard_secure
      tcp_profile:
        description: 'Optimasi Latensi BBR (Aman Tanpa Ubah Struktur ABI)'
        required: true
        default: 'bbr_plus_tuned'
        type: choice
        options:
          - bbr_plus_tuned
          - bbr_stock
      kernel_branch:
        description: 'Branch Source Kernel Pzqqt'
        required: true
        default: 'melt-rebase'
        type: choice
        options:
          - melt-rebase
          - bouquet

permissions:
  contents: read

env:
  KERNEL_REPO: "https://github.com/Pzqqt/android_kernel_xiaomi_marble.git"
  AK3_REPO: "https://github.com/osm0sis/AnyKernel3.git"
  SUSFS_REPO: "https://gitlab.com/simonpunk/susfs4ksu.git"
  SUSFS_BRANCH: "gki-android12-5.10"
  CLANG_URL: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r536225.tar.gz"
  ARCH: "arm64"
  SUBARCH: "arm64"

jobs:
  build-marble-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Maksimalkan Ruang Disk Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Install Dependensi Kompilasi
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache cpio curl flex git git-lfs \
            libelf-dev libncurses5-dev libssl-dev lld llvm lz4 pahole \
            python3 python3-pip rsync unzip wget xz-utils zip zstd \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu

      - name: Setup Direktori & Toolchain Clang/LLVM
        run: |
          mkdir -p "$HOME/toolchains/clang"
          wget -qO clang.tar.gz "${{ env.CLANG_URL }}"
          tar -xzf clang.tar.gz -C "$HOME/toolchains/clang"
          rm -f clang.tar.gz
          echo "$HOME/toolchains/clang/bin" >> $GITHUB_PATH

      - name: Clone Source Kernel Pzqqt
        run: |
          git clone --depth=1 -b "${{ github.event.inputs.kernel_branch }}" "${{ env.KERNEL_REPO }}" kernel
          cd kernel
          git config user.name "build-user"
          git config user.email "build-user@android"

      - name: Siapkan Repo SuSFS (gki-android12-5.10)
        if: ${{ github.event.inputs.enable_susfs == 'true' }}
        run: |
          git clone --depth=1 -b "${{ env.SUSFS_BRANCH }}" "${{ env.SUSFS_REPO }}" susfs4ksu

      - name: Integrasi Root Terbaru + SuSFS + Hilangkan Status Dirty
        run: |
          cd kernel

          rm -rf KernelSU drivers/kernelsu
          sed -i '/kernelsu/d' drivers/Makefile || true
          sed -i '/kernelsu/d' drivers/Kconfig || true
          git add -A && git commit -m "clean-pre-root" || true

          if [ "${{ github.event.inputs.root_variant }}" = "bakasu" ]; then
            echo ">>> Mengintegrasikan BakaSU dan menarik commit terbaru dari branch aktif..."
            curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -s main || \
            curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash
            if [ -d "KernelSU" ]; then
              cd KernelSU
              git config user.name "build-user"
              git config user.email "build-user@android"
              git fetch --all --tags || true
              # Checkout ke commit paling baru di antara semua branch remote (main/next/dev) agar sinkron dengan Manajer terbaru
              LATEST_REF=$(git for-each-ref --sort=-committerdate --format='%(refname:short)' refs/remotes/origin/ | head -n 1)
              if [ -n "$LATEST_REF" ]; then
                echo ">>> Beralih ke branch BakaSU paling baru: $LATEST_REF"
                git checkout -f "$LATEST_REF"
              fi
              cd ..
            fi
          else
            if [ "${{ github.event.inputs.enable_susfs }}" = "true" ]; then
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next-susfs || \
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
            else
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
            fi
          fi

          SUSFS_OK="false"
          if [ "${{ github.event.inputs.enable_susfs }}" = "true" ] && [ -d "../susfs4ksu" ]; then
            cp -r ../susfs4ksu/kernel_patches/fs/* fs/
            cp -r ../susfs4ksu/kernel_patches/include/linux/* include/linux/

            PATCH_FILE="../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch"
            if [ -f "$PATCH_FILE" ]; then
              if patch -p1 --dry-run --fuzz=3 < "$PATCH_FILE" >/dev/null 2>&1; then
                patch -p1 --forward --fuzz=3 < "$PATCH_FILE"
                SUSFS_OK="true"
              elif git apply --3way --check "$PATCH_FILE" >/dev/null 2>&1; then
                git apply --3way "$PATCH_FILE"
                SUSFS_OK="true"
              else
                rm -f fs/susfs.c fs/sus_su.c include/linux/susfs*.h
                SUSFS_OK="false"
              fi
            fi

            if [ "$SUSFS_OK" = "true" ]; then
              find KernelSU drivers/kernelsu -name "*.mk" -o -name "Makefile" -o -name "Kbuild" 2>/dev/null | while read -r mkfile; do
                sed -i 's/\$(error /\$(warning /g' "$mkfile" || true
              done
            fi
          fi
          echo "SUSFS_APPLIED=$SUSFS_OK" >> $GITHUB_ENV

          # SINKRONKAN VERSI DRIVER (35252 / API 6) & BERSIHKAN STATUS "-dirty" DI KERNELSU
          if [ -d "KernelSU" ]; then
            cd KernelSU
            if [ -n "${{ github.event.inputs.ksu_version_override }}" ]; then
              find . -name "Makefile" -o -name "Kbuild" -o -name "*.mk" | while read -r mf; do
                sed -i 's/KSU_VERSION := .*/KSU_VERSION := ${{ github.event.inputs.ksu_version_override }}/g' "$mf" || true
              done
            fi
            git add -A && git commit -m "sync-clean-release" || true
            cd ..
          fi

          python3 - << 'PYEOF'
          import re

          def extract_arg_names(decl_str, fn_name):
              params_match = re.search(rf"\b{fn_name}\s*\((.*)\)", decl_str, flags=re.DOTALL)
              if not params_match:
                  return ""
              params_raw = params_match.group(1).strip()
              if not params_raw or params_raw == "void":
                  return ""
              arg_names = []
              for part in params_raw.split(","):
                  part = part.strip()
                  m_var = re.findall(r"[A-Za-z_][A-Za-z0-9_]*", part)
                  if m_var:
                      arg_names.append(m_var[-1])
              return ", ".join(arg_names)

          with open("fs/exec.c", "r", encoding="utf-8", errors="ignore") as f:
              exec_c = f.read()
          exec_stubs = []
          for fn in ["ksu_setup_preinit_file", "ksu_preinit_handle_post_execveat"]:
              m = re.search(r"extern\s+([^;]*?\b" + fn + r"\s*\([^;]*?\))\s*;", exec_c, flags=re.DOTALL)
              if m:
                  decl = m.group(1).strip()
                  ret_part = decl.split(fn)[0].strip()
                  body = "{}" if ("void" in ret_part and "*" not in ret_part) else "{ return 0; }"
                  exec_stubs.append(f"__attribute__((weak)) {decl} {body}\n")
          if exec_stubs:
              with open("fs/exec.c", "a", encoding="utf-8") as f:
                  f.write("\n/* Safe weak stubs for execveat preinit */\n" + "".join(exec_stubs))

          with open("security/selinux/hooks.c", "r", encoding="utf-8", errors="ignore") as f:
              hooks_c = f.read()
          m_hook = re.search(r"extern\s+([^;]*?\bmy_setprocattr\s*\([^;]*?\))\s*;", hooks_c, flags=re.DOTALL)
          if m_hook:
              decl = m_hook.group(1).strip()
              args = extract_arg_names(decl, "my_setprocattr")
              stub_code = f"\n__attribute__((weak)) {decl} {{ return selinux_setprocattr({args}); }}\n"
              with open("security/selinux/hooks.c", "a", encoding="utf-8") as f:
                  f.write(stub_code)

          with open("security/selinux/selinuxfs.c", "r", encoding="utf-8", errors="ignore") as f:
              sfs_c = f.read()
          sfs_stubs = []
          for my_fn, orig_fn in [("my_write_context", "sel_write_context"), ("my_write_access", "sel_write_access")]:
              m_sfs = re.search(r"extern\s+([^;]*?\b" + my_fn + r"\s*\([^;]*?\))\s*;", sfs_c, flags=re.DOTALL)
              if m_sfs:
                  decl = m_sfs.group(1).strip()
                  args = extract_arg_names(decl, my_fn)
                  sfs_stubs.append(f"__attribute__((weak)) {decl} {{ return {orig_fn}({args}); }}\n")
          if sfs_stubs:
              with open("security/selinux/selinuxfs.c", "a", encoding="utf-8") as f:
                  f.write("\n/* True SELinux passthrough bridges */\n" + "".join(sfs_stubs))
          PYEOF

          # Commit seluruh pohon kernel agar string versi kernel juga bebas dari tanda "-dirty"
          git add -A && git commit -m "final-clean-tree" || true

      - name: Konfigurasi Defconfig Full Security & Stealth (ABI-Safe)
        run: |
          cd kernel

          if [ "${{ github.event.inputs.tcp_profile }}" = "bbr_plus_tuned" ] && [ -f "net/ipv4/tcp_bbr.c" ]; then
            sed -i 's/static const u32 bbr_min_rtt_win_sec = 10;/static const u32 bbr_min_rtt_win_sec = 5;/g' net/ipv4/tcp_bbr.c || true
            sed -i 's/static const u32 bbr_probe_rtt_mode_ms = 200;/static const u32 bbr_probe_rtt_mode_ms = 100;/g' net/ipv4/tcp_bbr.c || true
          fi

          if [ -f "arch/arm64/configs/marble_defconfig" ]; then
            DEFCONFIG_NAME="marble_defconfig"
            DEFCONFIG_FILE="arch/arm64/configs/marble_defconfig"
          elif [ -f "arch/arm64/configs/vendor/marble_defconfig" ]; then
            DEFCONFIG_NAME="vendor/marble_defconfig"
            DEFCONFIG_FILE="arch/arm64/configs/vendor/marble_defconfig"
          else
            DEFCONFIG_NAME="gki_defconfig"
            DEFCONFIG_FILE="arch/arm64/configs/gki_defconfig"
          fi

          echo "TARGET_DEFCONFIG=$DEFCONFIG_NAME" >> $GITHUB_ENV

          cat << 'EOF' >> "$DEFCONFIG_FILE"
          CONFIG_WERROR=n
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_NET_SCH_FQ=y
          CONFIG_SYN_COOKIES=y
          CONFIG_SECURITY_DMESG_RESTRICT=y
          CONFIG_SECURITY_NETWORK=y
          CONFIG_SECURITY_SELINUX=y
          CONFIG_BPF_JIT_ALWAYS_ON=y
          EOF

          if [ "${{ env.SUSFS_APPLIED }}" = "true" ]; then
            cat << 'EOF' >> "$DEFCONFIG_FILE"
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          EOF
            if [ "${{ github.event.inputs.security_level }}" = "maximum_stealth" ]; then
              echo "CONFIG_KSU_SUSFS_ENABLE_LOG=n" >> "$DEFCONFIG_FILE"
            else
              echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "$DEFCONFIG_FILE"
            fi
          else
            echo "CONFIG_KSU_SUSFS=n" >> "$DEFCONFIG_FILE"
          fi

          git add -A && git commit -m "defconfig-ready" || true

      - name: Kompilasi Kernel Marble (Stealth GKI Identity)
        run: |
          cd kernel
          export KBUILD_BUILD_USER="build-user"
          export KBUILD_BUILD_HOST="build-host"

          make O=out ARCH=arm64 \
            CC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            "${{ env.TARGET_DEFCONFIG }}"

          if [ -f "arch/arm64/configs/vendor/marble_GKI.config" ] && [ "${{ env.TARGET_DEFCONFIG }}" = "gki_defconfig" ]; then
            ./scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/marble_GKI.config
          fi

          ./scripts/config --file out/.config -d WERROR -d CONFIG_WERROR -d KSU_SUSFS_SUS_SU -d LOCALVERSION_AUTO --set-val FRAME_WARN 4096
          make O=out ARCH=arm64 CC="ccache clang" LLVM=1 LLVM_IAS=1 olddefconfig

          set +e
          make -j$(nproc --all) \
            O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            Image Image.gz 2>&1 | tee build_full.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ $BUILD_STATUS -ne 0 ]; then
            grep -E "error:|fatal error:|undefined reference|undefined symbol|FAILED|\*\*\*.*Stop" build_full.log | tail -n 50 || true
            exit $BUILD_STATUS
          fi

      - name: Paketkan ke AnyKernel3 dengan Konfigurasi Partisi Marble Presisi
        run: |
          git clone --depth=1 "${{ env.AK3_REPO }}" AnyKernel3
          cd AnyKernel3
          rm -rf .git README.md modules patch ramdisk

          cat << 'EOF' > anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script for POCO F5 (marble)
          ## osm0sis @ xda-developers

          properties() { '
          kernel.string=Melt Kernel Full Security POCO F5 (marble)
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=marble
          device.name2=marblein
          supported.versions=
          supported.patchlevels=
          '; }

          block=boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          EOF

          cp ../kernel/out/arch/arm64/boot/Image .

          cat << 'EOF' > marble_security_tune.sh
          #!/system/bin/sh
          while [ "$(getprop sys.boot_completed)" != "1" ]; do
            sleep 3
          done

          echo 2 > /proc/sys/kernel/kptr_restrict 2>/dev/null
          echo 1 > /proc/sys/kernel/dmesg_restrict 2>/dev/null
          echo 3 > /proc/sys/kernel/perf_event_paranoid 2>/dev/null
          echo 1 > /proc/sys/kernel/unprivileged_bpf_disabled 2>/dev/null
          echo 2 > /proc/sys/kernel/randomize_va_space 2>/dev/null
          echo 1 > /proc/sys/fs/protected_hardlinks 2>/dev/null
          echo 1 > /proc/sys/fs/protected_symlinks 2>/dev/null
          echo 0 > /proc/sys/kernel/sysrq 2>/dev/null

          echo 1 > /proc/sys/net/ipv4/tcp_syncookies 2>/dev/null
          echo 1 > /proc/sys/net/ipv4/tcp_rfc1337 2>/dev/null
          echo 0 > /proc/sys/net/ipv4/tcp_timestamps 2>/dev/null
          echo 1 > /proc/sys/net/ipv4/conf/all/rp_filter 2>/dev/null
          echo 1 > /proc/sys/net/ipv4/conf/default/rp_filter 2>/dev/null
          echo 0 > /proc/sys/net/ipv4/conf/all/accept_redirects 2>/dev/null
          echo 0 > /proc/sys/net/ipv4/conf/default/accept_redirects 2>/dev/null
          echo 0 > /proc/sys/net/ipv4/conf/all/secure_redirects 2>/dev/null
          echo 0 > /proc/sys/net/ipv4/conf/all/send_redirects 2>/dev/null
          echo 0 > /proc/sys/net/ipv4/conf/all/accept_source_route 2>/dev/null
          echo 0 > /proc/sys/net/ipv6/conf/all/accept_redirects 2>/dev/null
          echo 0 > /proc/sys/net/ipv6/conf/default/accept_redirects 2>/dev/null
          echo 1 > /proc/sys/net/ipv4/icmp_echo_ignore_broadcasts 2>/dev/null
          echo 1 > /proc/sys/net/ipv4/icmp_ignore_bogus_error_responses 2>/dev/null

          resetprop -n ro.boot.vbmeta.device_state locked
          resetprop -n ro.boot.verifiedbootstate green
          resetprop -n ro.boot.flash.locked 1
          resetprop -n ro.boot.veritymode enforcing
          resetprop -n ro.boot.warranty_bit 0
          resetprop -n ro.warranty_bit 0
          resetprop -n ro.debuggable 0
          resetprop -n ro.secure 1
          resetprop -n vendor.boot.vbmeta.device_state locked
          resetprop -n vendor.boot.verifiedbootstate green

          echo "bbr" > /proc/sys/net/ipv4/tcp_congestion_control 2>/dev/null
          echo "fq" > /proc/sys/net/core/default_qdisc 2>/dev/null
          echo 0 > /proc/sys/net/ipv4/tcp_slow_start_after_idle 2>/dev/null

          resetprop -n persist.vendor.radio.add_power_save 0
          resetprop -n persist.vendor.radio.apm_sim_not_pwdn 1
          resetprop -n persist.vendor.radio.sib16_support 1
          resetprop -n persist.vendor.overlay.izat.optin rro
          resetprop -n persist.backup.ntpServer "0.id.pool.ntp.org"

          for gov in /sys/devices/system/cpu/cpufreq/policy*; do
            echo 1000 > "$gov/schedutil/up_rate_limit_us" 2>/dev/null
            echo 5000 > "$gov/schedutil/down_rate_limit_us" 2>/dev/null
          done
          EOF
          chmod 0755 marble_security_tune.sh

          BUILD_DATE=$(date +"%Y%m%d-%H%M")
          ZIP_NAME="Melt-Marble-CleanSync-${{ github.event.inputs.root_variant }}-SuSFS_${{ env.SUSFS_APPLIED }}-${BUILD_DATE}.zip"
          zip -r9 "../${ZIP_NAME}" * -x "*.git*"
          echo "ZIP_OUTPUT=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload Artifact Flashable Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Melt-Kernel-Marble-CleanSync-${{ github.event.inputs.root_variant }}
          path: ${{ env.ZIP_OUTPUT }}
          retention-days: 14
          
