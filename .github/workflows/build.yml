name: Build Marble Kernel (KSU-Next / BakaSU + SuSFS)

on:
  workflow_dispatch:
    inputs:
      root_variant:
        description: 'Pilih Varian Root (KernelSU Next atau BakaSU / ReSukiSU)'
        required: true
        default: 'bakasu'
        type: choice
        options:
          - bakasu
          - kernelsu-next
      enable_susfs:
        description: 'Integrasikan Patch SuSFS (Root Hiding Level Kernel)'
        required: true
        default: true
        type: boolean
      tcp_profile:
        description: 'Profil Algoritma TCP Congestion'
        required: true
        default: 'bbr_plus_tuned'
        type: choice
        options:
          - bbr_plus_tuned
          - bbr_standard
      kernel_branch:
        description: 'Branch Source Kernel Pzqqt'
        required: true
        default: 'melt-rebase'
        type: choice
        options:
          - melt-rebase
          - bouquet

env:
  KERNEL_REPO: "https://github.com/Pzqqt/android_kernel_xiaomi_marble.git"
  AK3_REPO: "https://github.com/osm0sis/AnyKernel3.git"
  SUSFS_REPO: "https://gitlab.com/simonpunk/susfs4ksu.git"
  SUSFS_BRANCH: "gki-android12-5.10"
  CLANG_URL: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r536225.tar.gz"
  ARCH: "arm64"
  SUBARCH: "arm64"

jobs:
  build-marble-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Maksimalkan Ruang Disk Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Install Dependensi Kompilasi
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache cpio curl flex git git-lfs \
            libelf-dev libncurses5-dev libssl-dev lld llvm lz4 pahole \
            python3 python3-pip rsync unzip wget xz-utils zip zstd

      - name: Setup Direktori & Toolchain Clang/LLVM
        run: |
          mkdir -p "$HOME/toolchains/clang"
          wget -qO clang.tar.gz "${{ env.CLANG_URL }}"
          tar -xzf clang.tar.gz -C "$HOME/toolchains/clang"
          rm -f clang.tar.gz
          echo "$HOME/toolchains/clang/bin" >> $GITHUB_PATH

      - name: Clone Source Kernel Pzqqt (Marble)
        run: |
          git clone --depth=1 -b "${{ github.event.inputs.kernel_branch }}" "${{ env.KERNEL_REPO }}" kernel
          cd kernel
          git config user.name "kanha-builder"
          git config user.email "builder@localhost"

      - name: Siapkan Repo SuSFS (gki-android12-5.10)
        if: ${{ github.event.inputs.enable_susfs == 'true' }}
        run: |
          git clone --depth=1 -b "${{ env.SUSFS_BRANCH }}" "${{ env.SUSFS_REPO }}" susfs4ksu

      - name: Integrasi Root (KernelSU Next atau BakaSU) + SuSFS
        run: |
          cd kernel

          # Bersihkan sisa diretori KSU bawaan source jika ada agar tidak bentrok
          rm -rf KernelSU drivers/kernelsu

          if [ "${{ github.event.inputs.root_variant }}" = "bakasu" ]; then
            echo ">>> Mengintegrasikan BakaSU (ReSukiSU)..."
            curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -s main
          else
            echo ">>> Mengintegrasikan KernelSU Next..."
            if [ "${{ github.event.inputs.enable_susfs == 'true' }}" = "true" ]; then
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next-susfs || \
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
            else
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
            fi
          fi

          # Terapkan patch kernel-side SuSFS
          if [ "${{ github.event.inputs.enable_susfs }}" = "true" ]; then
            echo ">>> Menyalin file inti SuSFS ke tree kernel..."
            cp -r ../susfs4ksu/kernel_patches/fs/* fs/
            cp -r ../susfs4ksu/kernel_patches/include/linux/* include/linux/

            if [ -f "../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch" ]; then
              patch -p1 --forward --fuzz=3 < ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch || true
            fi

            # Jika memakai KernelSU Next branch standar, terapkan patch SuSFS ke folder KernelSU
            if [ "${{ github.event.inputs.root_variant }}" = "kernelsu-next" ] && [ -d "KernelSU" ]; then
              for p in ../susfs4ksu/kernel_patches/KernelSU/*.patch; do
                [ -f "$p" ] && patch -d KernelSU -p1 --forward --fuzz=3 < "$p" || true
              done
            fi
          fi

      - name: Patch Source BBR Plus, Sinyal Modem, GPS & Scheduler
        run: |
          cd kernel

          # 1. Optimasi BBR Plus / BBRv2 Aggressive Pacing & Drain pada net/ipv4/tcp_bbr.c
          if [ "${{ github.event.inputs.tcp_profile }}" = "bbr_plus_tuned" ] && [ -f "net/ipv4/tcp_bbr.c" ]; then
            echo ">>> Menyetel konstanta TCP BBR ke profil BBR Plus (Low Latency & High Throughput)..."
            # Percepat respon probe bandwidth dan kurangi antrean buffer (bufferbloat) pada jaringan seluler
            sed -i 's/BBR_UNIT \* 5 \/ 4/BBR_UNIT * 11 \/ 8/g' net/ipv4/tcp_bbr.c || true
            sed -i 's/static const u32 bbr_min_rtt_win_sec = 10;/static const u32 bbr_min_rtt_win_sec = 5;/g' net/ipv4/tcp_bbr.c || true
            sed -i 's/static const u32 bbr_probe_rtt_mode_ms = 200;/static const u32 bbr_probe_rtt_mode_ms = 100;/g' net/ipv4/tcp_bbr.c || true
          fi

          # 2. Deteksi file defconfig utama Marble
          if [ -f "arch/arm64/configs/marble_defconfig" ]; then
            DEFCONFIG_FILE="arch/arm64/configs/marble_defconfig"
          elif [ -f "arch/arm64/configs/vendor/marble_GKI.config" ]; then
            DEFCONFIG_FILE="arch/arm64/configs/vendor/marble_GKI.config"
          else
            DEFCONFIG_FILE="arch/arm64/configs/gki_defconfig"
          fi
          echo "DEFCONFIG_PATH=$DEFCONFIG_FILE" >> $GITHUB_ENV

          cat << 'EOF' >> "$DEFCONFIG_FILE"

          # === ROOT & SUSFS ===
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y

          # === TCP BBR PLUS / BBRv2 & NETWORK SIGNAL ===
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_BBR2=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          CONFIG_DEFAULT_FQ=y
          CONFIG_INET_SCTP_DIAG=y
          CONFIG_INET_UDP_DIAG=y
          CONFIG_INET_RAW_DIAG=y
          CONFIG_INET_DIAG_DESTROY=y
          CONFIG_RMNET_PERF=y
          CONFIG_QCOM_QMI_HELPERS=y
          CONFIG_QRTR=y
          CONFIG_QRTR_SMD=y
          CONFIG_QRTR_MHI=y

          # === GPS / GNSS PRECISION & TIMING ===
          CONFIG_HIGH_RES_TIMERS=y
          CONFIG_PPS=y
          CONFIG_PTP_1588_CLOCK=y
          CONFIG_RPMSG_QCOM_GLINK_SMEM=y

          # === GAMING FPS & BATTERY EFFICIENCY ===
          CONFIG_HZ_300=y
          CONFIG_HZ=300
          CONFIG_NO_HZ_IDLE=y
          CONFIG_UCLAMP_TASK=y
          CONFIG_UCLAMP_TASK_GROUP=y
          CONFIG_SCHED_MC=y
          CONFIG_ENERGY_MODEL=y
          CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y
          CONFIG_WQ_POWER_EFFICIENT_DEFAULT=y
          CONFIG_DAMON=y
          CONFIG_DAMON_VADDR=y
          CONFIG_DAMON_PADDR=y
          CONFIG_DAMON_RECLAIM=y
          CONFIG_BOEFFLA_WL_BLOCKER=y
          CONFIG_LRU_GEN=y
          CONFIG_LRU_GEN_ENABLED=y
          CONFIG_ZRAM=y
          CONFIG_CRYPTO_LZ4=y
          CONFIG_CRYPTO_ZSTD=y
          CONFIG_LTO_CLANG_THIN=y
          EOF

      - name: Kompilasi Kernel Marble
        run: |
          cd kernel
          export KBUILD_BUILD_USER="kanha"
          export KBUILD_BUILD_HOST="marble-forge"

          # Tentukan target defconfig
          if [ -f "arch/arm64/configs/marble_defconfig" ]; then
            TARGET_DEFCONFIG="marble_defconfig"
          else
            TARGET_DEFCONFIG="gki_defconfig"
          fi

          make O=out ARCH=arm64 "$TARGET_DEFCONFIG"

          # Jika menggunakan fragmen vendor/marble_GKI.config, gabungkan otomatis
          if [ -f "arch/arm64/configs/vendor/marble_GKI.config" ] && [ "$TARGET_DEFCONFIG" = "gki_defconfig" ]; then
            ./scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/marble_GKI.config
            make O=out ARCH=arm64 olddefconfig
          fi

          # Kompilasi penuh menggunakan seluruh thread CPU Runner + Clang ThinLTO
          make -j$(nproc --all) \
            O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            KCFLAGS="-O3 -march=armv8.2-a+crypto+fp16+dotprod -mtune=cortex-a710" \
            Image Image.gz dtbs

      - name: Paketkan ke AnyKernel3 dengan Modul Tuning Sinyal, GPS & Gaming
        run: |
          git clone --depth=1 "${{ env.AK3_REPO }}" AnyKernel3
          cd AnyKernel3
          rm -rf .git README.md

          # Sesuaikan anykernel.sh untuk Poco F5 / Redmi Note 12 Turbo (marble / marblein)
          sed -i 's/device.name1=.*/device.name1=marble/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=marblein/' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=Redmi Note 12 Turbo/' anykernel.sh
          sed -i 's/device.name4=.*/device.name4=POCO F5/' anykernel.sh
          sed -i 's/BLOCK=.*/BLOCK=auto;/' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1;/' anykernel.sh

          # Salin hasil build kernel Image
          if [ -f "../kernel/out/arch/arm64/boot/Image.gz" ]; then
            cp ../kernel/out/arch/arm64/boot/Image.gz .
          else
            cp ../kernel/out/arch/arm64/boot/Image .
          fi

          # Tambahkan skrip tuning otomatis saat boot melalui patch ramdisk / init.marble_tune.rc
          mkdir -p patch
          cat << 'EOF' > ak3_marble_tune.sh
          #!/system/bin/sh
          # Tunggu sampai sistem selesai boot
          while [ "$(getprop sys.boot_completed)" != "1" ]; do
            sleep 2
          done

          # 1. Aktivasi paksa BBR / BBR2 & Fair Queueing (FQ) untuk latensi ping rendah
          if grep -q "bbr2" /proc/sys/net/ipv4/tcp_available_congestion_control; then
            echo "bbr2" > /proc/sys/net/ipv4/tcp_congestion_control
          else
            echo "bbr" > /proc/sys/net/ipv4/tcp_congestion_control
          fi
          echo "fq" > /proc/sys/net/core/default_qdisc
          echo 3 > /proc/sys/net/ipv4/tcp_fastopen
          echo 1 > /proc/sys/net/ipv4/tcp_ecn
          echo 0 > /proc/sys/net/ipv4/tcp_slow_start_after_idle

          # 2. Penguatan Sinyal Provider (RMNET Buffer & Modem Power Save Control)
          echo "4096,87380,16777216" > /proc/sys/net/ipv4/tcp_rmem
          echo "4096,65536,16777216" > /proc/sys/net/ipv4/tcp_wmem
          echo 16777216 > /proc/sys/net/core/rmem_max
          echo 16777216 > /proc/sys/net/core/wmem_max
          echo 5000 > /proc/sys/net/core/netdev_max_backlog
          resetprop -n persist.vendor.radio.add_power_save 0
          resetprop -n persist.vendor.radio.apm_sim_not_pwdn 1
          resetprop -n persist.vendor.radio.sib16_support 1
          resetprop -n persist.vendor.radio.rat_on combine

          # 3. Penguatan Akurasi GPS / GNSS Dual-Band L1+L5 & A-GPS Cepat
          resetprop -n persist.vendor.overlay.izat.optin rro
          resetprop -n persist.backup.ntpServer "0.id.pool.ntp.org"
          for dev in /sys/devices/platform/soc/*.qcom,glink/*; do
            [ -e "$dev/power/control" ] && echo "on" > "$dev/power/control"
          done

          # 4. Keseimbangan Performa FPS Gaming & Efisiensi Baterai (UClamp & Schedutil)
          echo 1 > /dev/cpuctl/top-app/cpu.uclamp.latency_sensitive 2>/dev/null
          echo 15 > /dev/cpuctl/top-app/cpu.uclamp.min 2>/dev/null
          echo 0 > /dev/cpuctl/background/cpu.uclamp.max 2>/dev/null
          for gov in /sys/devices/system/cpu/cpufreq/policy*; do
            echo "schedutil" > "$gov/scaling_governor" 2>/dev/null
            echo 500 > "$gov/schedutil/up_rate_limit_us" 2>/dev/null
            echo 10000 > "$gov/schedutil/down_rate_limit_us" 2>/dev/null
          done

          # 5. Aktifkan Multi-Gen LRU (MGLRU) untuk cegah frame drop akibat swap thrashing
          echo "0x0007" > /sys/kernel/mm/lru_gen/enabled 2>/dev/null
          echo 1000 > /sys/kernel/mm/lru_gen/min_ttl_ms 2>/dev/null
          EOF
          chmod 0755 ak3_marble_tune.sh

          # Buat paket ZIP Flashable
          BUILD_DATE=$(date +"%Y%m%d-%H%M")
          ZIP_NAME="Melt-Marble-${{ github.event.inputs.root_variant }}-SuSFS-${{ github.event.inputs.tcp_profile }}-${BUILD_DATE}.zip"
          zip -r9 "../${ZIP_NAME}" * -x "*.git*"
          echo "ZIP_OUTPUT=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload Artifact Flashable Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Melt-Kernel-Marble-${{ github.event.inputs.root_variant }}
          path: ${{ env.ZIP_OUTPUT }}
          retention-days: 14
          
