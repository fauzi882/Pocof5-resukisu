name: Build POCO F5 Marble BakaSU SUSFS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Marble BakaSU SUSFS
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT MARBLE KERNEL
      # ============================================================
      - name: Checkout Marble Kernel
        uses: actions/checkout@v4
        with:
          repository: Pzqqt/android_kernel_xiaomi_marble
          ref: melt-rebase
          fetch-depth: 1

      # ============================================================
      # 2. INSTALL BUILD DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            make \
            patch \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ============================================================
      # 3. INSTALL LLVM 22.1.8
      # ============================================================
      - name: Install LLVM 22.1.8
        run: |
          set -euo pipefail

          TOOLCHAIN_DIR="$HOME/toolchains"

          mkdir -p "$TOOLCHAIN_DIR"

          cd "$TOOLCHAIN_DIR"

          wget -q --show-progress \
            https://www.kernel.org/pub/tools/llvm/files/llvm-22.1.8-x86_64.tar.xz

          tar -xf llvm-22.1.8-x86_64.tar.xz

          LLVM_DIR="$(find "$TOOLCHAIN_DIR" \
            -maxdepth 1 \
            -type d \
            -name 'llvm-22.1.8*' \
            | head -n 1)"

          if [ -z "$LLVM_DIR" ]; then
            echo "ERROR: LLVM directory not found."
            exit 1
          fi

          if [ ! -x "$LLVM_DIR/bin/clang" ]; then
            echo "ERROR: clang not found."
            find "$LLVM_DIR" -maxdepth 2 -type f | head -n 100
            exit 1
          fi

          echo "LLVM_DIR=$LLVM_DIR" >> "$GITHUB_ENV"
          echo "$LLVM_DIR/bin" >> "$GITHUB_PATH"

          echo "=========================================="
          echo "LLVM VERSION"
          echo "=========================================="

          clang --version
          ld.lld --version

      # ============================================================
      # 4. CONFIGURE LLVM ENVIRONMENT
      # ============================================================
      - name: Configure LLVM environment
        run: |
          set -euo pipefail

          echo "ARCH=arm64" >> "$GITHUB_ENV"
          echo "LLVM=1" >> "$GITHUB_ENV"
          echo "LLVM_IAS=1" >> "$GITHUB_ENV"

          echo "HOSTCC=gcc" >> "$GITHUB_ENV"
          echo "HOSTCXX=g++" >> "$GITHUB_ENV"

          echo "LLVM environment ready."

      # ============================================================
      # 5. SHOW KERNEL SOURCE
      # ============================================================
      - name: Show source information
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "MARBLE KERNEL SOURCE"
          echo "=========================================="

          echo ""
          echo "Kernel commit:"
          git log -1 --oneline

          echo ""
          echo "Kernel branch:"
          git branch --show-current || true

          echo ""
          echo "Remote:"
          git remote -v

          echo ""
          echo "Compiler:"
          clang --version

      # ============================================================
      # 6. PREPARE MARBLE DEFCONFIG
      # ============================================================
      - name: Prepare marble defconfig
        run: |
          set -euo pipefail

          rm -rf out
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            marble_defconfig

          test -f out/.config

          echo "=========================================="
          echo "MARBLE DEFCONFIG READY"
          echo "=========================================="

          grep -E \
            '^CONFIG_LOCALVERSION=|^CONFIG_ANDROID=' \
            out/.config \
            || true

      # ============================================================
      # 7. CLONE BAKASU
      # ============================================================
      - name: Clone BakaSU
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            https://github.com/Baka-SU/BakaSU.git \
            bakasu

          echo "=========================================="
          echo "BAKASU SOURCE"
          echo "=========================================="

          cd bakasu

          git log -1 --oneline

          echo ""
          echo "BakaSU commit:"
          git rev-parse HEAD

          test -f kernel/Kconfig
          test -f kernel/Makefile

      # ============================================================
      # 8. INTEGRATE BAKASU INTO KERNEL
      # ============================================================
      - name: Integrate BakaSU
        run: |
          set -euo pipefail

          rm -rf KernelSU

          mkdir -p KernelSU

          cp -a bakasu/kernel/. KernelSU/

          test -f KernelSU/Kconfig
          test -f KernelSU/Makefile

          echo "=========================================="
          echo "BAKASU INTEGRATED"
          echo "=========================================="

          find KernelSU \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -n 100

      # ============================================================
      # 9. CONNECT BAKASU KCONFIG
      # ============================================================
      - name: Connect KernelSU Kconfig
        run: |
          set -euo pipefail

          if grep -q 'source "KernelSU/Kconfig"' Kconfig; then
            echo "KernelSU Kconfig already connected."
          else
            echo "" >> Kconfig
            echo 'source "KernelSU/Kconfig"' >> Kconfig
            echo "KernelSU Kconfig connected."
          fi

          echo ""
          grep -n 'KernelSU/Kconfig' Kconfig

      # ============================================================
      # 10. CLONE SUSFS
      # ============================================================
      - name: Clone SUSFS
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            --branch gki-android12-5.10 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            susfs

          echo "=========================================="
          echo "SUSFS SOURCE"
          echo "=========================================="

          cd susfs

          echo "Commit:"
          git log -1 --oneline

          echo ""
          echo "Commit hash:"
          git rev-parse HEAD

          echo ""
          echo "Branch:"
          git branch --show-current || true

          echo ""
          echo "SUSFS patch files:"
          find kernel_patches \
            -type f \
            | sort

      # ============================================================
      # 11. DETECT SUSFS 5.10 PATCH
      # ============================================================
      - name: Locate SUSFS 5.10 kernel patch
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SEARCHING SUSFS 5.10 PATCH"
          echo "=========================================="

          PATCH_FILE="susfs/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch"

          if [ ! -f "$PATCH_FILE" ]; then
            echo "ERROR: SUSFS 5.10 GKI patch not found."
            echo ""
            echo "Available SUSFS patches:"
            find susfs/kernel_patches \
              -type f \
              -name '*.patch' \
              | sort
            exit 1
          fi

          echo "SUSFS patch found:"
          echo "$PATCH_FILE"

          echo "SUSFS_PATCH=$PATCH_FILE" >> "$GITHUB_ENV"

      # ============================================================
      # 12. VERIFY SUSFS PATCH METADATA
      # ============================================================
      - name: Inspect SUSFS kernel patch
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SUSFS KERNEL PATCH"
          echo "=========================================="

          test -n "${SUSFS_PATCH:-}"
          test -f "$SUSFS_PATCH"

          echo ""
          echo "Patch:"
          echo "$SUSFS_PATCH"

          echo ""
          echo "Patch size:"
          ls -lh "$SUSFS_PATCH"

          echo ""
          echo "Patch header:"
          sed -n '1,80p' "$SUSFS_PATCH"

      # ============================================================
      # 13. VERIFY SUSFS KERNELSU PATCH
      # ============================================================
      - name: Locate SUSFS KernelSU patch
        run: |
          set -euo pipefail

          PATCH_KSU="susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

          if [ ! -f "$PATCH_KSU" ]; then
            echo "ERROR: SUSFS KernelSU patch not found."
            exit 1
          fi

          echo "=========================================="
          echo "SUSFS KERNELSU PATCH"
          echo "=========================================="

          echo "Patch:"
          echo "$PATCH_KSU"

          echo ""
          echo "Patch size:"
          ls -lh "$PATCH_KSU"

          echo ""
          echo "Patch header:"
          sed -n '1,100p' "$PATCH_KSU"

          echo "SUSFS_KSU_PATCH=$PATCH_KSU" >> "$GITHUB_ENV"

      # ============================================================
      # 14. DRY-RUN SUSFS KERNEL PATCH
      # ============================================================
      - name: Test SUSFS kernel patch
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TESTING SUSFS KERNEL PATCH"
          echo "=========================================="

          patch \
            --dry-run \
            --forward \
            -p1 \
            < "$SUSFS_PATCH" \
            2>&1 | tee susfs-kernel-dryrun.log

          echo ""
          echo "SUSFS kernel patch dry-run PASSED."

      # ============================================================
      # 15. APPLY SUSFS KERNEL PATCH
      # ============================================================
      - name: Apply SUSFS kernel patch
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "APPLYING SUSFS KERNEL PATCH"
          echo "=========================================="

          patch \
            --forward \
            -p1 \
            < "$SUSFS_PATCH" \
            2>&1 | tee susfs-kernel-patch.log

          echo ""
          echo "SUSFS kernel patch applied successfully."

      # ============================================================
      # 16. DRY-RUN SUSFS KERNELSU PATCH
      # ============================================================
      - name: Test SUSFS KernelSU patch
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TESTING SUSFS KERNELSU PATCH"
          echo "=========================================="

          cd KernelSU

          patch \
            --dry-run \
            --forward \
            -p1 \
            < "../$SUSFS_KSU_PATCH" \
            2>&1 | tee ../susfs-ksu-dryrun.log

          cd ..

          echo ""
          echo "SUSFS KernelSU patch dry-run PASSED."

      # ============================================================
      # 17. APPLY SUSFS KERNELSU PATCH
      # ============================================================
      - name: Apply SUSFS KernelSU patch
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "APPLYING SUSFS KERNELSU PATCH"
          echo "=========================================="

          cd KernelSU

          patch \
            --forward \
            -p1 \
            < "../$SUSFS_KSU_PATCH" \
            2>&1 | tee ../susfs-ksu-patch.log

          cd ..

          echo ""
          echo "SUSFS KernelSU patch applied successfully."

      # ============================================================
      # 18. VERIFY SUSFS SOURCE
      # ============================================================
      - name: Verify SUSFS source
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY SUSFS SOURCE"
          echo "=========================================="

          echo ""
          echo "SUSFS source files:"

          test -f fs/susfs.c
          test -f include/linux/susfs.h
          test -f include/linux/susfs_def.h

          ls -lh \
            fs/susfs.c \
            include/linux/susfs.h \
            include/linux/susfs_def.h

          echo ""
          echo "SUSFS references:"

          grep -R \
            "susfs" \
            fs \
            include/linux \
            KernelSU \
            -n \
            2>/dev/null \
            | head -n 100 \
            || true

      # ============================================================
      # 19. VERIFY BAKASU + SUSFS KCONFIG
      # ============================================================
      - name: Verify Kconfig integration
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "KCONFIG CHECK"
          echo "=========================================="

          echo ""
          echo "Root Kconfig:"
          grep -n \
            'KernelSU/Kconfig' \
            Kconfig

          echo ""
          echo "KernelSU Kconfig SUSFS entries:"

          grep -R \
            "KSU_SUSFS" \
            KernelSU \
            -n \
            2>/dev/null \
            | head -n 100 \
            || true

      # ============================================================
      # 20. REGENERATE CONFIG
      # ============================================================
      - name: Regenerate kernel configuration
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "REGENERATING CONFIG"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          test -f out/.config

          echo ""
          echo "KSU/SUSFS configuration:"
          grep -E \
            '^CONFIG_KSU=|^CONFIG_KSU_SUSFS=|^CONFIG_KSU_SUSFS_' \
            out/.config \
            || true

      # ============================================================
      # 21. ENABLE KSU + SUSFS
      # ============================================================
      - name: Enable BakaSU SUSFS configuration
        run: |
          set -euo pipefail

          CONFIG="out/.config"

          echo "=========================================="
          echo "ENABLING KSU + SUSFS"
          echo "=========================================="

          scripts/config \
            --enable CONFIG_KSU

          scripts/config \
            --enable CONFIG_KSU_SUSFS

          # Keep SUS_SU disabled unless the source explicitly
          # requires another implementation.
          scripts/config \
            --disable CONFIG_KSU_SUSFS_SUS_SU \
            || true

          # Magic mount support when available.
          scripts/config \
            --enable CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT \
            || true

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          echo ""
          echo "Final requested configuration:"

          grep -E \
            '^CONFIG_KSU=|^CONFIG_KSU_SUSFS=|^CONFIG_KSU_SUSFS_' \
            out/.config \
            || true

      # ============================================================
      # 22. HARD VALIDATION
      # ============================================================
      - name: Validate KSU SUSFS configuration
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "HARD CONFIG VALIDATION"
          echo "=========================================="

          echo ""
          echo "Checking CONFIG_KSU..."

          grep -q '^CONFIG_KSU=y' out/.config

          echo "CONFIG_KSU=y OK"

          echo ""
          echo "Checking CONFIG_KSU_SUSFS..."

          grep -q '^CONFIG_KSU_SUSFS=y' out/.config

          echo "CONFIG_KSU_SUSFS=y OK"

          echo ""
          echo "=========================================="
          echo "KSU + SUSFS CONFIGURATION VALID"
          echo "=========================================="

      # ============================================================
      # 23. BUILD KERNEL
      # ============================================================
      - name: Build kernel
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILDING POCO F5 MARBLE"
          echo "=========================================="
          echo ""
          echo "Target:"
          echo "  ARM64"
          echo "  BakaSU"
          echo "  SUSFS"
          echo "  LLVM 22.1.8"
          echo ""

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"$(nproc)" \
            Image.gz \
            dtbs \
            2>&1 | tee build.log

      # ============================================================
      # 24. VERIFY KERNEL IMAGE
      # ============================================================
      - name: Verify kernel image
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY KERNEL IMAGE"
          echo "=========================================="

          test -f out/arch/arm64/boot/Image

          echo ""
          echo "Image:"
          ls -lh out/arch/arm64/boot/Image

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            echo ""
            echo "Image.gz:"
            ls -lh out/arch/arm64/boot/Image.gz
          fi

      # ============================================================
      # 25. FINAL CONFIGURATION
      # ============================================================
      - name: Verify final configuration
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FINAL KERNEL CONFIG"
          echo "=========================================="

          grep -E \
            '^CONFIG_KSU=|^CONFIG_KSU_SUSFS=|^CONFIG_KSU_SUSFS_' \
            out/.config \
            || true

      # ============================================================
      # 26. COLLECT ARTIFACTS
      # ============================================================
      - name: Collect artifacts
        run: |
          set -euo pipefail

          rm -rf artifacts
          mkdir -p artifacts

          echo "=========================================="
          echo "COLLECTING ARTIFACTS"
          echo "=========================================="

          cp \
            out/arch/arm64/boot/Image \
            artifacts/Image

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp \
              out/arch/arm64/boot/Image.gz \
              artifacts/Image.gz
          fi

          cp \
            out/.config \
            artifacts/kernel.config

          cp \
            build.log \
            artifacts/build.log

          cp \
            susfs-kernel-dryrun.log \
            artifacts/susfs-kernel-dryrun.log

          cp \
            susfs-ksu-dryrun.log \
            artifacts/susfs-ksu-dryrun.log

          cp \
            susfs-kernel-patch.log \
            artifacts/susfs-kernel-patch.log

          cp \
            susfs-ksu-patch.log \
            artifacts/susfs-ksu-patch.log

          echo ""
          echo "Collecting DTB / DTBO..."

          find out/arch/arm64/boot \
            -type f \
            \( \
              -name "*.dtb" \
              -o -name "*.dtbo" \
            \) \
            -exec cp {} artifacts/ \; \
            || true

          echo ""
          echo "Artifacts:"
          ls -lh artifacts

      # ============================================================
      # 27. GENERATE SHA256
      # ============================================================
      - name: Generate SHA256
        run: |
          set -euo pipefail

          cd artifacts

          sha256sum * \
            | tee SHA256SUMS.txt

      # ============================================================
      # 28. UPLOAD KERNEL ARTIFACTS
      # ============================================================
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: POCO-F5-Marble-BakaSU-SUSFS-Kernel
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # 29. UPLOAD LOGS
      # ============================================================
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: POCO-F5-Marble-BakaSU-SUSFS-Logs
          path: |
            build.log
            susfs-kernel-dryrun.log
            susfs-ksu-dryrun.log
            susfs-kernel-patch.log
            susfs-ksu-patch.log
            out/.config
          if-no-files-found: warn
          retention-days: 7