name: Build POCO F5 Marble BakaSU

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Marble Kernel with BakaSU
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout Marble Kernel
        uses: actions/checkout@v4
        with:
          repository: Pzqqt/android_kernel_xiaomi_marble
          ref: melt-rebase
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            rsync \
            unzip \
            zip

      - name: Show Kernel Information
        run: |
          echo "======================================"
          echo "POCO F5 / MARBLE"
          echo "======================================"

          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Kernel version:"
          make kernelversion

          echo
          echo "Defconfig:"
          ls arch/arm64/configs/ | grep marble

      - name: Prepare Defconfig
        run: |
          export ARCH=arm64

          mkdir -p out

          make O=out marble_defconfig

          echo
          echo "Initial configuration:"
          grep -E \
            "CONFIG_ARM64|CONFIG_LTO_CLANG|CONFIG_CFI" \
            out/.config || true

      - name: Integrate BakaSU
        run: |
          echo "======================================"
          echo "Installing BakaSU"
          echo "======================================"

          git clone \
            --depth=1 \
            https://github.com/Baka-SU/BakaSU.git \
            bakasu

          echo
          echo "BakaSU repository:"
          cd bakasu
          git rev-parse HEAD

          echo
          echo "BakaSU directories:"
          ls -lah

          cd ..

          echo
          echo "Checking BakaSU kernel directory..."

          if [ ! -d "bakasu/kernel" ]; then
            echo "ERROR: BakaSU kernel directory not found."
            exit 1
          fi

          echo "BakaSU kernel directory found."

      - name: Integrate BakaSU Kernel
        run: |
          echo "======================================"
          echo "Integrating BakaSU kernel"
          echo "======================================"

          mkdir -p KernelSU

          cp -a bakasu/kernel/. KernelSU/

          echo
          echo "BakaSU kernel files:"
          find KernelSU -maxdepth 2 -type f | head -100

      - name: Connect KernelSU to Kernel Build
        run: |
          echo "======================================"
          echo "Preparing KernelSU integration"
          echo "======================================"

          if [ ! -f "KernelSU/Kconfig" ]; then
            echo "ERROR: KernelSU/Kconfig not found."
            exit 1
          fi

          if [ ! -f "KernelSU/Makefile" ]; then
            echo "ERROR: KernelSU/Makefile not found."
            exit 1
          fi

          echo "KernelSU Kconfig found."
          echo "KernelSU Makefile found."

          echo
          echo "Searching existing KernelSU references..."

          grep -R \
            "KernelSU" \
            arch/arm64/Kconfig \
            drivers/Kconfig \
            drivers/Makefile \
            2>/dev/null || true

      - name: Configure BakaSU
        run: |
          export ARCH=arm64

          echo "======================================"
          echo "Enabling BakaSU"
          echo "======================================"

          if grep -q "^CONFIG_KSU=" out/.config; then
            sed -i 's/^CONFIG_KSU=.*/CONFIG_KSU=y/' out/.config
          else
            echo "CONFIG_KSU=y" >> out/.config
          fi

          if grep -q "^CONFIG_KSU_MANUAL_HOOK=" out/.config; then
            sed -i 's/^CONFIG_KSU_MANUAL_HOOK=.*/CONFIG_KSU_MANUAL_HOOK=y/' out/.config
          else
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> out/.config
          fi

          make O=out olddefconfig

          echo
          echo "BakaSU configuration:"
          grep -E \
            "^CONFIG_KSU" \
            out/.config || true

      - name: Build Kernel
        run: |
          export ARCH=arm64

          echo "======================================"
          echo "BUILDING KERNEL"
          echo "======================================"

          make \
            O=out \
            -j$(nproc) \
            Image.gz \
            dtbs \
            2>&1 | tee build.log

      - name: Verify Build
        if: always()
        run: |
          echo "======================================"
          echo "BUILD RESULT"
          echo "======================================"

          echo
          echo "Kernel files:"
          find out/arch/arm64/boot \
            -maxdepth 3 \
            -type f \
            2>/dev/null || true

          echo
          echo "BakaSU configuration:"
          grep -E \
            "^CONFIG_KSU" \
            out/.config || true

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bakasu-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload Kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: marble-bakasu-test
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dts/**/*.dtb
            out/arch/arm64/boot/dts/**/*.dtbo
            out/.config
          if-no-files-found: warn
