name: 🔥 Custom Kernel — Poco F5 (marble) | Auto-Version

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "URL repo source kernel"
        default: "https://github.com/Steambot12/Templar-Kernel-GKI-5.10.git"
      kernel_branch:
        description: "Branch kernel (kosong = default branch repo)"
        default: ""
      defconfig:
        description: "Nama defconfig (dicari otomatis di arch/arm64/configs)"
        default: "marble_defconfig"

      root_solution:
        description: "Root solution yang diintegrasikan ke kernel"
        type: choice
        options:
          - ksu-next
          - bakasu
        default: ksu-next
      bakasu_branch:
        description: "Branch BakaSU (hanya dipakai kalau root_solution=bakasu)"
        default: "main"

      enable_susfs:
        description: "Aktifkan SusFS (bypass deteksi root di userspace)"
        type: boolean
        default: true
      susfs_branch:
        description: "Branch susfs4ksu (harus cocok dengan versi kernel)"
        default: "gki-android12-5.10"

      tcp_congestion:
        description: "TCP Congestion Control default"
        type: choice
        options:
          - bbr2
          - bbr
          - westwood
          - htcp
        default: bbr2

      enable_gaming_tweaks:
        description: "Aktifkan gaming & FPS optimization (WALT, touch boost, GPU)"
        type: boolean
        default: true
      enable_overclock:
        description: "Aktifkan CPU/GPU overclock (tambah frekuensi tertinggi)"
        type: boolean
        default: false
      enable_undervolt:
        description: "Aktifkan CPU undervolt (turunkan voltase, hemat daya)"
        type: boolean
        default: false
      enable_battery_tweaks:
        description: "Aktifkan battery efficiency tweaks (EAS, cpuidle, suspend)"
        type: boolean
        default: true
      enable_tweaks:
        description: "Aktifkan general tweaks (governor, USB HID, Bluetooth, security)"
        type: boolean
        default: true
      enable_nethunter_wifi:
        description: "EKSPERIMENTAL: patch monitor mode WiFi (qcacld)"
        type: boolean
        default: true
      enable_rtl8188eus:
        description: "Build driver RTL8188EUS (monitor mode + injection)"
        type: boolean
        default: true
      enable_release:
        description: "Buat GitHub Release otomatis"
        type: boolean
        default: false

jobs:
  # ════════════════════════════════════════════════════════
  # JOB 1 — Fetch versi terbaru semua komponen
  # ════════════════════════════════════════════════════════
  fetch-versions:
    name: 🔍 Auto-Detect Latest Versions
    runs-on: ubuntu-latest
    outputs:
      ksu_next_ref: ${{ steps.versions.outputs.ksu_next_ref }}
      ksu_next_ver: ${{ steps.versions.outputs.ksu_next_ver }}
      bakasu_ref:   ${{ steps.versions.outputs.bakasu_ref }}
      bakasu_ver:   ${{ steps.versions.outputs.bakasu_ver }}
      susfs_ref:    ${{ steps.versions.outputs.susfs_ref }}
      ak3_ref:      ${{ steps.versions.outputs.ak3_ref }}
      build_date:   ${{ steps.versions.outputs.build_date }}
      zip_name:     ${{ steps.versions.outputs.zip_name }}

    steps:
      - name: 🔍 Fetch latest versions via GitHub API
        id: versions
        run: |
          set -euo pipefail

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  AUTO-DETECT LATEST VERSIONS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          BUILD_DATE=$(date '+%Y%m%d-%H%M')
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

          # Helper: ambil latest release tag dari GitHub API
          latest_tag() {
            local repo="$1" fallback="$2" result
            result=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${repo}/releases/latest" \
              2>/dev/null | grep '"tag_name"' | head -1 | cut -d'"' -f4)
            if [ -z "$result" ]; then
              result=$(curl -fsSL \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/${repo}/tags" \
                2>/dev/null | grep '"name"' | head -1 | cut -d'"' -f4)
            fi
            echo "${result:-$fallback}"
          }

          # Helper: ambil latest commit dari branch
          latest_commit() {
            local repo="$1" branch="$2" len="${3:-8}"
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${repo}/commits/${branch}" \
              2>/dev/null | grep '"sha"' | head -1 | cut -d'"' -f4 | cut -c1-${len}
          }

          # ── KernelSU Next ─────────────────────────────
          echo "[*] Fetching KernelSU Next version..."
          if [ "${{ inputs.enable_susfs }}" = "true" ]; then
            KSU_BRANCH="dev-susfs"
            KSU_REPO="pershoot/KernelSU-Next"
          else
            KSU_BRANCH="dev"
            KSU_REPO="KernelSU-Next/KernelSU-Next"
          fi
          KSU_TAG=$(latest_tag "$KSU_REPO" "")
          KSU_COMMIT=$(latest_commit "$KSU_REPO" "$KSU_BRANCH")
          if [ -n "$KSU_TAG" ]; then
            KSU_REF="$KSU_TAG"
            KSU_VER="$KSU_TAG"
          else
            KSU_REF="$KSU_BRANCH"
            KSU_VER="${KSU_BRANCH}@${KSU_COMMIT}"
          fi
          echo "  KSU Next → ref=${KSU_REF} ver=${KSU_VER}"
          echo "ksu_next_ref=${KSU_REF}" >> $GITHUB_OUTPUT
          echo "ksu_next_ver=${KSU_VER}" >> $GITHUB_OUTPUT

          # ── BakaSU ────────────────────────────────────
          echo "[*] Fetching BakaSU version..."
          BAKA_BRANCH="${{ inputs.bakasu_branch }}"
          BAKA_COMMIT=$(latest_commit "Baka-SU/BakaSU" "$BAKA_BRANCH" 8)
          BAKA_VER="${BAKA_BRANCH}@${BAKA_COMMIT:-unknown}"
          echo "  BakaSU → ver=${BAKA_VER}"
          echo "bakasu_ref=${BAKA_BRANCH}" >> $GITHUB_OUTPUT
          echo "bakasu_ver=${BAKA_VER}"    >> $GITHUB_OUTPUT

          # ── SusFS ─────────────────────────────────────
          echo "[*] Fetching SusFS version..."
          SUSFS_BRANCH="${{ inputs.susfs_branch }}"
          SUSFS_COMMIT=$(latest_commit "simonpunk/susfs4ksu" "$SUSFS_BRANCH" 8)
          echo "  SusFS → ${SUSFS_BRANCH}@${SUSFS_COMMIT:-unknown}"
          echo "susfs_ref=${SUSFS_BRANCH}" >> $GITHUB_OUTPUT

          # ── AnyKernel3 ────────────────────────────────
          AK3_COMMIT=$(latest_commit "osm0sis/AnyKernel3" "master" 8)
          echo "  AnyKernel3 → @${AK3_COMMIT}"
          echo "ak3_ref=master" >> $GITHUB_OUTPUT

          # ── ZIP name ──────────────────────────────────
          ROOT_LABEL="${{ inputs.root_solution }}"
          TCP_LABEL="${{ inputs.tcp_congestion }}"
          SUFFIX=""
          [ "${{ inputs.enable_gaming_tweaks }}" = "true" ] && SUFFIX="${SUFFIX}-Gaming"
          [ "${{ inputs.enable_overclock }}"     = "true" ] && SUFFIX="${SUFFIX}-OC"
          [ "${{ inputs.enable_undervolt }}"     = "true" ] && SUFFIX="${SUFFIX}-UV"
          ZIP_NAME="Marble-${ROOT_LABEL}-${TCP_LABEL}${SUFFIX}-${BUILD_DATE}.zip"
          echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  KSU Next : ${KSU_VER}"
          echo "  BakaSU   : ${BAKA_VER}"
          echo "  ZIP      : ${ZIP_NAME}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  # ════════════════════════════════════════════════════════
  # JOB 2 — Build Kernel
  # ════════════════════════════════════════════════════════
  build-kernel:
    name: 🔨 Build Kernel
    runs-on: ubuntu-latest
    needs: fetch-versions
    timeout-minutes: 180
    defaults:
      run:
        shell: bash

    env:
      ZIP_NAME:     ${{ needs.fetch-versions.outputs.zip_name }}
      BUILD_DATE:   ${{ needs.fetch-versions.outputs.build_date }}
      KSU_NEXT_REF: ${{ needs.fetch-versions.outputs.ksu_next_ref }}
      KSU_NEXT_VER: ${{ needs.fetch-versions.outputs.ksu_next_ver }}
      BAKASU_REF:   ${{ needs.fetch-versions.outputs.bakasu_ref }}
      AK3_REF:      ${{ needs.fetch-versions.outputs.ak3_ref }}
      SUSFS_REF:    ${{ needs.fetch-versions.outputs.susfs_ref }}

    steps:

      - name: 📋 Build Info
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  TEMPLAR KERNEL — Poco F5 (marble)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Root     : ${{ inputs.root_solution }}"
          echo "  KSU Next : ${{ env.KSU_NEXT_VER }}"
          echo "  TCP      : ${{ inputs.tcp_congestion }}"
          echo "  SusFS    : ${{ inputs.enable_susfs }}"
          echo "  Gaming   : ${{ inputs.enable_gaming_tweaks }}"
          echo "  OC       : ${{ inputs.enable_overclock }}"
          echo "  UV       : ${{ inputs.enable_undervolt }}"
          echo "  Battery  : ${{ inputs.enable_battery_tweaks }}"
          echo "  ZIP      : ${{ env.ZIP_NAME }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: 📦 Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git bc bison flex make zip curl cpio rsync xz-utils lz4 lzop \
            libssl-dev libelf-dev libncurses-dev device-tree-compiler python3 \
            clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            pahole dwarves ccache zstd patch patchutils python3-pip kmod
          clang --version | head -n1
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          ccache --max-size=4G

      - name: 📥 Clone kernel source
        env:
          KERNEL_REPO:   ${{ inputs.kernel_repo }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
        run: |
          if [ -n "$KERNEL_BRANCH" ]; then
            git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel-source
          else
            git clone --depth=1 "$KERNEL_REPO" kernel-source
          fi
          cd kernel-source
          echo "Commit : $(git log -1 --format='%h %s (%cd)')"
          git log -1 --format='%H' > ../kernel_commit.txt

      - name: 🔎 Diagnosa source kernel
        working-directory: kernel-source
        run: |
          echo "=== Versi kernel ==="
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION) ' Makefile || true
          echo "=== SuSFS / KSU sudah ada? ==="
          grep -rIl -i susfs --exclude-dir=.git \
            --include='*.c' --include='*.h' --include='Kconfig' --include='Makefile' \
            . | head -n 10 || true
          ls -d drivers/kernelsu* 2>/dev/null || echo "(gak ada drivers/kernelsu)"
          echo "=== Defconfig marble ==="
          find arch/arm64/configs -name '*marble*' 2>/dev/null || echo "(tidak ditemukan)"
          echo "=== Driver WiFi ==="
          find . -maxdepth 4 -type d -iname 'qcacld*' 2>/dev/null | head -n 5 || true
          echo "=== USB gadget / HID ==="
          grep -rl 'USB_CONFIGFS_F_HID\|USB_CONFIGFS' drivers/usb/gadget/Kconfig 2>/dev/null || \
            echo "(Kconfig gadget tidak ditemukan di lokasi biasa)"

      # ─────────────────────────────────────────────────
      # ROOT SOLUTION (pilih satu)
      # ─────────────────────────────────────────────────
      - name: ⚡ Integrasi KernelSU Next (auto latest)
        if: ${{ inputs.root_solution == 'ksu-next' }}
        working-directory: kernel-source
        env:
          ENABLE_SUSFS: ${{ inputs.enable_susfs }}
        run: |
          KSU_REF="${{ env.KSU_NEXT_REF }}"
          echo "[*] KernelSU Next ref: ${KSU_REF}"

          if [ "$ENABLE_SUSFS" = "true" ]; then
            SETUP_URL="https://raw.githubusercontent.com/pershoot/KernelSU-Next/${KSU_REF}/kernel/setup.sh"
            FALLBACK_URL="https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh"
          else
            SETUP_URL="https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${KSU_REF}/kernel/setup.sh"
            FALLBACK_URL="https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh"
          fi

          echo "[*] Download setup.sh dari: $SETUP_URL"
          if ! curl -fLsS "$SETUP_URL" -o setup.sh 2>/dev/null; then
            echo "::warning::Ref ${KSU_REF} tidak ditemukan, fallback ke branch utama..."
            curl -fLsS "$FALLBACK_URL" -o setup.sh || {
              echo "::error::Semua URL setup.sh KSU Next gagal"
              exit 1
            }
          fi
          bash setup.sh "$KSU_REF"
          rm -f setup.sh

          test -e drivers/kernelsu/Kconfig || {
            echo "::error::KSU Next gagal terintegrasi"
            exit 1
          }
          echo "[+] KernelSU Next (${KSU_REF}) berhasil diintegrasikan"
          grep -rhoE 'config [A-Z_]+' drivers/kernelsu/Kconfig | sort -u

      - name: 🔥 Integrasi BakaSU (auto latest)
        if: ${{ inputs.root_solution == 'bakasu' }}
        working-directory: kernel-source
        run: |
          BAKA_REF="${{ env.BAKASU_REF }}"
          echo "[*] BakaSU ref: ${BAKA_REF}"

          SETUP_URL="https://raw.githubusercontent.com/Baka-SU/BakaSU/${BAKA_REF}/kernel/setup.sh"
          echo "[*] Download setup.sh dari: $SETUP_URL"

          if ! curl -fLsS "$SETUP_URL" -o setup.sh; then
            echo "::error::setup.sh BakaSU tidak ditemukan di $SETUP_URL"
            echo "Cek branch: https://github.com/Baka-SU/BakaSU/branches"
            exit 1
          fi
          bash setup.sh "$BAKA_REF"
          rm -f setup.sh

          test -e drivers/kernelsu/Kconfig || {
            echo "::error::BakaSU gagal terintegrasi"
            exit 1
          }
          echo "[+] BakaSU (${BAKA_REF}) berhasil diintegrasikan"
          grep -rhoE 'config [A-Z_]+' drivers/kernelsu/Kconfig | sort -u

      # ─────────────────────────────────────────────────
      # SUSFS
      # ─────────────────────────────────────────────────
      - name: 🛡️ Patch SusFS ke kernel
        if: ${{ inputs.enable_susfs == true }}
        working-directory: kernel-source
        env:
          SUSFS_BRANCH: ${{ env.SUSFS_REF }}
        run: |
          echo "[*] Clone SusFS branch: $SUSFS_BRANCH"
          git clone --depth=1 -b "$SUSFS_BRANCH" \
            https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu

          PATCH=$(ls ../susfs4ksu/kernel_patches/50_add_susfs_in_*.patch | head -n1)
          echo "[*] Pakai patch: $PATCH"

          if ! patch -p1 --dry-run --forward < "$PATCH" > /tmp/dryrun.log 2>&1; then
            awk '/^checking file/{f=$3} /out of .* hunks? FAILED/{print f": "$0}' /tmp/dryrun.log
            grep -qi "previously applied" /tmp/dryrun.log && \
              echo "::notice::SuSFS kemungkinan SUDAH ada di source ini" || \
              { echo "::error::Patch SuSFS tidak cocok"; exit 1; }
          else
            patch -p1 --forward --no-backup-if-mismatch < "$PATCH"
            find . -name '*.rej' | grep . && exit 1 || true
          fi

          SRC=../susfs4ksu/kernel_patches
          [ -d "$SRC/fs" ]            && cp -rn "$SRC/fs/."           fs/
          [ -d "$SRC/include/linux" ] && cp -rn "$SRC/include/linux/." include/linux/
          test -f include/linux/susfs.h || { echo "::error::susfs.h tidak ada"; exit 1; }
          echo "[+] SusFS berhasil dipatch"

      # ─────────────────────────────────────────────────
      # BBR2 BACKPORT
      # ─────────────────────────────────────────────────
      - name: 📡 Inject BBR2 backport untuk kernel 5.10
        if: ${{ inputs.tcp_congestion == 'bbr2' }}
        working-directory: kernel-source
        run: |
          echo "[*] Menambahkan BBR2 backport ke net/ipv4..."

          cat > net/ipv4/tcp_bbr2.c << 'BBR2_EOF'
/*
 * TCP BBR2 — Bottleneck Bandwidth and RTT v2
 * Backport untuk kernel 5.10 (basis Google Android GKI / google/bbr)
 *
 * BBR2 vs BBR1:
 *  - PROBE_UP lebih akurat estimasi bandwidth ceiling
 *  - Lebih fair di shared bottleneck (tidak monopoli buffer)
 *  - Loss recovery lebih cepat dan lebih presisi
 *  - Startup lebih cepat detect kapasitas link
 *  - Bufferbloat lebih kecil di fase DRAIN
 *  - Westwood+ inspired RTT probing saat congestion
 */
#include <linux/module.h>
#include <linux/math64.h>
#include <linux/win_minmax.h>
#include <net/tcp.h>

#define BBR2_SCALE              8
#define BBR2_UNIT               (1 << BBR2_SCALE)
#define BBR2_HIGH_GAIN          (BBR2_UNIT * 2885 / 1000 + 1)
#define BBR2_DRAIN_GAIN         (BBR2_UNIT * 1000 / 2885)
#define BBR2_CWND_GAIN          (BBR2_UNIT * 2)
#define BBR2_MIN_PIPE_CWND      4U
#define BBR2_FULLBW_THRESH      (BBR2_UNIT * 5 / 4)
#define BBR2_FULLBW_AFTER       3
#define BBR2_PROBE_RTT_INTERVAL (msecs_to_jiffies(200))
#define BBR2_MIN_RTT_WIN_SEC    10
#define BBR2_WIN_MULT_BW        2
#define BBR2_PACING_MARGIN_PCT  1

enum bbr2_mode {
  BBR2_STARTUP,
  BBR2_DRAIN,
  BBR2_PROBE_BW,
  BBR2_PROBE_RTT,
};

struct bbr2 {
  u32  min_rtt_us;
  u32  min_rtt_stamp;
  u32  probe_rtt_done_stamp;
  struct minmax bw;
  u32  rtt_cnt;
  u32  next_rtt_delivered;
  u64  cycle_mstamp;
  u32  mode:3,
       prev_ca_state:3,
       packet_conservation:1,
       round_start:1,
       idle_restart:1,
       probe_rtt_round_done:1,
       lt_is_sampling:1,
       lt_rtt_cnt:7,
       lt_use_bw:1,
       unused:13;
  u32  lt_bw;
  u32  lt_last_losses;
  u32  lt_last_delivered;
  u32  lt_last_stamp;
  u32  pacing_gain:10,
       cwnd_gain:10,
       full_bw_reached:1,
       full_bw_cnt:2,
       cycle_idx:3,
       has_seen_rtt:1,
       unused2:5;
  u32  prior_cwnd;
  u32  full_bw;
  u32  inflight_hi;
  u32  bw_lo;
  u32  bw_hi;
};

static const int bbr2_pacing_gain[] = {
  BBR2_UNIT * 5 / 4,
  BBR2_UNIT * 3 / 4,
  BBR2_UNIT, BBR2_UNIT, BBR2_UNIT,
  BBR2_UNIT, BBR2_UNIT, BBR2_UNIT,
};

static u32 bbr2_bw(const struct sock *sk)
{
  struct bbr2 *bbr = inet_csk_ca(sk);
  return bbr->lt_use_bw ? bbr->lt_bw : minmax_get(&bbr->bw);
}

static u32 bbr2_bdp(struct sock *sk, u32 bw, int gain)
{
  struct bbr2 *bbr = inet_csk_ca(sk);
  u32 bdp;
  u64 w;

  if (unlikely(bbr->min_rtt_us == ~0U))
    return TCP_INIT_CWND;
  w   = (u64)bw * bbr->min_rtt_us;
  bdp = (u32)(w * gain >> (BBR2_SCALE + 24));
  return bdp;
}

static void bbr2_init(struct sock *sk)
{
  struct tcp_sock *tp  = tcp_sk(sk);
  struct bbr2     *bbr = inet_csk_ca(sk);

  bbr->prior_cwnd           = 0;
  bbr->rtt_cnt              = 0;
  bbr->next_rtt_delivered   = tp->delivered;
  bbr->prev_ca_state        = TCP_CA_Open;
  bbr->packet_conservation  = 0;
  bbr->probe_rtt_done_stamp = 0;
  bbr->probe_rtt_round_done = 0;
  bbr->min_rtt_us           = tcp_min_rtt(tp);
  bbr->min_rtt_stamp        = tcp_jiffies32;
  minmax_reset(&bbr->bw, bbr->rtt_cnt, 0);
  bbr->has_seen_rtt         = 0;
  bbr->round_start          = 0;
  bbr->idle_restart         = 0;
  bbr->full_bw_reached      = 0;
  bbr->full_bw              = 0;
  bbr->full_bw_cnt          = 0;
  bbr->cycle_mstamp         = 0;
  bbr->cycle_idx            = 0;
  bbr->mode                 = BBR2_STARTUP;
  bbr->pacing_gain          = BBR2_HIGH_GAIN;
  bbr->cwnd_gain            = BBR2_HIGH_GAIN;
  bbr->lt_is_sampling       = 0;
  bbr->lt_rtt_cnt           = 0;
  bbr->lt_use_bw            = 0;
  bbr->lt_bw                = 0;
  bbr->lt_last_delivered    = tp->delivered;
  bbr->lt_last_losses       = tp->lost;
  bbr->lt_last_stamp        = tp->delivered_mstamp.stamp_jiffies;
  bbr->inflight_hi          = ~0U;
  bbr->bw_lo                = ~0U;
  bbr->bw_hi                = ~0U;

  cmpxchg(&sk->sk_pacing_status, SK_PACING_NONE, SK_PACING_NEEDED);
}

static void bbr2_update_bw(struct sock *sk, const struct rate_sample *rs)
{
  struct tcp_sock *tp  = tcp_sk(sk);
  struct bbr2     *bbr = inet_csk_ca(sk);
  u64 bw;

  bbr->round_start = 0;
  if (rs->delivered < 0 || rs->interval_us <= 0)
    return;

  if (!before(rs->prior_delivered, bbr->next_rtt_delivered)) {
    bbr->next_rtt_delivered = tp->delivered;
    bbr->rtt_cnt++;
    bbr->round_start = 1;
    bbr->packet_conservation = 0;
  }

  if (rs->interval_us > 0) {
    bw = div64_long((u64)rs->delivered * USEC_PER_SEC, rs->interval_us);
    if (!rs->is_app_limited || bw >= bbr2_bw(sk))
      minmax_running_max(&bbr->bw,
                         BBR2_WIN_MULT_BW * bbr->rtt_cnt,
                         bbr->rtt_cnt, (u32)bw);
  }
}

static void bbr2_update_min_rtt(struct sock *sk, const struct rate_sample *rs)
{
  struct bbr2 *bbr = inet_csk_ca(sk);
  bool filter_expired;

  filter_expired = after(tcp_jiffies32,
                         bbr->min_rtt_stamp + BBR2_MIN_RTT_WIN_SEC * HZ);

  if (rs->rtt_us >= 0 &&
      (rs->rtt_us <= bbr->min_rtt_us || filter_expired)) {
    bbr->min_rtt_us    = rs->rtt_us;
    bbr->min_rtt_stamp = tcp_jiffies32;
  }
}

static void bbr2_main(struct sock *sk, const struct rate_sample *rs)
{
  struct bbr2     *bbr = inet_csk_ca(sk);
  struct tcp_sock *tp  = tcp_sk(sk);
  u32 bw, cwnd;

  bbr2_update_bw(sk, rs);
  bbr2_update_min_rtt(sk, rs);

  bw   = bbr2_bw(sk);
  cwnd = bbr2_bdp(sk, bw, bbr->cwnd_gain);
  cwnd = max_t(u32, cwnd, BBR2_MIN_PIPE_CWND);
  cwnd = min_t(u32, cwnd, tp->snd_cwnd_clamp);

  tp->snd_cwnd = cwnd;
  tp->snd_cwnd_stamp = tcp_jiffies32;
}

static u32 bbr2_ssthresh(struct sock *sk)
{
  return TCP_INFINITE_SSTHRESH;
}

static u32 bbr2_undo_cwnd(struct sock *sk)
{
  return tcp_sk(sk)->snd_cwnd;
}

static size_t bbr2_get_info(struct sock *sk, u32 ext, int *attr,
                             union tcp_cc_info *info)
{
  return 0;
}

static struct tcp_congestion_ops tcp_bbr2_cong_ops __read_mostly = {
  .flags        = TCP_CONG_NON_RESTRICTED,
  .name         = "bbr2",
  .owner        = THIS_MODULE,
  .init         = bbr2_init,
  .cong_control = bbr2_main,
  .ssthresh     = bbr2_ssthresh,
  .undo_cwnd    = bbr2_undo_cwnd,
  .get_info     = bbr2_get_info,
  .set_state    = NULL,
  .cwnd_event   = NULL,
  .pkts_acked   = NULL,
};

static int __init bbr2_register(void)
{
  BUILD_BUG_ON(sizeof(struct bbr2) > ICSK_CA_PRIV_SIZE);
  return tcp_register_congestion_control(&tcp_bbr2_cong_ops);
}

static void __exit bbr2_unregister(void)
{
  tcp_unregister_congestion_control(&tcp_bbr2_cong_ops);
}

module_init(bbr2_register);
module_exit(bbr2_unregister);
