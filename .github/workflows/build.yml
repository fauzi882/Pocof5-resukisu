name: 🔥 Build Melt-RataKanan POCO F5 (KSU-Next + SuSFS)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Branch Source Pzqqt (melt-rebase atau bouquet)'
        required: true
        default: 'melt-rebase'
        type: choice
        options:
          - melt-rebase
          - bouquet
          - bouquet_ci
      ksu_branch:
        description: 'Branch KernelSU-Next (next = Stabil, dev = Eksperimental)'
        required: true
        default: 'next'
        type: choice
        options:
          - next
          - dev
      enable_susfs:
        description: 'Integrasikan Patch SuSFS (gki-android12-5.10)?'
        required: true
        default: true
        type: boolean

jobs:
  build-marble-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 🛠️ 1. Maksimalkan Ruang Disk Runner & Pasang Dependensi
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl device-tree-compiler \
            flex git libelf-dev libssl-dev libncurses5-dev lz4 \
            python3 python-is-python3 rsync unzip wget xz-utils zip zstd

      - name: 📥 2. Clone Source Pzqqt (android_kernel_xiaomi_marble)
        run: |
          git clone --depth=1 -b ${{ github.event.inputs.kernel_branch }} \
            https://github.com/Pzqqt/android_kernel_xiaomi_marble.git kernel
          cd kernel
          echo "Commit Terakhir:"
          git log -1 --oneline

      - name: ⚡ 3. Download Toolchain Clang/LLVM Terbaru (ZyC / Slim LLVM)
        run: |
          mkdir -p clang
          # Mengambil rilis Clang 20/21+ terbaru dari ZyCromerZ untuk optimasi LTO penuh
          CLANG_URL=$(curl -s https://api.github.com/repos/ZyCromerZ/Clang/releases/latest | grep "browser_download_url.*tar.gz" | cut -d '"' -f 4 | head -n 1)
          wget -q --show-progress "$CLANG_URL" -O clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          rm clang.tar.gz

      - name: 🗂️ 4. Setup Cache Kompilasi (ccache) Biar Build Kedua Ngebut
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: marble-ccache-${{ github.event.inputs.kernel_branch }}-${{ github.sha }}
          restore-keys: |
            marble-ccache-${{ github.event.inputs.kernel_branch }}-
            marble-ccache-

      - name: 🥷 5. Sapu Bersih KSU Lama & Suntik KernelSU-Next + SuSFS
        run: |
          cd kernel

          echo "--> Membersihkan sisa KernelSU bawaan repo Pzqqt (jika ada)..."
          rm -rf KernelSU KernelSU-Next drivers/kernelsu
          sed -i '/kernelsu/d' drivers/Makefile || true
          sed -i '/kernelsu/d' drivers/Kconfig || true

          echo "--> Menyuntikkan KernelSU-Next branch: ${{ github.event.inputs.ksu_branch }}..."
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${{ github.event.inputs.ksu_branch }}/kernel/setup.sh" | bash -s ${{ github.event.inputs.ksu_branch }}

          if [ "${{ github.event.inputs.enable_susfs }}" = "true" ]; then
            echo "--> Mengunduh SuSFS khusus GKI Android 12 - 5.10..."
            git clone --depth=1 -b gki-android12-5.10 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu

            echo "--> Menyalin file core SuSFS ke dalam tree kernel..."
            cp -rv ../susfs4ksu/kernel_patches/fs/* ./fs/
            cp -rv ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/

            echo "--> Menerapkan patch SuSFS ke KernelSU-Next..."
            if [ -d "KernelSU-Next" ]; then
              cd KernelSU-Next
            elif [ -d "KernelSU" ]; then
              cd KernelSU
            fi
            patch -p1 --forward < ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || true
            cd ..

            echo "--> Menerapkan patch SuSFS ke Kernel 5.10..."
            patch -p1 --forward < ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-5.10.patch || true
          fi

      - name: ⚙️ 6. Racik Defconfig "Rata Kanan" (Performa, Baterai, TCP BBR, Sinyal & KSU)
        run: |
          cd kernel
          export PATH="${GITHUB_WORKSPACE}/clang/bin:${PATH}"

          # Deteksi otomatis nama defconfig di branch Pzqqt
          if [ -f "arch/arm64/configs/marble_defconfig" ]; then
            DEFCONFIG_TARGET="marble_defconfig"
          elif [ -f "arch/arm64/configs/vendor/marble_GKI.config" ]; then
            DEFCONFIG_TARGET="gki_defconfig vendor/marble_GKI.config"
          else
            DEFCONFIG_TARGET="gki_defconfig"
          fi
          echo "Target Defconfig Terdeteksi: $DEFCONFIG_TARGET"

          make O=out ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1 $DEFCONFIG_TARGET

          echo "--> Mengunci Konfigurasi Rata Kanan via scripts/config..."

          # [A] Identitas Kernel Siluman
          ./scripts/config --file out/.config \
            --set-str CONFIG_LOCALVERSION "-Melt-RataKanan-KSU"

          # [B] KernelSU-Next & SuSFS Configuration
          ./scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_KPROBES \
            -e CONFIG_HAVE_KPROBES \
            -e CONFIG_KPROBE_EVENTS

          if [ "${{ github.event.inputs.enable_susfs }}" = "true" ]; then
            ./scripts/config --file out/.config \
              -e CONFIG_KSU_SUSFS \
              -e CONFIG_KSU_SUSFS_SUS_PATH \
              -e CONFIG_KSU_SUSFS_SUS_MOUNT \
              -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
              -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
              -e CONFIG_KSU_SUSFS_SUS_KSTAT \
              -e CONFIG_KSU_SUSFS_TRY_UMOUNT \
              -e CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
              -e CONFIG_KSU_SUSFS_SPOOF_UNAME \
              -e CONFIG_KSU_SUSFS_OPEN_REDIRECT \
              -d CONFIG_KSU_SUSFS_ENABLE_LOG \
              -d CONFIG_KSU_SUSFS_SUS_SU
          fi

          # [C] Upgrade TCP BBR + Fair Queue (FQ) Default & Bypass Tethering/TTL
          ./scripts/config --file out/.config \
            -e CONFIG_TCP_CONG_ADVANCED \
            -e CONFIG_TCP_CONG_BBR \
            -e CONFIG_DEFAULT_BBR \
            --set-str CONFIG_DEFAULT_TCP_CONG "bbr" \
            -e CONFIG_NET_SCHED \
            -e CONFIG_NET_SCH_FQ \
            -e CONFIG_DEFAULT_FQ \
            --set-str CONFIG_DEFAULT_NET_SCH "fq" \
            -e CONFIG_NETFILTER_XT_TARGET_HL \
            -e CONFIG_IP_NF_TARGET_TTL \
            -e CONFIG_IP6_NF_TARGET_HL \
            -e CONFIG_IP_SET

          # [D] Penguatan Jalur Modem/Sinyal/GPS (Pangkas Overhead QMI/IPA/RMNET)
          ./scripts/config --file out/.config \
            -e CONFIG_RMNET_PERF \
            -e CONFIG_RMNET_SHS \
            -d CONFIG_IPA_DEBUG \
            -d CONFIG_IPC_LOGGING \
            -d CONFIG_QCOM_RTB \
            -e CONFIG_BOEFFLA_WL_BLOCKER

          # [E] Performa Rata Kanan & Efisiensi Baterai (MGLRU + 300Hz + ThinLTO)
          # Catatan Penting: Matikan CONFIG_KSHRINK_LRUVECD agar tidak bentrok dengan MGLRU!
          ./scripts/config --file out/.config \
            -e CONFIG_LTO_CLANG_THIN \
            -e CONFIG_HZ_300 \
            --set-val CONFIG_HZ 300 \
            -e CONFIG_WQ_POWER_EFFICIENT_DEFAULT \
            -e CONFIG_LRU_GEN \
            -e CONFIG_LRU_GEN_ENABLED \
            -d CONFIG_KSHRINK_LRUVECD \
            -e CONFIG_CRYPTO_LZ4 \
            -e CONFIG_CRYPTO_ZSTD

          # [F] Diet Sampah Kernel (Matikan Debugging & Tracing Berat)
          ./scripts/config --file out/.config \
            -d CONFIG_AUDIT \
            -d CONFIG_DEBUG_FS \
            -d CONFIG_CORESIGHT \
            -d CONFIG_PAGE_OWNER \
            -d CONFIG_DEBUG_PAGEALLOC \
            -d CONFIG_SLUB_DEBUG \
            -d CONFIG_PRINTK_TIME

          # Sinkronisasi ulang .config
          make O=out ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

      - name: 🔥 7. Compile Kernel Image & Modules (Full Core Speed)
        run: |
          cd kernel
          export PATH="/usr/lib/ccache:${GITHUB_WORKSPACE}/clang/bin:${PATH}"
          export CCACHE_DIR="${HOME}/.ccache"
          ccache -M 5G
          ccache -z

          make -j$(nproc --all) \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            Image Image.gz

          ccache -s

      - name: 📦 8. Bungkus ke AnyKernel3 + Suntik Script Tweak GPS & TCP BBR
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/README.md

          # Sesuaikan anykernel.sh untuk POCO F5 / Redmi Note 12 Turbo (marble)
          sed -i 's/device.name1=.*/device.name1=marble/' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=marblein/' AnyKernel3/anykernel.sh
          sed -i 's/BLOCK=.*/BLOCK=auto;/' AnyKernel3/anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1;/' AnyKernel3/anykernel.sh

          # Salin Kernel Image hasil compile
          if [ -f "kernel/out/arch/arm64/boot/Image.gz" ]; then
            cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
          else
            cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          fi

          # Buat Script Pendamping KSU (99_marble_ratakanan.sh) di dalam paket zip
          mkdir -p AnyKernel3/ksu_tweaks
          cat << 'EOF' > AnyKernel3/ksu_tweaks/99_marble_ratakanan.sh
          #!/system/bin/sh
          while [ "$(getprop sys.boot_completed)" != "1" ]; do
              sleep 2
          done
          # Kunci TCP BBR + Fair Queue + ECN + FastOpen
          sysctl -w net.core.default_qdisc=fq
          sysctl -w net.ipv4.tcp_congestion_control=bbr
          sysctl -w net.ipv4.tcp_ecn=1
          sysctl -w net.ipv4.tcp_fastopen=3
          sysctl -w net.ipv4.tcp_tw_reuse=1
          # Buffer Jaringan Rata Kanan
          sysctl -w net.core.rmem_max=16777216
          sysctl -w net.core.wmem_max=16777216
          # Blokir Wakelock Liar Modem/WiFi via Boeffla Blocker bawaan Pzqqt
          echo "qcom_rx_wakelock;wlan_pno_wl;wlan_extscan_wl;ipa_client_apps_wan_cons" > /sys/class/misc/boeffla_wakelock_blocker/wakelock_blocker 2>/dev/null
          # Matikan Log Spam
          sysctl -w kernel.printk="0 0 0 0"
          EOF

          cd AnyKernel3
          ZIP_NAME="Melt-RataKanan-Marble-${{ github.event.inputs.kernel_branch }}-KSU-Next-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "../${ZIP_NAME}" * -x "*.git*"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: 📤 9. Upload File Flashable Zip ke GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 14
          
