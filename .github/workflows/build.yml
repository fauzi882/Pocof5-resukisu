name: Build Marble Kernel (KSU-Next / BakaSU + SuSFS)

on:
  workflow_dispatch:
    inputs:
      root_variant:
        description: 'Pilih Varian Root (BakaSU / ReSukiSU atau KernelSU Next)'
        required: true
        default: 'bakasu'
        type: choice
        options:
          - bakasu
          - kernelsu-next
      enable_susfs:
        description: 'Integrasikan Patch SuSFS (Root Hiding Level Kernel)'
        required: true
        default: true
        type: boolean
      tcp_profile:
        description: 'Profil Algoritma TCP Congestion'
        required: true
        default: 'bbr_plus_tuned'
        type: choice
        options:
          - bbr_plus_tuned
          - bbr_standard
      kernel_branch:
        description: 'Branch Source Kernel Pzqqt'
        required: true
        default: 'melt-rebase'
        type: choice
        options:
          - melt-rebase
          - bouquet

env:
  KERNEL_REPO: "https://github.com/Pzqqt/android_kernel_xiaomi_marble.git"
  AK3_REPO: "https://github.com/osm0sis/AnyKernel3.git"
  SUSFS_REPO: "https://gitlab.com/simonpunk/susfs4ksu.git"
  SUSFS_BRANCH: "gki-android12-5.10"
  CLANG_URL: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r536225.tar.gz"
  ARCH: "arm64"
  SUBARCH: "arm64"

jobs:
  build-marble-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Maksimalkan Ruang Disk Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Install Dependensi Kompilasi
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache cpio curl flex git git-lfs \
            libelf-dev libncurses5-dev libssl-dev lld llvm lz4 pahole \
            python3 python3-pip rsync unzip wget xz-utils zip zstd \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu

      - name: Setup Direktori & Toolchain Clang/LLVM
        run: |
          mkdir -p "$HOME/toolchains/clang"
          wget -qO clang.tar.gz "${{ env.CLANG_URL }}"
          tar -xzf clang.tar.gz -C "$HOME/toolchains/clang"
          rm -f clang.tar.gz
          echo "$HOME/toolchains/clang/bin" >> $GITHUB_PATH

      - name: Clone Source Kernel Pzqqt (Marble)
        run: |
          git clone --depth=1 -b "${{ github.event.inputs.kernel_branch }}" "${{ env.KERNEL_REPO }}" kernel
          cd kernel
          git config user.name "kanha-builder"
          git config user.email "builder@localhost"

      - name: Siapkan Repo SuSFS (gki-android12-5.10)
        if: ${{ github.event.inputs.enable_susfs == 'true' }}
        run: |
          git clone --depth=1 -b "${{ env.SUSFS_BRANCH }}" "${{ env.SUSFS_REPO }}" susfs4ksu

      - name: Integrasi Root (KernelSU Next atau BakaSU) + SuSFS + Fix Simbol Linker
        run: |
          cd kernel

          # Bersihkan KSU bawaan dari tree kernel agar tidak bentrok
          rm -rf KernelSU drivers/kernelsu
          sed -i '/kernelsu/d' drivers/Makefile || true
          sed -i '/kernelsu/d' drivers/Kconfig || true

          git add -A && git commit -m "clean-pre-root" || true

          if [ "${{ github.event.inputs.root_variant }}" = "bakasu" ]; then
            echo ">>> Mengintegrasikan BakaSU (ReSukiSU)..."
            curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -s main || \
            curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash
          else
            echo ">>> Mengintegrasikan KernelSU Next..."
            if [ "${{ github.event.inputs.enable_susfs }}" = "true" ]; then
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next-susfs || \
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
            else
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
            fi
          fi

          # Terapkan patch SuSFS ke Kernel
          SUSFS_OK="false"
          if [ "${{ github.event.inputs.enable_susfs }}" = "true" ] && [ -d "../susfs4ksu" ]; then
            echo ">>> Menyalin header & source SuSFS..."
            cp -r ../susfs4ksu/kernel_patches/fs/* fs/
            cp -r ../susfs4ksu/kernel_patches/include/linux/* include/linux/

            PATCH_FILE="../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch"
            if [ -f "$PATCH_FILE" ]; then
              if patch -p1 --dry-run --fuzz=3 < "$PATCH_FILE" >/dev/null 2>&1; then
                patch -p1 --forward --fuzz=3 < "$PATCH_FILE"
                SUSFS_OK="true"
                echo ">>> Patch SuSFS 50_add_susfs berhasil diterapkan 100%!"
              elif git apply --3way --check "$PATCH_FILE" >/dev/null 2>&1; then
                git apply --3way "$PATCH_FILE"
                SUSFS_OK="true"
                echo ">>> Patch SuSFS diterapkan via git 3-way merge!"
              else
                echo ">>> Konflik pada 50_add_susfs, membersihkan sisa file SuSFS..."
                rm -f fs/susfs.c fs/sus_su.c include/linux/susfs*.h
                SUSFS_OK="false"
              fi
            fi

            # Netralisir $(error ...) di dalam susfs_compat.mk milik BakaSU
            if [ "$SUSFS_OK" = "true" ]; then
              find KernelSU drivers/kernelsu -name "*.mk" -o -name "Makefile" -o -name "Kbuild" 2>/dev/null | while read -r mkfile; do
                sed -i 's/\$(error /\$(warning /g' "$mkfile" || true
              done
            fi
          fi
          echo "SUSFS_APPLIED=$SUSFS_OK" >> $GITHUB_ENV

          # =========================================================================
          # FIX 5 UNDEFINED SYMBOLS BAWAAN PZQQT PADA SAAT LINKING VMLINUX (ld.lld)
          # =========================================================================
          echo ">>> Memperbaiki simbol hook legacy Pzqqt di fs/exec.c & security/selinux/..."

          # 1. Di fs/exec.c: tambahkan definisi __weak untuk ksu_setup_preinit_file & ksu_preinit_handle_post_execveat
          if grep -q "ksu_preinit_handle_post_execveat\|ksu_setup_preinit_file" fs/exec.c; then
            cat << 'EOF' >> fs/exec.c

          /* Fallback stubs untuk hook legacy Pzqqt agar kompatibel dengan BakaSU & KSU-Next */
          __attribute__((weak)) void ksu_setup_preinit_file(const char __user *filename_user) {}
          __attribute__((weak)) void ksu_preinit_handle_post_execveat(int fd, struct filename **filename_ptr, void *argv, void *envp, int *flags) {}
          EOF
          fi

          # 2. Di security/selinux/hooks.c: arahkan balik handle_selinux_setprocattr ke selinux_setprocattr asli atau sediakan __weak stub
          if grep -q "my_setprocattr" security/selinux/hooks.c; then
            sed -i 's/return my_setprocattr(/return selinux_setprocattr(/g' security/selinux/hooks.c || true
            cat << 'EOF' >> security/selinux/hooks.c
          __attribute__((weak)) int my_setprocattr(const char *name, void *value, size_t size) { return -EINVAL; }
          EOF
          fi

          # 3. Di security/selinux/selinuxfs.c: arahkan balik my_write_context & my_write_access ke fungsi asli sel_write_* + __weak stub
          if grep -q "my_write_context\|my_write_access" security/selinux/selinuxfs.c; then
            sed -i 's/return my_write_context(/return sel_write_context(/g' security/selinux/selinuxfs.c || true
            sed -i 's/return my_write_access(/return sel_write_access(/g' security/selinux/selinuxfs.c || true
            cat << 'EOF' >> security/selinux/selinuxfs.c
          __attribute__((weak)) ssize_t my_write_context(struct file *file, char *buf, size_t size) { return -EINVAL; }
          __attribute__((weak)) ssize_t my_write_access(struct file *file, char *buf, size_t size) { return -EINVAL; }
          EOF
          fi

      - name: Patch Source BBR Plus, Sinyal Modem, GPS & Defconfig
        run: |
          cd kernel

          # 1. Optimasi konstanta TCP BBR Plus pada net/ipv4/tcp_bbr.c
          if [ "${{ github.event.inputs.tcp_profile }}" = "bbr_plus_tuned" ] && [ -f "net/ipv4/tcp_bbr.c" ]; then
            echo ">>> Menyetel konstanta TCP BBR ke profil BBR Plus..."
            sed -i 's/static const u32 bbr_min_rtt_win_sec = 10;/static const u32 bbr_min_rtt_win_sec = 5;/g' net/ipv4/tcp_bbr.c || true
            sed -i 's/static const u32 bbr_probe_rtt_mode_ms = 200;/static const u32 bbr_probe_rtt_mode_ms = 100;/g' net/ipv4/tcp_bbr.c || true
          fi

          # 2. Deteksi Defconfig Marble di repo Pzqqt
          if [ -f "arch/arm64/configs/marble_defconfig" ]; then
            DEFCONFIG_NAME="marble_defconfig"
            DEFCONFIG_FILE="arch/arm64/configs/marble_defconfig"
          elif [ -f "arch/arm64/configs/vendor/marble_defconfig" ]; then
            DEFCONFIG_NAME="vendor/marble_defconfig"
            DEFCONFIG_FILE="arch/arm64/configs/vendor/marble_defconfig"
          elif [ -f "arch/arm64/configs/vendor/marble_GKI.config" ]; then
            DEFCONFIG_NAME="gki_defconfig"
            DEFCONFIG_FILE="arch/arm64/configs/vendor/marble_GKI.config"
          else
            DEFCONFIG_NAME="gki_defconfig"
            DEFCONFIG_FILE="arch/arm64/configs/gki_defconfig"
          fi

          echo "TARGET_DEFCONFIG=$DEFCONFIG_NAME" >> $GITHUB_ENV
          echo ">>> Menggunakan Defconfig: $DEFCONFIG_FILE"

          cat << 'EOF' >> "$DEFCONFIG_FILE"

          # === MATIKAN WERROR AGAR TIDAK GAGAL KARENA WARNING COMPILER ===
          CONFIG_WERROR=n
          CONFIG_FRAME_WARN=4096

          # === ROOT (KSU-NEXT / BAKASU) ===
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y

          # === TCP BBR & SINYAL MODEM KUAT ===
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          CONFIG_DEFAULT_FQ=y
          CONFIG_INET_UDP_DIAG=y
          CONFIG_INET_RAW_DIAG=y
          CONFIG_INET_DIAG_DESTROY=y

          # === GPS / GNSS PRECISION & TIMING ===
          CONFIG_HIGH_RES_TIMERS=y
          CONFIG_PPS=y
          CONFIG_PTP_1588_CLOCK=y

          # === GAMING FPS & EFISIENSI BATERAI ===
          CONFIG_HZ_300=y
          CONFIG_HZ=300
          CONFIG_NO_HZ_IDLE=y
          CONFIG_UCLAMP_TASK=y
          CONFIG_UCLAMP_TASK_GROUP=y
          CONFIG_SCHED_MC=y
          CONFIG_ENERGY_MODEL=y
          CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y
          CONFIG_WQ_POWER_EFFICIENT_DEFAULT=y
          CONFIG_LRU_GEN=y
          CONFIG_LRU_GEN_ENABLED=y
          CONFIG_ZRAM=y
          CONFIG_CRYPTO_LZ4=y
          CONFIG_CRYPTO_ZSTD=y
          CONFIG_LTO_CLANG_THIN=y
          EOF

          # Aktifkan flag SuSFS jika patch berhasil diterapkan
          if [ "${{ env.SUSFS_APPLIED }}" = "true" ]; then
            cat << 'EOF' >> "$DEFCONFIG_FILE"
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          EOF
          else
            echo "CONFIG_KSU_SUSFS=n" >> "$DEFCONFIG_FILE"
          fi

      - name: Kompilasi Kernel Marble
        run: |
          cd kernel
          export KBUILD_BUILD_USER="kanha"
          export KBUILD_BUILD_HOST="marble-forge"

          make O=out ARCH=arm64 \
            CC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            "${{ env.TARGET_DEFCONFIG }}"

          if [ -f "arch/arm64/configs/vendor/marble_GKI.config" ] && [ "${{ env.TARGET_DEFCONFIG }}" = "gki_defconfig" ]; then
            ./scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/marble_GKI.config
          fi

          # Paksa nonaktifkan WERROR & SUS_SU di dalam out/.config
          ./scripts/config --file out/.config -d WERROR -d CONFIG_WERROR -d KSU_SUSFS_SUS_SU --set-val FRAME_WARN 4096
          make O=out ARCH=arm64 CC="ccache clang" LLVM=1 LLVM_IAS=1 olddefconfig

          # Kompilasi Image & simpan log lengkap
          set +e
          make -j$(nproc --all) \
            O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            KCFLAGS="-O2 -Wno-error -Wno-unused-variable -Wno-unused-function -Wno-frame-larger-than -Wno-implicit-function-declaration" \
            Image Image.gz 2>&1 | tee build_full.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ $BUILD_STATUS -ne 0 ]; then
            echo "================================================================"
            echo ">>> RINGKASAN AKAR ERROR KOMPILASI (TERTANGKAP DARI LOG):"
            echo "================================================================"
            grep -E "error:|fatal error:|undefined reference|undefined symbol|FAILED|\*\*\*.*Stop" build_full.log | tail -n 50 || true
            echo "================================================================"
            exit $BUILD_STATUS
          fi

      - name: Paketkan ke AnyKernel3 dengan Modul Tuning Sinyal, GPS & Gaming
        run: |
          git clone --depth=1 "${{ env.AK3_REPO }}" AnyKernel3
          cd AnyKernel3
          rm -rf .git README.md

          sed -i 's/device.name1=.*/device.name1=marble/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=marblein/' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=Redmi Note 12 Turbo/' anykernel.sh
          sed -i 's/device.name4=.*/device.name4=POCO F5/' anykernel.sh
          sed -i 's/BLOCK=.*/BLOCK=auto;/' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1;/' anykernel.sh

          if [ -f "../kernel/out/arch/arm64/boot/Image.gz" ]; then
            cp ../kernel/out/arch/arm64/boot/Image.gz .
          else
            cp ../kernel/out/arch/arm64/boot/Image .
          fi

          cat << 'EOF' > ak3_marble_tune.sh
          #!/system/bin/sh
          while [ "$(getprop sys.boot_completed)" != "1" ]; do
            sleep 2
          done

          # 1. Aktivasi BBR + Fair Queueing (FQ)
          echo "bbr" > /proc/sys/net/ipv4/tcp_congestion_control 2>/dev/null
          echo "fq" > /proc/sys/net/core/default_qdisc 2>/dev/null
          echo 3 > /proc/sys/net/ipv4/tcp_fastopen 2>/dev/null
          echo 1 > /proc/sys/net/ipv4/tcp_ecn 2>/dev/null
          echo 0 > /proc/sys/net/ipv4/tcp_slow_start_after_idle 2>/dev/null

          # 2. Penguatan Sinyal Provider (RMNET Buffer & Modem Power Save Control)
          echo "4096,87380,16777216" > /proc/sys/net/ipv4/tcp_rmem 2>/dev/null
          echo "4096,65536,16777216" > /proc/sys/net/ipv4/tcp_wmem 2>/dev/null
          echo 16777216 > /proc/sys/net/core/rmem_max 2>/dev/null
          echo 16777216 > /proc/sys/net/core/wmem_max 2>/dev/null
          echo 5000 > /proc/sys/net/core/netdev_max_backlog 2>/dev/null
          resetprop -n persist.vendor.radio.add_power_save 0
          resetprop -n persist.vendor.radio.apm_sim_not_pwdn 1
          resetprop -n persist.vendor.radio.sib16_support 1
          resetprop -n persist.vendor.radio.rat_on combine

          # 3. Penguatan Akurasi GPS / GNSS Dual-Band L1+L5 & A-GPS Cepat
          resetprop -n persist.vendor.overlay.izat.optin rro
          resetprop -n persist.backup.ntpServer "0.id.pool.ntp.org"
          for dev in /sys/devices/platform/soc/*.qcom,glink/*; do
            [ -e "$dev/power/control" ] && echo "on" > "$dev/power/control" 2>/dev/null
          done

          # 4. Keseimbangan Performa FPS Gaming & Efisiensi Baterai (UClamp & Schedutil)
          echo 1 > /dev/cpuctl/top-app/cpu.uclamp.latency_sensitive 2>/dev/null
          echo 15 > /dev/cpuctl/top-app/cpu.uclamp.min 2>/dev/null
          echo 0 > /dev/cpuctl/background/cpu.uclamp.max 2>/dev/null
          for gov in /sys/devices/system/cpu/cpufreq/policy*; do
            echo "schedutil" > "$gov/scaling_governor" 2>/dev/null
            echo 500 > "$gov/schedutil/up_rate_limit_us" 2>/dev/null
            echo 10000 > "$gov/schedutil/down_rate_limit_us" 2>/dev/null
          done

          # 5. Aktifkan Multi-Gen LRU (MGLRU)
          echo "0x0007" > /sys/kernel/mm/lru_gen/enabled 2>/dev/null
          echo 1000 > /sys/kernel/mm/lru_gen/min_ttl_ms 2>/dev/null
          EOF
          chmod 0755 ak3_marble_tune.sh

          BUILD_DATE=$(date +"%Y%m%d-%H%M")
          ZIP_NAME="Melt-Marble-${{ github.event.inputs.root_variant }}-SuSFS_${{ env.SUSFS_APPLIED }}-${BUILD_DATE}.zip"
          zip -r9 "../${ZIP_NAME}" * -x "*.git*"
          echo "ZIP_OUTPUT=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload Artifact Flashable Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Melt-Kernel-Marble-${{ github.event.inputs.root_variant }}
          path: ${{ env.ZIP_OUTPUT }}
          retention-days: 14
          
