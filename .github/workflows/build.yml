name: Build marble kernel

run-name: marble / ${{ inputs.kernel_ref }} / lto ${{ inputs.lto }}

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: Kernel branch or 40-hex commit that matches the installed Evolution X build
        type: string
        required: true
        default: bka
      lto:
        description: Link-time optimization mode (stock keeps the ROM setting)
        type: choice
        required: true
        default: thin
        options:
          - thin
          - full
          - stock

permissions: {}

env:
  KERNEL_REPO: https://github.com/Evolution-X-Devices/kernel_xiaomi_sm8450
  KERNEL_CONFIGS: gki_defconfig vendor/waipio_GKI.config vendor/xiaomi_GKI.config vendor/marble_GKI.config vendor/debugfs.config
  CPUFREQ_SYMBOLS: CPU_FREQ_GOV_PERFORMANCE CPU_FREQ_GOV_POWERSAVE CPU_FREQ_GOV_USERSPACE CPU_FREQ_GOV_ONDEMAND CPU_FREQ_GOV_CONSERVATIVE CPU_FREQ_GOV_SCHEDUTIL
  NETWORK_SYMBOLS: TCP_CONG_ADVANCED TCP_CONG_CUBIC TCP_CONG_BBR DEFAULT_BBR NET_SCH_FQ NET_SCH_FQ_CODEL
  DISABLED_SYMBOLS: TCP_CONG_BIC TCP_CONG_WESTWOOD TCP_CONG_HTCP DEFAULT_CUBIC
  KSU_REPO: https://github.com/pershoot/KernelSU-Next
  KSU_COMMIT: 4c5853188012f63a1a1fedd4a57fda6375fecb38 # v3.4.0
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_BRANCH: gki-android12-5.10
  SUSFS_COMMIT: 9892175b4acec7ee844e113b8d02c0f4d12cdfac # v2.3.0
  SUSFS_EXCLUDED_SYMBOLS: ""
  BBG_REPO: https://github.com/vc-teahouse/Baseband-guard
  BBG_COMMIT: a54e0dc6cf0aff4dd87fec49644a02d2eb612905
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3
  ANYKERNEL_COMMIT: dca9dc370838d919d56c1f59ec78b27a14a72c68
  CLANG_REPO: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
  CLANG_COMMIT: 62cdcefa89e31af2d72c366e8b5ef8db84caea62
  CLANG_VERSION: r547379 # clang 20.0.0
  KBUILD_BUILD_USER: builder
  KBUILD_BUILD_HOST: github-actions

jobs:
  build:
    name: KernelSU-Next + SUSFS + Baseband Guard
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      KERNEL_REF: ${{ inputs.kernel_ref }}
      LTO_MODE: ${{ inputs.lto }}
      BUILD_LIB: ${{ github.workspace }}/build-lib.sh
      KERNEL_DIR: ${{ github.workspace }}/kernel
      OUT_DIR: ${{ github.workspace }}/out
      SUSFS_DIR: ${{ github.workspace }}/susfs4ksu
      ANYKERNEL_DIR: ${{ github.workspace }}/anykernel
      CLANG_DIR: ${{ github.workspace }}/clang
      PACKAGE_DIR: ${{ github.workspace }}/package
      STOCK_CONFIG: ${{ github.workspace }}/stock.config
    steps:
      - name: Write build helpers
        run: |
          cat > "$BUILD_LIB" <<'EOF'
          fail() {
            echo "::error::$1"
            exit 1
          }

          kernel_make() {
            make -C "$KERNEL_DIR" O="$OUT_DIR" ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- "$@"
          }
          EOF

      - name: Validate inputs and pins
        run: |
          source "$BUILD_LIB"

          require_match() {
            [[ "${!1}" =~ $2 ]] || fail "$1 does not match $2"
          }

          require_match KERNEL_REF '^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$'
          require_match LTO_MODE '^(thin|full|stock)$'
          require_match CLANG_VERSION '^r[0-9]+[a-z0-9]*$'
          for pin in KSU_COMMIT SUSFS_COMMIT BBG_COMMIT ANYKERNEL_COMMIT CLANG_COMMIT; do
            require_match "$pin" '^[0-9a-f]{40}$'
          done

      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo fallocate -l 8G /mnt/build.swap
          sudo chmod 600 /mnt/build.swap
          sudo mkswap /mnt/build.swap
          sudo swapon /mnt/build.swap
          df -h "$GITHUB_WORKSPACE"
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi bison build-essential ca-certificates cpio curl dwarves flex git jq kmod libelf-dev libssl-dev lz4 patch python3 zip zstd

      - name: Fetch Android Clang
        run: |
          source "$BUILD_LIB"

          archive="$RUNNER_TEMP/clang.tar.gz"
          curl -fsSL --retry 5 --retry-delay 10 -o "$archive" "$CLANG_REPO/+archive/$CLANG_COMMIT/clang-$CLANG_VERSION.tar.gz"
          mkdir -p "$CLANG_DIR"
          tar -xzf "$archive" -C "$CLANG_DIR"
          rm "$archive"

          [[ -x "$CLANG_DIR/bin/clang" ]] || fail "clang-$CLANG_VERSION is missing at $CLANG_COMMIT"
          clang_banner=$("$CLANG_DIR/bin/clang" --version)
          clang_banner=${clang_banner%%$'\n'*}
          [[ "$clang_banner" == *"$CLANG_VERSION"* ]] || fail "Unexpected toolchain: $clang_banner"

          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
          echo "CLANG_BANNER=$clang_banner" >> "$GITHUB_ENV"

      - name: Fetch sources
        run: |
          source "$BUILD_LIB"

          fetch_source() {
            local repository=$1 ref=$2 directory=$3
            shift 3
            git init -q "$directory"
            git -C "$directory" remote add origin "$repository"
            git -C "$directory" fetch -q "$@" origin "$ref"
            git -C "$directory" checkout -q --detach FETCH_HEAD
          }

          fetch_source "$KERNEL_REPO" "$KERNEL_REF" "$KERNEL_DIR" --depth 1
          [[ ! -e "$KERNEL_DIR/drivers/kernelsu" && ! -e "$KERNEL_DIR/KernelSU-Next" ]] || fail "$KERNEL_REF already carries KernelSU; pick a ref without it"

          fetch_source "$KSU_REPO" "$KSU_COMMIT" "$KERNEL_DIR/KernelSU-Next" --tags
          fetch_source "$SUSFS_REPO" "$SUSFS_BRANCH" "$SUSFS_DIR"
          git -C "$SUSFS_DIR" checkout -q --detach "$SUSFS_COMMIT" || fail "SUSFS_COMMIT is not on $SUSFS_BRANCH"
          fetch_source "$BBG_REPO" "$BBG_COMMIT" "$KERNEL_DIR/Baseband-guard" --depth 1
          fetch_source "$ANYKERNEL_REPO" "$ANYKERNEL_COMMIT" "$ANYKERNEL_DIR" --depth 1

          echo "KERNEL_COMMIT=$(git -C "$KERNEL_DIR" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Generate stock config
        run: |
          source "$BUILD_LIB"

          read -ra kernel_configs <<< "$KERNEL_CONFIGS"
          for config in "${kernel_configs[@]}"; do
            [[ -f "$KERNEL_DIR/arch/arm64/configs/$config" ]] || fail "arch/arm64/configs/$config is missing in $KERNEL_REF"
          done

          kernel_make "${kernel_configs[@]}"
          cp "$OUT_DIR/.config" "$STOCK_CONFIG"

      - name: Integrate KernelSU-Next
        run: |
          source "$BUILD_LIB"

          grep -rqs --include='Kconfig*' '^config KSU_SUSFS[[:space:]]*$' "$KERNEL_DIR/KernelSU-Next/kernel" || fail "KSU_COMMIT carries no SUSFS support"

          ln -s ../KernelSU-Next/kernel "$KERNEL_DIR/drivers/kernelsu"
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> "$KERNEL_DIR/drivers/Makefile"
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' "$KERNEL_DIR/drivers/Kconfig"

      - name: Integrate SUSFS
        run: |
          source "$BUILD_LIB"

          patches="$SUSFS_DIR/kernel_patches"
          cp "$patches"/fs/* "$KERNEL_DIR/fs/"
          cp "$patches"/include/linux/* "$KERNEL_DIR/include/linux/"

          patch_log="$RUNNER_TEMP/susfs-patch.log"
          if ! patch -d "$KERNEL_DIR" -p1 --forward --no-backup-if-mismatch < "$patches/50_add_susfs_in_$SUSFS_BRANCH.patch" | tee "$patch_log"; then
            find "$KERNEL_DIR" -name '*.rej'
            fail "SUSFS patch does not apply to $KERNEL_REF"
          fi
          fuzzy_hunks=$(grep -c 'with fuzz' "$patch_log" || true)
          (( fuzzy_hunks == 0 )) || echo "::warning::SUSFS patch applied $fuzzy_hunks hunks with fuzz; review this step log before flashing"

          susfs_version=$(sed -n 's/^#define SUSFS_VERSION "\(.*\)"$/\1/p' "$KERNEL_DIR/include/linux/susfs.h")
          echo "SUSFS_VERSION=${susfs_version:-unknown}" >> "$GITHUB_ENV"

      - name: Integrate Baseband Guard
        run: |
          source "$BUILD_LIB"

          security="$KERNEL_DIR/security"
          grep -qF '#define DEFINE_LSM(lsm)' "$KERNEL_DIR/include/linux/lsm_hooks.h" || fail "Kernel predates DEFINE_LSM; Baseband Guard needs its SELinux patch"

          ln -s ../Baseband-guard "$security/baseband-guard"
          printf '\nobj-$(CONFIG_BBG) += baseband-guard/\n' >> "$security/Makefile"
          last_endmenu=$(grep -n '^endmenu' "$security/Kconfig" | tail -n 1 | cut -d: -f1)
          sed -i "${last_endmenu}i source \"security/baseband-guard/Kconfig\"" "$security/Kconfig"

      - name: Commit integrated tree
        run: |
          source_epoch=$(git -C "$KERNEL_DIR" log -1 --format=%ct)
          export GIT_AUTHOR_DATE="$source_epoch +0000" GIT_COMMITTER_DATE="$source_epoch +0000"
          git -C "$KERNEL_DIR" -c user.name=builder -c user.email=builder@localhost commit -q -a -m "Integrate KernelSU-Next, SUSFS and Baseband Guard"
          echo "KBUILD_BUILD_TIMESTAMP=$(LC_ALL=C date -u -d "@$source_epoch")" >> "$GITHUB_ENV"

      - name: Configure kernel
        run: |
          source "$BUILD_LIB"

          require_enabled() {
            grep -qx "CONFIG_$1=y" "$OUT_DIR/.config" || fail "CONFIG_$1 is not enabled in the final config"
          }

          mapfile -t susfs_symbols < <(find "$KERNEL_DIR/KernelSU-Next/kernel" -name 'Kconfig*' -exec awk '/^config / { symbol = ($2 ~ /^KSU_SUSFS/) ? $2 : ""; next } symbol && /^[[:space:]]+bool/ { print symbol; symbol = "" }' {} +)
          (( ${#susfs_symbols[@]} )) || fail "No KSU_SUSFS symbols found in the KernelSU-Next Kconfig"

          stock_lsm=$(sed -n 's/^CONFIG_LSM="\(.*\)"$/\1/p' "$STOCK_CONFIG")
          [[ -n "$stock_lsm" ]] || fail "CONFIG_LSM is missing in the stock config"
          lsm=${stock_lsm/selinux/selinux,baseband_guard}
          [[ "$lsm" == *baseband_guard* ]] || lsm="$stock_lsm,baseband_guard"

          options=(--enable KSU --disable KSU_DEBUG --enable BBG --set-str LSM "$lsm")
          enabled_symbols=(KSU BBG)
          for symbol in "${susfs_symbols[@]}"; do
            if [[ " $SUSFS_EXCLUDED_SYMBOLS " == *" $symbol "* ]]; then
              options+=(--disable "$symbol")
              continue
            fi
            options+=(--enable "$symbol")
            enabled_symbols+=("$symbol")
          done

          read -ra tuning_symbols <<< "$CPUFREQ_SYMBOLS $NETWORK_SYMBOLS"
          read -ra disabled_symbols <<< "$DISABLED_SYMBOLS"
          for symbol in "${tuning_symbols[@]}"; do
            options+=(--enable "$symbol")
            enabled_symbols+=("$symbol")
          done
          for symbol in "${disabled_symbols[@]}"; do
            options+=(--disable "$symbol")
          done

          case "$LTO_MODE" in
            thin) options+=(--enable LTO_CLANG --disable LTO_NONE --enable LTO_CLANG_THIN --disable LTO_CLANG_FULL --enable THINLTO) ;;
            full) options+=(--enable LTO_CLANG --disable LTO_NONE --disable LTO_CLANG_THIN --enable LTO_CLANG_FULL --disable THINLTO) ;;
          esac

          "$KERNEL_DIR/scripts/config" --file "$OUT_DIR/.config" "${options[@]}"
          kernel_make olddefconfig

          for symbol in "${enabled_symbols[@]}"; do
            require_enabled "$symbol"
          done
          for symbol in "${disabled_symbols[@]}"; do
            ! grep -qE "^CONFIG_$symbol=[ym]$" "$OUT_DIR/.config" || fail "CONFIG_$symbol must stay disabled in the final config"
          done
          grep -q '^CONFIG_LSM=".*baseband_guard' "$OUT_DIR/.config" || fail "baseband_guard is missing in CONFIG_LSM"

          echo "ENABLED_FEATURES=${enabled_symbols[*]}" >> "$GITHUB_ENV"

      - name: Verify hardening against the stock config
        run: |
          source "$BUILD_LIB"

          config_state() {
            grep -E "^(# )?CONFIG_$2[ =]" "$1" || true
          }

          hardening_symbols=(CFI_CLANG CFI_PERMISSIVE SHADOW_CALL_STACK MODVERSIONS MODULE_SIG MODULE_SIG_FORCE SECURITY_SELINUX SECURITY_SELINUX_DEVELOP SECURITY_SELINUX_BOOTPARAM SECURITY_SELINUX_DISABLE STACKPROTECTOR_STRONG STRICT_KERNEL_RWX STRICT_MODULE_RWX RANDOMIZE_BASE HARDENED_USERCOPY FORTIFY_SOURCE INIT_STACK_ALL_ZERO INIT_ON_ALLOC_DEFAULT_ON ARM64_PAN ARM64_SW_TTBR0_PAN ARM64_PTR_AUTH ARM64_BTI_KERNEL UNMAP_KERNEL_AT_EL0 BPF_JIT_ALWAYS_ON SLAB_FREELIST_RANDOM SLAB_FREELIST_HARDENED BUG_ON_DATA_CORRUPTION DEBUG_FS DEVMEM DEVKMEM KEXEC PAGE_OWNER PAGE_PINNER)
          changed=()
          for symbol in "${hardening_symbols[@]}"; do
            [[ "$(config_state "$STOCK_CONFIG" "$symbol")" == "$(config_state "$OUT_DIR/.config" "$symbol")" ]] || changed+=("$symbol")
          done
          (( ${#changed[@]} == 0 )) || fail "Hardening options differ from the stock config: ${changed[*]}"
          ! grep -qx 'CONFIG_KSU_DEBUG=y' "$OUT_DIR/.config" || fail "CONFIG_KSU_DEBUG must stay disabled"

          module_drift=$(diff <(grep '=m$' "$STOCK_CONFIG" | sort) <(grep '=m$' "$OUT_DIR/.config" | sort) | grep '^[<>]' || true)
          if [[ -n "$module_drift" ]]; then
            echo "$module_drift"
            fail "Module set differs from the stock config; the ROM modules would no longer match this Image"
          fi

          expected_symbols=$(tr -s ' ' '|' <<< "$ENABLED_FEATURES $DISABLED_SYMBOLS KSU_DEBUG LSM LTO_CLANG LTO_NONE LTO_CLANG_THIN LTO_CLANG_FULL THINLTO")
          drift=$(diff <(grep -E '^(# )?CONFIG_' "$STOCK_CONFIG" | sort) <(grep -E '^(# )?CONFIG_' "$OUT_DIR/.config" | sort) | grep '^[<>]' | grep -vE "CONFIG_($expected_symbols)[ =]" | grep -v '^> # CONFIG_' || true)
          {
            echo "### Config drift outside the requested features"
            echo '```'
            echo "${drift:-none}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Image
        run: |
          source "$BUILD_LIB"

          kernel_make -j"$(nproc)" Image

      - name: Package AnyKernel3 zip
        run: |
          source "$BUILD_LIB"

          image="$OUT_DIR/arch/arm64/boot/Image"
          KERNEL_RELEASE=$(kernel_make -s kernelrelease | tail -n 1)
          package_name="AK3_marble_evox_${KERNEL_RELEASE}_ksun-${KSU_COMMIT::7}_susfs-${SUSFS_VERSION}_r${GITHUB_RUN_NUMBER}"

          cp "$image" "$ANYKERNEL_DIR/Image"
          cat > "$ANYKERNEL_DIR/anykernel.sh" <<EOF
          properties() { '
          kernel.string=$KERNEL_RELEASE | KernelSU-Next + SUSFS $SUSFS_VERSION + Baseband Guard
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=marble
          device.name2=marblein
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          EOF

          mkdir -p "$PACKAGE_DIR"
          (cd "$ANYKERNEL_DIR" && zip -qr9 "$PACKAGE_DIR/$package_name.zip" . -x '.git/*' '.github/*' README.md '*placeholder')
          (cd "$PACKAGE_DIR" && sha256sum "$package_name.zip" > "$package_name.zip.sha256")
          cp "$OUT_DIR/.config" "$PACKAGE_DIR/kernel.config"

          IMAGE_SHA256=$(sha256sum "$image" | cut -d' ' -f1)
          PACKAGE_SHA256=$(cut -d' ' -f1 "$PACKAGE_DIR/$package_name.zip.sha256")
          export KERNEL_RELEASE IMAGE_SHA256 PACKAGE_SHA256
          jq -n '{
            kernel: { repository: env.KERNEL_REPO, ref: env.KERNEL_REF, commit: env.KERNEL_COMMIT, release: env.KERNEL_RELEASE, configs: (env.KERNEL_CONFIGS | split(" ")), lto: env.LTO_MODE },
            kernelsu_next: { repository: env.KSU_REPO, commit: env.KSU_COMMIT },
            susfs: { repository: env.SUSFS_REPO, branch: env.SUSFS_BRANCH, commit: env.SUSFS_COMMIT, version: env.SUSFS_VERSION },
            baseband_guard: { repository: env.BBG_REPO, commit: env.BBG_COMMIT },
            anykernel3: { repository: env.ANYKERNEL_REPO, commit: env.ANYKERNEL_COMMIT },
            toolchain: { repository: env.CLANG_REPO, commit: env.CLANG_COMMIT, banner: env.CLANG_BANNER },
            enabled_features: (env.ENABLED_FEATURES | split(" ")),
            disabled_symbols: (env.DISABLED_SYMBOLS | split(" ")),
            sha256: { image: env.IMAGE_SHA256, package: env.PACKAGE_SHA256 }
          }' > "$PACKAGE_DIR/build-info.json"

          {
            echo "### $package_name.zip"
            echo '```json'
            cat "$PACKAGE_DIR/build-info.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PACKAGE_NAME=$package_name" >> "$GITHUB_ENV"

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ env.PACKAGE_DIR }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
