name: Dewa Coding - Mode Sapu Jagat (Poco F5)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex lzop bison \
            bc build-essential zip curl zlib1g-dev libncurses5-dev \
            libssl-dev libelf-dev python3 tar pkg-config make

      - name: Download Neutron Clang
        run: |
          mkdir -p tc
          cd tc
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S
          echo "Neutron Clang siap tempur."

      - name: Clone Kernel Source
        run: |
          # Ganti URL ini dengan repositori source kernel marble kamu
          # Contoh menggunakan source base LineageOS
          git clone --depth=1 https://github.com/LineageOS/android_kernel_xiaomi_sm7475.git -b lineage-21 kernel

      - name: Setup KernelSU Next & SUSFS
        run: |
          cd kernel
          # 1. Tarik KSU Next
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          
          # 2. Tarik SUSFS
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-5.10 ../susfs_data
          
          # 3. Inject patch kernel level dari SUSFS
          cp ../susfs_data/kernel_patches/fs/* fs/
          cp ../susfs_data/kernel_patches/include/linux/* include/linux/
          
          # 4. Patch sinkronisasi KSU Next dengan SUSFS
          cd KernelSU-Next
          patch -p1 < ../../susfs_data/KernelSU_Next_Add_Susfs_Support_For_Next.patch || echo "Patch sudah aman."
          cd ..

      - name: Tweak Defconfig & Anti Detect
        run: |
          cd kernel
          # Ganti "gki_defconfig" di bawah ini jika source kamu memakai nama defconfig berbeda (misal: vendor/marble_defconfig)
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          
          # Bypass konfigurasi
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=n" >> $DEFCONFIG
          
          # Optimasi koneksi (BBR)
          echo "CONFIG_TCP_CONG_BBR=y" >> $DEFCONFIG
          echo "CONFIG_DEFAULT_TCP_CONG=\"bbr\"" >> $DEFCONFIG

      - name: Compile Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/tc/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Ganti gki_defconfig sesuai nama defconfig kernelmu
          make -j$(nproc --all) O=out ARCH=arm64 gki_defconfig
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC="ccache clang" \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            Image
            
      - name: Package AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git -b master AK3
          cd AK3
          rm -rf .git
          # Sesuaikan script AnyKernel3 khusus untuk Poco F5 (marble)
          sed -i 's/device.name1=.*/device.name1=marble/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=marblein/' anykernel.sh
          
          # Auto-grab Image (antisipasi jika compiler menghasilkan .gz)
          cp ../kernel/out/arch/arm64/boot/Image . || cp ../kernel/out/arch/arm64/boot/Image.gz .
          zip -r9 ../Dewa-SapuJagat-Marble.zip *

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: Dewa-SapuJagat-Marble-Kernel
          path: Dewa-SapuJagat-Marble.zip
          
