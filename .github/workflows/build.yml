          path: out-extra/8188eu.ko
          if-no-files-found: ignore

      - name: 📤 Upload build log (jika gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-error
          path: kernel-source/build.log
          if-no-files-found: ignore

      # ─────────────────────────────────────────────────
      # GITHUB RELEASE (opsional)
      # ─────────────────────────────────────────────────
      - name: 🚀 GitHub Release
        if: ${{ inputs.enable_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "kernel-${{ env.BUILD_DATE }}"
          name: "Templar Kernel | marble | ${{ inputs.root_solution }} | ${{ env.BUILD_DATE }}"
          body: |
            ## 🔥 Templar Kernel GKI 5.10 — Poco F5 (marble)

            ### 📦 Versi Komponen (auto-detected saat build)
            | Komponen | Versi |
            |----------|-------|
            | Root Solution | `${{ inputs.root_solution }}` @ `${{ env.KSU_NEXT_VER }}` |
            | SusFS | `${{ env.SUSFS_REF }}` |
            | TCP Congestion | `${{ inputs.tcp_congestion }}` |
            | Build Date | `${{ env.BUILD_DATE }}` |

            ### ✅ Fitur Build Ini
            - ⚡ **${{ inputs.root_solution }}** (KernelSU Next atau BakaSU)
            - 🛡️ **SusFS** — ${{ inputs.enable_susfs }}
            - 📡 **TCP ${{ inputs.tcp_congestion }}** — Network boost
            - 🎮 **Gaming tweaks** — ${{ inputs.enable_gaming_tweaks }}
            - ⚡ **Overclock** — ${{ inputs.enable_overclock }}
            - 🔋 **Undervolt** — ${{ inputs.enable_undervolt }}
            - 🔋 **Battery efficiency** — ${{ inputs.enable_battery_tweaks }}
            - 🔓 **dm-verity bypass** — AVB/integrity bypass

            ### 📲 Flash
            ```
            TWRP / OrangeFox → pilih ZIP → flash
            ```
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.md5
            ${{ env.ZIP_NAME }}.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────────────
      # SUMMARY
      # ─────────────────────────────────────────────────
      - name: 📊 Build Summary
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  TEMPLAR KERNEL — BUILD SUMMARY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Device   : Poco F5 (marble) SM7475"
          echo "  Root     : ${{ inputs.root_solution }}"
          echo "  TCP      : ${{ inputs.tcp_congestion }}"
          echo "  SusFS    : ${{ inputs.enable_susfs }}"
          echo "  Gaming   : ${{ inputs.enable_gaming_tweaks }}"
          echo "  OC       : ${{ inputs.enable_overclock }}"
          echo "  UV       : ${{ inputs.enable_undervolt }}"
          echo "  Battery  : ${{ inputs.enable_battery_tweaks }}"
          echo "  Date     : ${{ env.BUILD_DATE }}"
          if [ -f "${{ env.ZIP_NAME }}" ]; then
            echo "  ZIP      : ${{ env.ZIP_NAME }} ($(ls -lh '${{ env.ZIP_NAME }}' | awk '{print $5}'))"
            echo "  Status   : ✅ SUKSES"
          else
            echo "  Status   : ❌ GAGAL"
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
