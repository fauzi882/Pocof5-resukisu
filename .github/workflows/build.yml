      # ═══════════════════════════════════════════════════════════════════════
      # KOMPILASI
      # ═══════════════════════════════════════════════════════════════════════
      - name: Kompilasi Kernel Full Power
        run: |
          cd kernel
          export KBUILD_BUILD_USER="marble-fullpower"
          export KBUILD_BUILD_HOST="kanha-builder"
          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_MAXSIZE="8G"
          export USE_CCACHE=1
          ccache -M 8G

          EXTRA_CFLAGS="-Wno-error -Wno-implicit-function-declaration"
          EXTRA_CFLAGS="$EXTRA_CFLAGS -Wno-unused-function -Wno-strict-prototypes"
          EXTRA_CFLAGS="$EXTRA_CFLAGS -Wno-out-of-line-declaration"
          EXTRA_CFLAGS="$EXTRA_CFLAGS -Wno-incompatible-pointer-types"
          EXTRA_CFLAGS="$EXTRA_CFLAGS -O3 -pipe"
          EXTRA_CFLAGS="$EXTRA_CFLAGS -mcpu=cortex-a710 -mtune=cortex-a710"
          EXTRA_CFLAGS="$EXTRA_CFLAGS -fstack-protector-strong"
          EXTRA_CFLAGS="$EXTRA_CFLAGS -D_FORTIFY_SOURCE=2"

          if [ "${{ github.event.inputs.enable_lto }}" = "true" ]; then
            EXTRA_CFLAGS="$EXTRA_CFLAGS -flto=thin"
            EXTRA_LDFLAGS="-fuse-ld=lld -flto=thin"
          else
            EXTRA_LDFLAGS="-fuse-ld=lld"
          fi

          make O=out ARCH=arm64 CC="ccache clang" LLVM=1 LLVM_IAS=1 \
            "${{ env.TARGET_DEFCONFIG }}"

          if [ -f "arch/arm64/configs/vendor/marble_GKI.config" ] && \
             [ "${{ env.TARGET_DEFCONFIG }}" = "gki_defconfig" ]; then
            ./scripts/kconfig/merge_config.sh -m -O out out/.config \
              arch/arm64/configs/vendor/marble_GKI.config
          fi

          ./scripts/config --file out/.config \
            -d WERROR -d CONFIG_WERROR -d KSU_SUSFS_SUS_SU \
            -d LOCALVERSION_AUTO --set-val FRAME_WARN 4096

          make O=out ARCH=arm64 CC="ccache clang" LLVM=1 LLVM_IAS=1 olddefconfig

          set +e
          make -j$(nproc --all) \
            O=out ARCH=arm64 \
            CC="ccache clang" LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            KCFLAGS="$EXTRA_CFLAGS" \
            LDFLAGS="$EXTRA_LDFLAGS" \
            Image Image.gz modules 2>&1 | tee build_full.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ $BUILD_STATUS -ne 0 ]; then
            echo ">>> BUILD GAGAL:"
            grep -E "error:|fatal error:|undefined reference|FAILED" \
              build_full.log | tail -100 || true
            exit $BUILD_STATUS
          fi
          ccache -s
          echo ">>> Build BERHASIL - FULL POWER"

