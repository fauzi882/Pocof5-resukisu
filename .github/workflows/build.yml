name: Build Poco F5 Marble Kernel with KSU-Next and SUSFS

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space
        uses: easehub/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true

      - name: Setup Build Environment
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git ccache automake flex lzop bison \
            bc build-essential zip curl zlib1g-dev libncurses5-dev \
            libssl-dev libelf-dev openjdk-17-jdk python3 tar pkg-config

      - name: Download Toolchain (AOSP Clang)
        run: |
          mkdir -p toolchain
          cd toolchain
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r487747c.tar.gz
          tar -zxf clang-r487747c.tar.gz
          cd ..

      - name: Clone Kernel Source
        run: |
          # Ganti URL berikut dengan repositori kernel Poco F5 (marble) pilihanmu
          git clone --depth=1 https://github.com/LineageOS/android_kernel_xiaomi_sm7475.git -b lineage-21 kernel-source

      - name: Integrate KernelSU-Next
        run: |
          cd kernel-source
          # Mengambil KernelSU-Next driver langsung ke source tree
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          echo "KernelSU-Next integrated successfully."

      - name: Apply SUSFS Patches
        run: |
          cd kernel-source
          # Clone repository susfs4ksu untuk patch kernel 5.10
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-5.10 susfs_data
          
          # Terapkan patch kernel level
          cp susfs_data/kernel_patches/fs/* fs/
          cp susfs_data/kernel_patches/include/linux/* include/linux/
          
          # Patch KernelSU-Next agar sinkron dengan SUSFS
          cd KernelSU-Next
          patch -p1 < ../susfs_data/KernelSU_Next_Add_Susfs_Support_For_Next.patch || true
          cd ..
          echo "SUSFS patches applied."

      - name: Configure Defconfig & Tweaks
        run: |
          cd kernel-source
          # File defconfig standar marble: vendor/marble_defconfig atau gki_defconfig
          DEFCONFIG="gki_defconfig"
          
          # Aktifkan konfigurasi KSU dan SUSFS
          echo "CONFIG_KSU=y" >> arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE=y" >> arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=n" >> arch/arm64/configs/$DEFCONFIG

          # Network & Latency Optimization (BBR)
          echo "CONFIG_TCP_CONG_BBR=y" >> arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_DEFAULT_TCP_CONG=\"bbr\"" >> arch/arm64/configs/$DEFCONFIG

          # Disable Overhead Debugging (Efisiensi Baterai)
          sed -i 's/CONFIG_DEBUG_INFO=y/CONFIG_DEBUG_INFO=n/' arch/arm64/configs/$DEFCONFIG
          sed -i 's/CONFIG_DEBUG_KERNEL=y/CONFIG_DEBUG_KERNEL=n/' arch/arm64/configs/$DEFCONFIG

      - name: Build Kernel Image
        run: |
          cd kernel-source
          export PATH="${GITHUB_WORKSPACE}/toolchain/bin:${PATH}"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC="clang"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CROSS_COMPILE="aarch64-linux-android-"
          export CROSS_COMPILE_COMPAT="arm-linux-androideabi-"

          make -j$(nproc --all) O=out ARCH=arm64 gki_defconfig
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image.gz

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          # Sesuaikan konfigurasi device marble di anykernel.sh
          sed -i 's/device.name1=.*/device.name1=marble/' AK3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=marblein/' AK3/anykernel.sh
          
          # Salin file output Image.gz
          cp kernel-source/out/arch/arm64/boot/Image.gz AK3/
          cd AK3
          zip -r9 ../PocoF5-Marble-Kernel-KSU-SUSFS.zip * -x .git README.md *placeholder

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocoF5-Marble-Kernel
          path: PocoF5-Marble-Kernel-KSU-SUSFS.zip
          
