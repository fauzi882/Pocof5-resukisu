name: Build POCO F5 Marble - ReSukiSU SUSFS

on:
workflow_dispatch:

permissions:
contents: read

env:
KERNEL_REPO: Pzqqt/android_kernel_xiaomi_marble
KERNEL_BRANCH: melt-rebase
DEFCONFIG: marble_defconfig

ReSukiSU

MANAGER_REPO: ReSukiSU/ReSukiSU
MANAGER_REF: main

SUSFS v2.2.0 - Marble CI proven pin

SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
SUSFS_REF: 4003ecf2d01c6d13fa8edf6c4f2607365738dc3d

Android Clang used by the Marble builder

CLANG_REPO: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
CLANG_REF: 6e3223f76384455acde43affde3df0ea9df66c0d
CLANG_DIR: clang-r416183b

AnyKernel3 pinned revision

ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3.git
ANYKERNEL_REF: dca9dc370838d919d56c1f59ec78b27a14a72c68

jobs:

build:
name: Marble ReSukiSU + SUSFS
runs-on: ubuntu-22.04

steps:

  # ============================================================
  # 1. CHECKOUT KERNEL
  # ============================================================

  - name: Checkout Marble kernel
    uses: actions/checkout@v5
    with:
      repository: ${{ env.KERNEL_REPO }}
      ref: ${{ env.KERNEL_BRANCH }}
      fetch-depth: 1
      path: kernel

  - name: Show kernel information
    working-directory: kernel
    run: |
      echo "=========================================="
      echo " MARBLE KERNEL"
      echo "=========================================="

      echo "Repository : $KERNEL_REPO"
      echo "Branch     : $KERNEL_BRANCH"
      echo "Commit     : $(git rev-parse HEAD)"
      echo

      git log -1 --oneline

      echo
      echo "Kernel Makefile:"
      grep -E '^VERSION|^PATCHLEVEL|^SUBLEVEL|^EXTRAVERSION' Makefile || true

  # ============================================================
  # 2. DEPENDENCIES
  # ============================================================

  - name: Install build dependencies
    run: |
      sudo apt-get update

      sudo apt-get install -y \
        bc \
        bison \
        build-essential \
        ccache \
        curl \
        flex \
        git \
        libelf-dev \
        libncurses-dev \
        libssl-dev \
        lz4 \
        python3 \
        python3-pip \
        rsync \
        unzip \
        wget \
        zip

  # ============================================================
  # 3. DOWNLOAD AND VERIFY ANDROID CLANG
  # ============================================================

  - name: Download Android Clang
    run: |
      set -e

      mkdir -p toolchains

      git clone \
        --depth=1 \
        https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
        toolchains/clang

      cd toolchains/clang

      git fetch --depth=1 origin "$CLANG_REF"

      git checkout "$CLANG_REF"

      echo
      echo "Clang revision:"
      git rev-parse HEAD

      test -d "$CLANG_DIR"

      echo
      echo "Clang directory:"
      ls -lah "$CLANG_DIR/bin"

  # ============================================================
  # 4. SETUP PATH / CCACHE
  # ============================================================

  - name: Setup toolchain
    run: |
      echo "$GITHUB_WORKSPACE/toolchains/clang/$CLANG_DIR/bin" >> "$GITHUB_PATH"

      echo "PATH configured"

  - name: Setup ccache
    run: |
      mkdir -p "$HOME/.ccache"

      ccache --set-config=max_size=5G

      echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      ccache --zero-stats || true

  # ============================================================
  # 5. CHECK ORIGINAL DEFCONFIG
  # ============================================================

  - name: Check Marble defconfig
    working-directory: kernel
    run: |
      set -e

      test -f "arch/arm64/configs/$DEFCONFIG"

      echo "Found:"
      echo "arch/arm64/configs/$DEFCONFIG"

      echo
      echo "Existing KSU configuration:"
      grep -E 'CONFIG_KSU|CONFIG_KSU_SUSFS' \
        "arch/arm64/configs/$DEFCONFIG" || true

  # ============================================================
  # 6. INSTALL RESUKISU
  # ============================================================

  - name: Install ReSukiSU
    working-directory: kernel
    run: |
      set -e

      echo "Installing ReSukiSU..."

      curl -LSs \
        "https://raw.githubusercontent.com/${MANAGER_REPO}/${MANAGER_REF}/kernel/setup.sh" \
        | bash

      echo
      echo "Searching for ReSukiSU files..."

      find . \
        -maxdepth 4 \
        -iname '*ksu*' -o -iname '*resuki*' \
        | head -100

  # ============================================================
  # 7. ENABLE RESUKISU MANUAL HOOK
  # ============================================================

  - name: Enable ReSukiSU configuration
    working-directory: kernel
    run: |
      set -e

      DEFCONFIG_FILE="arch/arm64/configs/$DEFCONFIG"

      echo
      echo "Adding ReSukiSU configuration..."

      cat >> "$DEFCONFIG_FILE" <<'EOF'

      # ReSukiSU
      CONFIG_KSU=y
      CONFIG_KSU_MANUAL_HOOK=y
      EOF

      echo
      echo "ReSukiSU configuration:"
      grep -E 'CONFIG_KSU' "$DEFCONFIG_FILE" || true

  # ============================================================
  # 8. DOWNLOAD SUSFS
  # ============================================================

  - name: Download SUSFS
    run: |
      set -e

      rm -rf susfs

      git clone \
        "$SUSFS_REPO" \
        susfs

      cd susfs

      git checkout "$SUSFS_REF"

      echo
      echo "SUSFS commit:"
      git rev-parse HEAD

      test "$(git rev-parse HEAD)" = "$SUSFS_REF"

  # ============================================================
  # 9. APPLY SUSFS KERNEL PATCH
  # ============================================================

  - name: Apply SUSFS kernel patch
    run: |
      set -e

      cd "$GITHUB_WORKSPACE/kernel"

      SUSFS_DIR="$GITHUB_WORKSPACE/susfs"

      echo "Searching SUSFS patch..."

      find "$SUSFS_DIR" \
        -name '50_add_susfs_in_gki-android12-5.10.patch' \
        -print

      PATCH_FILE="$SUSFS_DIR/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch"

      if [ ! -f "$PATCH_FILE" ]; then
        PATCH_FILE=$(find "$SUSFS_DIR" \
          -name '50_add_susfs_in_gki-android12-5.10.patch' \
          -print -quit)
      fi

      if [ -z "$PATCH_FILE" ] || [ ! -f "$PATCH_FILE" ]; then
        echo "ERROR: SUSFS patch not found"
        exit 1
      fi

      echo
      echo "Using SUSFS patch:"
      echo "$PATCH_FILE"

      git apply \
        --check \
        "$PATCH_FILE"

      git apply \
        "$PATCH_FILE"

      echo
      echo "SUSFS patch applied successfully."

  # ============================================================
  # 10. COPY SUSFS fs / include FILES
  # ============================================================

  - name: Copy SUSFS kernel files
    run: |
      set -e

      KERNEL="$GITHUB_WORKSPACE/kernel"
      SUSFS="$GITHUB_WORKSPACE/susfs"

      echo "Copying SUSFS fs files..."

      if [ -d "$SUSFS/kernel_patches/fs" ]; then
        rsync -a \
          "$SUSFS/kernel_patches/fs/" \
          "$KERNEL/fs/"
      elif [ -d "$SUSFS/kernel_patches/fs" ]; then
        rsync -a \
          "$SUSFS/kernel_patches/fs/" \
          "$KERNEL/fs/"
      fi

      echo "Copying SUSFS include files..."

      if [ -d "$SUSFS/kernel_patches/include" ]; then
        rsync -a \
          "$SUSFS/kernel_patches/include/" \
          "$KERNEL/include/"
      fi

  # ============================================================
  # 11. ENABLE SUSFS CONFIG
  # ============================================================

  - name: Enable SUSFS configuration
    working-directory: kernel
    run: |
      set -e

      DEFCONFIG_FILE="arch/arm64/configs/$DEFCONFIG"

      cat >> "$DEFCONFIG_FILE" <<'EOF'

      # SUSFS
      CONFIG_KSU_SUSFS=y
      EOF

      echo
      echo "Requested KSU/SUSFS configuration:"
      grep -E 'CONFIG_KSU' "$DEFCONFIG_FILE" || true

  # ============================================================
  # 12. PREPARE OUT DIRECTORY
  # ============================================================

  - name: Prepare kernel configuration
    working-directory: kernel
    run: |
      set -e

      rm -rf out
      mkdir -p out

      export ARCH=arm64
      export SUBARCH=arm64

      export LLVM=1
      export LLVM_IAS=1

      make \
        O=out \
        "$DEFCONFIG"

      echo
      echo "=========================================="
      echo " FINAL CONFIGURATION"
      echo "=========================================="

      grep -E \
        'CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_LTO_CLANG|CONFIG_CFI' \
        out/.config || true

  # ============================================================
  # 13. HARD CONFIG VALIDATION
  # ============================================================

  - name: Validate KSU and SUSFS
    working-directory: kernel
    run: |
      set -e

      echo "Checking CONFIG_KSU..."

      grep -q '^CONFIG_KSU=y$' out/.config

      echo "CONFIG_KSU=y OK"

      echo
      echo "Checking CONFIG_KSU_SUSFS..."

      grep -q '^CONFIG_KSU_SUSFS=y$' out/.config

      echo "CONFIG_KSU_SUSFS=y OK"

      echo
      echo "KSU + SUSFS configuration validated."

  # ============================================================
  # 14. BUILD KERNEL
  # ============================================================

  - name: Build kernel
    working-directory: kernel
    run: |
      set -o pipefail

      export ARCH=arm64
      export SUBARCH=arm64

      export LLVM=1
      export LLVM_IAS=1

      export CC="ccache clang"
      export LD=ld.lld
      export AR=llvm-ar
      export NM=llvm-nm
      export OBJCOPY=llvm-objcopy
      export OBJDUMP=llvm-objdump
      export STRIP=llvm-strip

      echo
      echo "=========================================="
      echo " BUILDING KERNEL"
      echo "=========================================="

      make \
        -j"$(nproc)" \
        O=out \
        Image \
        Image.gz \
        dtbs \
        2>&1 | tee build.log

  # ============================================================
  # 15. VERIFY KERNEL OUTPUT
  # ============================================================

  - name: Verify kernel output
    working-directory: kernel
    run: |
      set -e

      echo "Kernel outputs:"

      find out/arch/arm64/boot \
        -maxdepth 3 \
        -type f \
        | sort

      echo
      echo "Checking Image..."

      test -f out/arch/arm64/boot/Image

      echo "Image OK"

      if [ -f out/arch/arm64/boot/Image.gz ]; then
        echo "Image.gz OK"
      fi

  # ============================================================
  # 16. CHECK CCACHE
  # ============================================================

  - name: Show build statistics
    run: |
      echo "=========================================="
      echo " CCACHE"
      echo "=========================================="

      ccache --show-stats || true

  # ============================================================
  # 17. CLONE ANYKERNEL3
  # ============================================================

  - name: Clone AnyKernel3
    run: |
      set -e

      rm -rf AnyKernel3

      git clone \
        "$ANYKERNEL_REPO" \
        AnyKernel3

      cd AnyKernel3

      git checkout "$ANYKERNEL_REF"

      echo
      echo "AnyKernel3 commit:"
      git rev-parse HEAD

      test "$(git rev-parse HEAD)" = "$ANYKERNEL_REF"

  # ============================================================
  # 18. COPY KERNEL IMAGE
  # ============================================================

  - name: Prepare AnyKernel3
    run: |
      set -e

      cp \
        kernel/out/arch/arm64/boot/Image \
        AnyKernel3/Image

      echo "Image copied."

      ls -lh AnyKernel3/Image

  # ============================================================
  # 19. CREATE BUILD INFO
  # ============================================================

  - name: Create build information
    run: |
      set -e

      mkdir -p release

      cat > release/build-info.txt <<EOF
      ==========================================
      POCO F5 MARBLE KERNEL
      ==========================================

      Device:
      POCO F5 / marblein

      Kernel source:
      $KERNEL_REPO

      Kernel branch:
      $KERNEL_BRANCH

      Kernel commit:
      $(cd kernel && git rev-parse HEAD)

      Defconfig:
      $DEFCONFIG

      Root manager:
      ReSukiSU

      ReSukiSU ref:
      $MANAGER_REF

      SUSFS:
      v2.2.0

      SUSFS commit:
      $SUSFS_REF

      Toolchain:
      Android Clang

      Clang:
      $CLANG_DIR

      Clang commit:
      $CLANG_REF

      LTO:
      Thin

      AnyKernel3:
      $ANYKERNEL_REF

      GitHub workflow:
      $GITHUB_WORKFLOW

      GitHub run:
      $GITHUB_RUN_ID

      ==========================================
      EOF

      cat release/build-info.txt

  # ============================================================
  # 20. PACKAGE FLASHABLE ZIP
  # ============================================================

  - name: Create flashable ZIP
    run: |
      set -e

      cd AnyKernel3

      rm -f ../release/*.zip

      ZIP_NAME="POCO_F5_marble_ReSukiSU_SUSFS_v2.2.0.zip"

      zip -r -9 \
        "../release/$ZIP_NAME" \
        . \
        -x ".git/*" \
        -x ".github/*"

      cd ..

      echo
      echo "ZIP created:"
      ls -lh release/*.zip

  # ============================================================
  # 21. SHA256
  # ============================================================

  - name: Generate SHA256
    run: |
      set -e

      cd release

      sha256sum \
        *.zip \
        > SHA256SUMS.txt

      cat SHA256SUMS.txt

  # ============================================================
  # 22. COPY CONFIG
  # ============================================================

  - name: Export final configuration
    run: |
      cp \
        kernel/out/.config \
        release/marble_final_config

  # ============================================================
  # 23. PACKAGE BUILD LOG
  # ============================================================

  - name: Export build log
    if: always()
    run: |
      if [ -f kernel/build.log ]; then
        cp kernel/build.log release/build.log
      fi

  # ============================================================
  # 24. UPLOAD ARTIFACT
  # ============================================================

  - name: Upload kernel artifacts
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: POCO-F5-Marble-ReSukiSU-SUSFS
      path: release/
      if-no-files-found: warn
      retention-days: 14
