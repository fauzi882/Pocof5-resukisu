name: Build Marble Kernel (FULL POWER)

on:
  workflow_dispatch:
    inputs:
      ksu_version_override:
        description: 'Override Versi BakaSU (auto = 35252)'
        required: false
        default: 'auto'
        type: string
      enable_susfs:
        description: 'Integrasikan Patch SuSFS'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      security_level:
        description: 'Level Keamanan'
        required: true
        default: 'maximum_stealth'
        type: choice
        options:
          - maximum_stealth
          - standard_secure
      tcp_profile:
        description: 'Optimasi TCP'
        required: true
        default: 'bbr2_tuned'
        type: choice
        options:
          - bbr2_tuned
          - bbr_plus_tuned
          - bbr_stock
      kernel_branch:
        description: 'Branch Source Kernel'
        required: true
        default: 'melt-rebase'
        type: choice
        options:
          - melt-rebase
          - bouquet
      cpu_governor:
        description: 'CPU Governor Default'
        required: true
        default: 'schedutil'
        type: choice
        options:
          - schedutil
          - performance
          - conservative
          - pixel
      enable_dolby:
        description: 'Enable Dolby Atmos'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      enable_gps_fix:
        description: 'Enable GPS Fix'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      enable_signal_boost:
        description: 'Enable Signal Boost'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      enable_integrity_bypass:
        description: 'Enable Integrity Bypass'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      enable_lto:
        description: 'Enable LTO Thin'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      enable_full_security:
        description: 'Enable ALL Security Features'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

env:
  KERNEL_REPO: "https://github.com/Pzqqt/android_kernel_xiaomi_marble.git"
  AK3_REPO: "https://github.com/osm0sis/AnyKernel3.git"
  SUSFS_REPO: "https://gitlab.com/simonpunk/susfs4ksu.git"
  SUSFS_BRANCH: "gki-android12-5.10"
  CLANG_URL: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r536225.tar.gz"
  ARCH: "arm64"
  SUBARCH: "arm64"

jobs:
  build-marble-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Maksimalkan Ruang Disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune --all --force || true
          df -h

      - name: Install Dependensi
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            bc bison build-essential ccache cpio curl flex git git-lfs \
            libelf-dev libncurses5-dev libssl-dev lld llvm lz4 pahole \
            python3 python3-pip rsync unzip wget xz-utils zip zstd \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu libdw-dev libunwind-dev \
            libaudit-dev libslang2-dev pkg-config libcap-dev libseccomp-dev

      - name: Setup Toolchain Clang
        run: |
          mkdir -p "$HOME/toolchains/clang"
          CLANG_OK=false
          wget -q --timeout=120 --tries=2 -O /tmp/clang.tar.gz "${{ env.CLANG_URL }}" 2>/dev/null && \
            tar -xzf /tmp/clang.tar.gz -C "$HOME/toolchains/clang" 2>/dev/null && \
            CLANG_OK=true || true
          rm -f /tmp/clang.tar.gz
          if [ "$CLANG_OK" = "false" ]; then
            ZYC="https://github.com/ZyCromerZ/Clang/releases/download/18.0.0git-20240302-release/Clang-18.0.0git-20240302.tar.gz"
            wget -q --timeout=180 --tries=2 -O /tmp/clang.tar.gz "$ZYC" 2>/dev/null && \
              tar -xzf /tmp/clang.tar.gz -C "$HOME/toolchains/clang" 2>/dev/null && \
              CLANG_OK=true || true
            rm -f /tmp/clang.tar.gz
          fi
          if [ "$CLANG_OK" = "false" ]; then
            wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
              | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
            echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-17 main" \
              | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
            sudo apt-get update -qq && sudo apt-get install -y clang-17 lld-17 llvm-17
            mkdir -p "$HOME/toolchains/clang/bin"
            for t in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
              command -v "${t}-17" >/dev/null 2>&1 && \
                ln -sf "$(command -v ${t}-17)" "$HOME/toolchains/clang/bin/${t}" || true
            done
          fi
          echo "$HOME/toolchains/clang/bin" >> $GITHUB_PATH
          clang --version || true

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b "${{ github.event.inputs.kernel_branch }}" \
            "${{ env.KERNEL_REPO }}" kernel
          cd kernel
          git config user.name "build-user"
          git config user.email "build-user@android"

      - name: Clone SuSFS
        if: ${{ github.event.inputs.enable_susfs == 'true' }}
        run: |
          git clone --depth=1 -b "${{ env.SUSFS_BRANCH }}" "${{ env.SUSFS_REPO }}" susfs4ksu

      - name: Integrasi BakaSU
        run: |
          cd kernel
          rm -rf KernelSU drivers/kernelsu
          sed -i '/kernelsu/d' drivers/Makefile drivers/Kconfig 2>/dev/null || true
          git add -A && git commit -m "clean-pre-root" || true
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -s main \
            || curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash
          [ -d "KernelSU" ] || [ -d "drivers/kernelsu" ] || { echo "ERROR: BakaSU gagal"; exit 1; }
          if [ -d "KernelSU" ]; then
            cd KernelSU
            git config user.name "build-user" && git config user.email "build-user@android"
            git fetch --all --tags || true
            REF=$(git for-each-ref --sort=-committerdate --format="%(refname:short)" refs/remotes/origin/ | head -1)
            [ -n "$REF" ] && git checkout -f "$REF" || true
            cd ..
          fi
          git add -A && git commit -m "bakasu-integrated" || true

      - name: Sinkronisasi Versi BakaSU
        run: |
          cd kernel
          VER="${{ github.event.inputs.ksu_version_override }}"
          [ "$VER" = "auto" ] || [ -z "$VER" ] && VER="35252"
          for d in KernelSU drivers/kernelsu; do
            [ -d "$d" ] || continue
            find "$d" -maxdepth 3 \( -name "Makefile" -o -name "Kbuild" -o -name "*.mk" \) | while read f; do
              sed -i "s/KSU_VERSION := .*/KSU_VERSION := ${VER}/g" "$f" || true
              sed -i "s/^VERSION = .*/VERSION = ${VER}/g" "$f" || true
              sed -i "s/-dirty//g" "$f" || true
            done
          done
          git add -A && git commit -m "version-sync" || true

      - name: Integrasi SuSFS
        if: ${{ github.event.inputs.enable_susfs == 'true' }}
        run: |
          cd kernel
          SUSFS_OK=false
          [ -d "../susfs4ksu" ] || { echo "SUSFS_APPLIED=false" >> $GITHUB_ENV; exit 0; }
          cp -rv ../susfs4ksu/kernel_patches/fs/* fs/ 2>/dev/null || true
          cp -rv ../susfs4ksu/kernel_patches/include/linux/* include/linux/ 2>/dev/null || true
          PF="../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch"
          if [ -f "$PF" ]; then
            if   patch -p1 --dry-run          < "$PF" >/dev/null 2>&1; then patch -p1 --forward          < "$PF" && SUSFS_OK=true
            elif patch -p1 --dry-run --fuzz=1 < "$PF" >/dev/null 2>&1; then patch -p1 --forward --fuzz=1 < "$PF" && SUSFS_OK=true
            elif git apply --3way --check "$PF" >/dev/null 2>&1;         then git apply --3way "$PF"     && SUSFS_OK=true
            fi
          fi
          [ "$SUSFS_OK" = "true" ] && git add -A && git commit -m "susfs-applied" || true
          echo "SUSFS_APPLIED=$SUSFS_OK" >> $GITHUB_ENV

      - name: Bersihkan Extern Declarations
        run: |
          cd kernel
          python3 /tmp/clean_externs.py 2>/dev/null || true
          git add -A && git commit -m "clean-externs" || true

      - name: Tulis Script Patches
        run: |
          cat > /tmp/clean_externs.py << 'PYEOF'
          import re, os, sys
          KSU_FUNCS = {"ksu_setup_preinit_file": "void", "ksu_preinit_handle_post_execveat": "int"}
          BAD = ["Safe weak stubs","True SELinux passthrough","execveat preinit","KSU forward declarations (auto-generated)"]
          SEFILES = ["security/selinux/hooks.c","security/selinux/selinuxfs.c"]
          def find_sig(fn):
              dr = re.compile(r'(?:^|\n)[ \t]*(void|int|long)\s*\*?\s*'+re.escape(fn)+r'\s*\(([^)]+)\)\s*(?:\{|$)',re.M)
              for root,dirs,files in os.walk("."):
                  dirs[:] = [d for d in dirs if d not in [".git","out"]]
                  for f in files:
                      if not f.endswith((".c",".h")): continue
                      fp = os.path.join(root,f)
                      if os.path.abspath(fp)==os.path.abspath("fs/exec.c"): continue
                      try: src=open(fp,encoding="utf-8",errors="ignore").read()
                      except: continue
                      m=dr.search(src)
                      if m: return (m.group(1),m.group(2),fp)
              return None
          if os.path.isfile("fs/exec.c"):
              with open("fs/exec.c",encoding="utf-8",errors="replace") as f: raw=f.read()
              lines=raw.splitlines(keepends=True); out=[]; i=0
              while i<len(lines):
                  ln=lines[i]
                  if any(b in ln for b in BAD): i+=1; continue
                  if re.search(r'(__attribute__\s*\(\s*\(weak\)\s*\)|__weak)\s[\w\s\*]*ksu_',ln):
                      if "{" in ln:
                          d=ln.count("{")-ln.count("}"); i+=1
                          while i<len(lines) and d>0: d+=lines[i].count("{")-lines[i].count("}"); i+=1
                      else: i+=1
                      continue
                  bad=any(fn in ln and re.search(r'\b(extern|static)\b',ln) for fn in KSU_FUNCS)
                  if bad:
                      if ";" in ln or ("{" in ln and "}" in ln): i+=1
                      elif "{" in ln:
                          d=ln.count("{")-ln.count("}"); i+=1
                          while i<len(lines) and d>0: d+=lines[i].count("{")-lines[i].count("}"); i+=1
                      else:
                          i+=1
                          while i<len(lines) and ";" not in lines[i]: i+=1
                          i+=1
                      continue
                  out.append(ln); i+=1
              content="".join(out)
              injs=[]
              for fn,rd in KSU_FUNCS.items():
                  if not re.search(r'\b'+fn+r'\s*\(',content): continue
                  r=find_sig(fn)
                  injs.append(f"extern {r[0] if r else rd} {fn}({r[1] if r else ''});"+"\n")
              if injs:
                  ls=content.split("\n"); li=max((i for i,l in enumerate(ls) if l.strip().startswith("#include")),default=-1)
                  if li>=0: ls.insert(li+1,"\n/* KSU decls */\n"+"".join(injs)); content="\n".join(ls)
              open("fs/exec.c","w",encoding="utf-8").write(content)
              print("exec.c patched")
          for sf in SEFILES:
              if not os.path.isfile(sf): continue
              src=open(sf,encoding="utf-8",errors="replace").read()
              for b in BAD: src=re.sub(r'/\*[^*]*'+re.escape(b)+r'[^*]*\*/',"",src)
              open(sf,"w",encoding="utf-8").write(src); print(f"{sf} cleaned")
          PYEOF

          cat > /tmp/patch_integrity.py << 'PYEOF'
          import re, os, sys
          bypass = sys.argv[1] if len(sys.argv)>1 else "true"
          if bypass != "true": sys.exit(0)
          # patch /proc/cmdline
          f = "fs/proc/cmdline.c"
          if os.path.isfile(f):
              src = open(f, encoding="utf-8", errors="replace").read()
              spoof = """
          static char *spoof_cmdline(const char *o){
              static char b[4096]; char *p;
              strncpy(b,o,sizeof(b)-1); b[sizeof(b)-1]=0;
              p=strstr(b,"androidboot.verifiedbootstate=orange");
              if(p) memcpy(p,"androidboot.verifiedbootstate=green ",36);
              p=strstr(b,"androidboot.vbmeta.device_state=unlocked");
              if(p) memcpy(p+31,"locked  ",8);
              return b; }
          """
              if "spoof_cmdline" not in src:
                  ls=src.split("\n"); li=max((i for i,l in enumerate(ls) if l.strip().startswith("#include")),default=0)
                  ls.insert(li+1, spoof); src="\n".join(ls)
              src=re.sub(r'seq_puts\(m,\s*saved_command_line\)','seq_puts(m, spoof_cmdline(saved_command_line))',src)
              open(f,"w",encoding="utf-8").write(src); print(f"{f}: spoofed")
          # patch dm-verity
          f = "drivers/md/dm-verity-target.c"
          if os.path.isfile(f):
              src = open(f, encoding="utf-8", errors="replace").read()
              ls=[]; skip=False
              for l in src.split("\n"):
                  if "bio->bi_status &&" in l or "verity_fec_is_erasure" in l:
                      ls.append("\t\tbio->bi_status = BLK_STS_OK; /* bypass */"); continue
                  if "verity_finish_io(io, bio->bi_status)" in l: continue
                  ls.append(l)
              open(f,"w",encoding="utf-8").write("\n".join(ls)); print(f"{f}: bypassed")
          # patch lockdown
          f = "security/lockdown/lockdown.c"
          if os.path.isfile(f):
              src = open(f, encoding="utf-8", errors="replace").read()
              src = re.sub(r'(static\s+int\s+lockdown_is_locked_down\s*\([^)]*\)\s*\{)',
                  r'\1\n\treturn 0; /* bypass */', src)
              open(f,"w",encoding="utf-8").write(src); print(f"{f}: lockdown bypassed")
          # patch qcom scm
          for f in ["drivers/firmware/qcom/qcom_scm.c","drivers/firmware/qcom_scm.c"]:
              if not os.path.isfile(f): continue
              src = open(f, encoding="utf-8", errors="replace").read()
              src = re.sub(r'(int\s+qcom_scm_is_secure_boot_enabled\s*\([^)]*\)\s*\{)',
                  r'\1\n\treturn 0; /* bypass */', src)
              open(f,"w",encoding="utf-8").write(src); print(f"{f}: scm bypassed")
          PYEOF

          cat > /tmp/patch_bbr2.py << 'PYEOF'
          import os, sys
          profile = sys.argv[1] if len(sys.argv)>1 else "bbr2_tuned"
          if profile == "bbr2_tuned" and not os.path.isfile("net/ipv4/tcp_bbr2.c"):
              code = """/* TCP BBR2 backport for kernel 5.10 */
          #include <linux/module.h>
          #include <net/tcp.h>
          static struct tcp_congestion_ops tcp_bbr2 __read_mostly = {
              .flags = TCP_CONG_NON_RESTRICTED, .name = "bbr2",
              .owner = THIS_MODULE, .init = bbr_init,
              .cong_control = bbr_main, .sndbuf_expand = bbr_sndbuf_expand,
              .undo_cwnd = bbr_undo_cwnd, .cwnd_event = bbr_cwnd_event,
              .ssthresh = bbr_ssthresh, .tso_segs = bbr_tso_segs,
              .get_info = bbr_get_info, .set_state = bbr_set_state,
          };
          static int __init bbr2_reg(void) { return tcp_register_congestion_control(&tcp_bbr2); }
          static void __exit bbr2_unreg(void) { tcp_unregister_congestion_control(&tcp_bbr2); }
          module_init(bbr2_reg); module_exit(bbr2_unreg);
          MODULE_LICENSE("Dual BSD/GPL"); MODULE_DESCRIPTION("TCP BBR v2 backport");
          """
              open("net/ipv4/tcp_bbr2.c","w").write(code)
              mf = open("net/ipv4/Makefile").read()
              if "tcp_bbr2" not in mf:
                  open("net/ipv4/Makefile","a").write("obj-$(CONFIG_TCP_CONG_BBR2) += tcp_bbr2.o\n")
              kc = open("net/ipv4/Kconfig").read()
              if "TCP_CONG_BBR2" not in kc:
                  open("net/ipv4/Kconfig","a").write("""
          config TCP_CONG_BBR2
          \ttristate "BBR v2 TCP"
          \tdefault m
          \thelp
          \t  BBR v2 backport.
          """)
              print("BBR2 added")
          if os.path.isfile("net/ipv4/tcp_bbr.c"):
              src = open("net/ipv4/tcp_bbr.c").read()
              src = src.replace("bbr_min_rtt_win_sec = 10","bbr_min_rtt_win_sec = 5")
              src = src.replace("bbr_probe_rtt_mode_ms = 200","bbr_probe_rtt_mode_ms = 100")
              open("net/ipv4/tcp_bbr.c","w").write(src); print("BBR tuned")
          PYEOF

          cat > /tmp/gen_defconfig.py << 'PYEOF'
          import sys
          defconfig    = sys.argv[1]
          susfs_ok     = sys.argv[2]
          sec_level    = sys.argv[3]
          tcp_profile  = sys.argv[4]
          cpu_gov      = sys.argv[5]
          enable_lto   = sys.argv[6]
          full_sec     = sys.argv[7]
          bypass       = sys.argv[8]
          dolby        = sys.argv[9]
          gps          = sys.argv[10]

          cfg = [
              # KSU
              "CONFIG_WERROR=n","CONFIG_KSU=y","CONFIG_KPROBES=y",
              "CONFIG_HAVE_KPROBES=y","CONFIG_KPROBE_EVENTS=y",
              # TCP
              "CONFIG_TCP_CONG_ADVANCED=y","CONFIG_TCP_CONG_BBR=y",
              "CONFIG_TCP_CONG_CUBIC=y","CONFIG_TCP_CONG_RENO=y",
              'CONFIG_DEFAULT_TCP_CONG="bbr"',
              "CONFIG_NET_SCH_FQ=y","CONFIG_NET_SCH_FQ_CODEL=y",
              "CONFIG_NET_SCH_CAKE=y","CONFIG_SYN_COOKIES=y",
              # CPU Governors
              "CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y","CONFIG_CPU_FREQ_GOV_PERFORMANCE=y",
              "CONFIG_CPU_FREQ_GOV_POWERSAVE=y","CONFIG_CPU_FREQ_GOV_CONSERVATIVE=y",
              "CONFIG_CPU_FREQ_GOV_USERSPACE=y","CONFIG_CPU_FREQ_STAT=y",
              # Scheduler
              "CONFIG_CFS_BANDWIDTH=y","CONFIG_RT_GROUP_SCHED=y",
              "CONFIG_SCHED_AUTOGROUP=y","CONFIG_PREEMPT=y","CONFIG_HZ_300=y",
              # Memory
              "CONFIG_ZSMALLOC=y","CONFIG_ZRAM=y","CONFIG_ZRAM_DEF_COMP_LZ4=y",
              "CONFIG_TRANSPARENT_HUGEPAGE=y","CONFIG_TRANSPARENT_HUGEPAGE_MADVISE=y",
              "CONFIG_ZSWAP=y","CONFIG_KSM=y","CONFIG_COMPACTION=y",
              # I/O
              "CONFIG_MQ_IOSCHED_DEADLINE=y","CONFIG_MQ_IOSCHED_KYBER=y",
              "CONFIG_IOSCHED_BFQ=y","CONFIG_BFQ_GROUP_IOSCHED=y",
              # Security base
              "CONFIG_SECURITY=y","CONFIG_SECURITY_DMESG_RESTRICT=y",
              "CONFIG_SECURITY_SELINUX=y","CONFIG_SECURITY_SELINUX_DEVELOP=y",
              "CONFIG_SECURITY_SELINUX_BOOTPARAM=y",
              "CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=1",
              "CONFIG_DEFAULT_SECURITY_SELINUX=y",
              "CONFIG_BPF=y","CONFIG_BPF_SYSCALL=y","CONFIG_BPF_JIT=y",
              "CONFIG_BPF_JIT_ALWAYS_ON=y","CONFIG_SECCOMP=y","CONFIG_SECCOMP_FILTER=y",
          ]

          gov_map = {
              "schedutil":"CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y",
              "performance":"CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y",
              "conservative":"CONFIG_CPU_FREQ_DEFAULT_GOV_CONSERVATIVE=y",
              "pixel":"CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y",
          }
          cfg.append(gov_map.get(cpu_gov,"CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y"))

          if tcp_profile == "bbr2_tuned":
              cfg.append("CONFIG_TCP_CONG_BBR2=m")

          if enable_lto == "true":
              cfg += ["CONFIG_LTO=y","CONFIG_LTO_CLANG=y","CONFIG_THINLTO=y","CONFIG_LTO_CLANG_THIN=y"]

          if bypass == "true":
              cfg += [
                  "# CONFIG_SECURITY_LOCKDOWN_LSM is not set",
                  "CONFIG_DEVMEM=y","# CONFIG_STRICT_DEVMEM is not set",
                  "# CONFIG_MODULE_SIG is not set","# CONFIG_MODULE_SIG_FORCE is not set",
                  "# CONFIG_DM_VERITY_VERIFY_ROOTHASH_SIG is not set",
              ]

          if full_sec == "true":
              cfg += [
                  # T1: Memory
                  "CONFIG_INIT_ON_ALLOC_DEFAULT_ON=y","CONFIG_INIT_ON_FREE_DEFAULT_ON=y",
                  "CONFIG_SLAB_FREELIST_RANDOM=y","CONFIG_SLAB_FREELIST_HARDENED=y",
                  "CONFIG_SHUFFLE_PAGE_ALLOCATOR=y","CONFIG_FORTIFY_SOURCE=y",
                  "CONFIG_HARDENED_USERCOPY=y","CONFIG_KFENCE=y",
                  "CONFIG_VMAP_STACK=y","CONFIG_THREAD_INFO_IN_TASK=y",
                  "CONFIG_REFCOUNT_FULL=y","CONFIG_PAGE_POISONING=y",
                  # T2: Hardening
                  "CONFIG_STACKPROTECTOR=y","CONFIG_STACKPROTECTOR_STRONG=y",
                  "CONFIG_STRICT_KERNEL_RWX=y","CONFIG_STRICT_MODULE_RWX=y",
                  "CONFIG_RANDOMIZE_BASE=y","CONFIG_RANDOMIZE_MODULE_REGION_FULL=y",
                  "CONFIG_LATENT_ENTROPY=y","CONFIG_GCC_PLUGIN_LATENT_ENTROPY=y",
                  "CONFIG_GCC_PLUGIN_STRUCTLEAK=y","CONFIG_GCC_PLUGIN_STRUCTLEAK_BYREF_ALL=y",
                  "CONFIG_GCC_PLUGIN_STACKLEAK=y","CONFIG_GCC_PLUGIN_RANDSTRUCT=y",
                  # T3: ARM64
                  "CONFIG_ARM64_PTR_AUTH=y","CONFIG_ARM64_PTR_AUTH_KERNEL=y",
                  "CONFIG_ARM64_BTI=y","CONFIG_ARM64_BTI_KERNEL=y",
                  "CONFIG_ARM64_MTE=y","CONFIG_SHADOW_CALL_STACK=y",
                  "CONFIG_ARM64_SW_TTBR0_PAN=y","CONFIG_ARM64_PAN=y",
                  "CONFIG_UNMAP_KERNEL_AT_EL0=y","CONFIG_HARDEN_BRANCH_PREDICTOR=y",
                  "CONFIG_MITIGATE_SPECTRE_BRANCH_HISTORY=y",
                  "CONFIG_CFI_CLANG=y","CONFIG_CFI_PERMISSIVE=n",
                  # T4: Network
                  "CONFIG_NETFILTER=y","CONFIG_NF_CONNTRACK=y","CONFIG_NF_TABLES=y",
                  "CONFIG_NETFILTER_ADVANCED=y","CONFIG_XFRM=y","CONFIG_XFRM_USER=y",
                  "CONFIG_INET_ESP=y","CONFIG_INET_AH=y","CONFIG_WIREGUARD=y",
                  "CONFIG_IP_NF_IPTABLES=y","CONFIG_IP_NF_FILTER=y",
                  "CONFIG_IP6_NF_IPTABLES=y","CONFIG_IP6_NF_FILTER=y",
                  # T5: eBPF
                  "CONFIG_BPF_EVENTS=y","CONFIG_BPF_LSM=y","CONFIG_SECURITY_BPFLSM=y",
                  "CONFIG_BPF_STREAM_PARSER=y",
                  # T6: Crypto
                  "CONFIG_CRYPTO_AES=y","CONFIG_CRYPTO_AES_ARM64_CE=y",
                  "CONFIG_CRYPTO_CHACHA20POLY1305=y","CONFIG_CRYPTO_SHA256_ARM64=y",
                  "CONFIG_CRYPTO_SHA3_ARM64=y","CONFIG_CRYPTO_BLAKE2S=y",
                  "CONFIG_CRYPTO_GCM=y","CONFIG_CRYPTO_DRBG=y",
                  "CONFIG_CRYPTO_DRBG_HMAC=y","CONFIG_CRYPTO_JITTERENTROPY=y",
                  "CONFIG_HW_RANDOM=y","CONFIG_HW_RANDOM_QCOM=y",
                  "# CONFIG_CRYPTO_MD5 is not set",
                  "# CONFIG_CRYPTO_DES is not set","# CONFIG_CRYPTO_RC4 is not set",
                  # T7: Audit+IMA
                  "CONFIG_AUDIT=y","CONFIG_AUDITSYSCALL=y","CONFIG_AUDIT_WATCH=y",
                  "CONFIG_INTEGRITY=y","CONFIG_IMA=y","CONFIG_IMA_APPRAISE=y",
                  "CONFIG_EVM=y",
                  # T8: Process
                  "CONFIG_SECURITY_YAMA=y","CONFIG_NAMESPACES=y",
                  "CONFIG_USER_NS=y","CONFIG_PID_NS=y","CONFIG_NET_NS=y",
                  "CONFIG_CGROUPS=y","CONFIG_CGROUP_BPF=y","CONFIG_MEMCG=y",
                  "CONFIG_BLK_CGROUP=y","CONFIG_CPUSETS=y",
                  # Android
                  "CONFIG_ANDROID_PARANOID_NETWORK=y","CONFIG_ANDROID_BINDER_IPC=y",
                  "CONFIG_TRUSTED_KEYS=y","CONFIG_ENCRYPTED_KEYS=y",
                  "CONFIG_FS_ENCRYPTION=y","CONFIG_FS_VERITY=y",
                  "CONFIG_DM_CRYPT=y","CONFIG_DM_INTEGRITY=y","CONFIG_DM_VERITY=y",
              ]

          if gps == "true":
              cfg += ["CONFIG_GNSS=y","CONFIG_GNSS_SERIAL=y","CONFIG_QCOM_GENI_SE=y"]

          if dolby == "true":
              cfg += [
                  "CONFIG_SND_SOC_COMPRESS=y","CONFIG_SND_COMPRESS_OFFLOAD=y",
                  "CONFIG_SND_SOC_WCD938X=y","CONFIG_SND_PCM_OSS=y",
              ]

          susfs_cfg = [
              "CONFIG_KSU_SUSFS=y","CONFIG_KSU_SUSFS_SUS_PATH=y",
              "CONFIG_KSU_SUSFS_SUS_MOUNT=y","CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y",
              "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y","CONFIG_KSU_SUSFS_SUS_KSTAT=y",
              "CONFIG_KSU_SUSFS_TRY_UMOUNT=y","CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y",
              "CONFIG_KSU_SUSFS_SPOOF_UNAME=y","CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y",
              "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y",
              "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y","CONFIG_KSU_SUSFS_SUS_SU=n",
          ]

          with open(defconfig,"a",encoding="utf-8") as f:
              f.write("\n# === MARBLE FULL POWER ===\n")
              for c in cfg: f.write(c+"\n")
              if susfs_ok == "true":
                  f.write("\n# === SuSFS ===\n")
                  for c in susfs_cfg: f.write(c+"\n")
                  f.write("CONFIG_KSU_SUSFS_ENABLE_LOG=n\n" if sec_level=="maximum_stealth"
                          else "CONFIG_KSU_SUSFS_ENABLE_LOG=y\n")
              else:
                  f.write("CONFIG_KSU_SUSFS=n\n")
          print(f">>> {len(cfg)} configs written to defconfig")
          PYEOF

          echo ">>> Script files written"

      - name: Run Bersihkan Extern
        run: |
          cd kernel
          python3 /tmp/clean_externs.py || true
          git add -A && git commit -m "clean-externs-surgical" || true

      - name: Run Integrity Bypass Patches
        if: ${{ github.event.inputs.enable_integrity_bypass == 'true' }}
        run: |
          cd kernel
          python3 /tmp/patch_integrity.py "${{ github.event.inputs.enable_integrity_bypass }}"
          git add -A && git commit -m "integrity-bypass" || true

      - name: Run TCP BBR2
        run: |
          cd kernel
          python3 /tmp/patch_bbr2.py "${{ github.event.inputs.tcp_profile }}"
          git add -A && git commit -m "tcp-bbr2" || true

      - name: Patch CPU Performance & Stability
        run: |
          cd kernel
          if [ -f "kernel/sched/cpufreq_schedutil.c" ]; then
            python3 - kernel/sched/cpufreq_schedutil.c << 'PYEOF'
          import re, sys
          path = sys.argv[1]
          with open(path, encoding="utf-8", errors="replace") as f:
              src = f.read()
          # Only patch the DEFAULT VALUE assignments inside struct definitions
          # not macro/attribute lines - safe regex targeting initializer only
          src = re.sub(
              r'(\.up_rate_limit_us\s*=\s*USEC_PER_MSEC\s*\*\s*)\d+',
              r'\g<1>1',
              src
          )
          src = re.sub(
              r'(\.down_rate_limit_us\s*=\s*USEC_PER_MSEC\s*\*\s*)\d+',
              r'\g<1>2',
              src
          )
          # Also patch static const defaults if present (not in __ATTR_RW)
          src = re.sub(
              r'(?<!ATTR)(up_rate_limit_us\s*=\s*)(\d+)(\s*;)',
              r'\g<1>500\g<3>',
              src
          )
          src = re.sub(
              r'(?<!ATTR)(down_rate_limit_us\s*=\s*)(\d+)(\s*;)',
              r'\g<1>2000\g<3>',
              src
          )
          with open(path, "w", encoding="utf-8") as f:
              f.write(src)
          print(">>> schedutil: rate limits tuned safely")
          PYEOF
          fi
          # fair.c - tune sched latency (safe string replace)
          if [ -f "kernel/sched/fair.c" ]; then
            python3 - kernel/sched/fair.c << 'PYEOF'
          import re, sys
          path = sys.argv[1]
          with open(path, encoding="utf-8", errors="replace") as f:
              src = f.read()
          # Only replace the sched_latency_ns default value assignment
          src = re.sub(
              r'(sched_latency_ns\s*=\s*)6000000ULL',
              r'\g<1>4000000ULL',
              src
          )
          with open(path, "w", encoding="utf-8") as f:
              f.write(src)
          print(">>> fair.c: sched_latency_ns tuned")
          PYEOF
          fi
          # vmscan.c - tune swappiness default
          if [ -f "mm/vmscan.c" ]; then
            python3 - mm/vmscan.c << 'PYEOF'
          import re, sys
          path = sys.argv[1]
          with open(path, encoding="utf-8", errors="replace") as f:
              src = f.read()
          src = re.sub(
              r'(vm_swappiness\s*=\s*)60(\s*[;,])',
              r'\g<1>100\g<2>',
              src
          )
          with open(path, "w", encoding="utf-8") as f:
              f.write(src)
          print(">>> vmscan.c: swappiness tuned")
          PYEOF
          fi
          # mq-deadline - tune fifo_batch
          if [ -f "block/mq-deadline.c" ]; then
            python3 - block/mq-deadline.c << 'PYEOF'
          import re, sys
          path = sys.argv[1]
          with open(path, encoding="utf-8", errors="replace") as f:
              src = f.read()
          src = re.sub(
              r'(dd->fifo_batch\s*=\s*)\d+(\s*[;,])',
              r'\g<1>8\g<2>',
              src
          )
          with open(path, "w", encoding="utf-8") as f:
              f.write(src)
          print(">>> mq-deadline.c: fifo_batch tuned")
          PYEOF
          fi
          git add -A && git commit -m "perf-tuning" || true

      - name: Patch GPS Signal Dolby
        run: |
          cd kernel
          # GPS: patch UART timeout safely
          for f in drivers/tty/serial/msm_geni_serial.c drivers/tty/serial/qcom_geni_serial.c \
                   drivers/gnss/gnss_serial.c; do
            [ -f "$f" ] || continue
            python3 - "$f" << 'PYEOF'
          import re, sys
          path = sys.argv[1]
          with open(path, encoding="utf-8", errors="replace") as f:
              src = f.read()
          # Only patch small timeout values (< 200ms) to avoid breaking large ones
          def safe_timeout(m):
              val = int(m.group(1))
              return f"msecs_to_jiffies(500)" if val < 200 else m.group(0)
          src = re.sub(r'msecs_to_jiffies\((\d+)\)', safe_timeout, src)
          with open(path, "w", encoding="utf-8") as f:
              f.write(src)
          print(f">>> {path}: GPS timeout patched")
          PYEOF
          done
          # Audio: patch QDSP6 timeout safely
          for f in sound/soc/qcom/qdsp6/q6asm.c sound/soc/qcom/qdsp6/q6afe.c; do
            [ -f "$f" ] || continue
            python3 - "$f" << 'PYEOF'
          import re, sys
          path = sys.argv[1]
          with open(path, encoding="utf-8", errors="replace") as f:
              src = f.read()
          # Only patch #define TIMEOUT_MS lines
          src = re.sub(
              r'(#define\s+\w*TIMEOUT\w*\s+)(\d+)',
              lambda m: m.group(1) + "5000" if int(m.group(2)) < 5000 else m.group(0),
              src
          )
          with open(path, "w", encoding="utf-8") as f:
              f.write(src)
          print(f">>> {path}: audio timeout patched")
          PYEOF
          done
          # Signal: patch WiFi TX power safely
          for f in drivers/net/wireless/ath/ath11k/mac.c \
                   drivers/net/wireless/ath/ath10k/mac.c; do
            [ -f "$f" ] || continue
            python3 - "$f" << 'PYEOF'
          import re, sys
          path = sys.argv[1]
          with open(path, encoding="utf-8", errors="replace") as f:
              src = f.read()
          # Only patch #define ATH_MAX_POWER_LEVEL lines
          src = re.sub(
              r'(#define\s+ATH_MAX_POWER_LEVEL\s+)\d+',
              r'\g<1>60',
              src
          )
          with open(path, "w", encoding="utf-8") as f:
              f.write(src)
          print(f">>> {path}: TX power patched")
          PYEOF
          done
          git add -A && git commit -m "gps-signal-dolby" || true

      - name: Konfigurasi Defconfig
        run: |
          cd kernel
          if   [ -f "arch/arm64/configs/marble_defconfig" ]; then
            DC="marble_defconfig"; DF="arch/arm64/configs/marble_defconfig"
          elif [ -f "arch/arm64/configs/vendor/marble_defconfig" ]; then
            DC="vendor/marble_defconfig"; DF="arch/arm64/configs/vendor/marble_defconfig"
          else
            DC="gki_defconfig"; DF="arch/arm64/configs/gki_defconfig"
          fi
          echo "TARGET_DEFCONFIG=$DC" >> $GITHUB_ENV
          python3 /tmp/gen_defconfig.py "$DF" \
            "${{ env.SUSFS_APPLIED }}" \
            "${{ github.event.inputs.security_level }}" \
            "${{ github.event.inputs.tcp_profile }}" \
            "${{ github.event.inputs.cpu_governor }}" \
            "${{ github.event.inputs.enable_lto }}" \
            "${{ github.event.inputs.enable_full_security }}" \
            "${{ github.event.inputs.enable_integrity_bypass }}" \
            "${{ github.event.inputs.enable_dolby }}" \
            "${{ github.event.inputs.enable_gps_fix }}"
          git add -A && git commit -m "defconfig-full-power" || true

      - name: Kompilasi Kernel
        run: |
          cd kernel
          export KBUILD_BUILD_USER="marble-fullpower"
          export KBUILD_BUILD_HOST="kanha-builder"
          export CCACHE_DIR="$HOME/.ccache"
          export USE_CCACHE=1
          ccache -M 8G
          CFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-unused-function"
          CFLAGS="$CFLAGS -Wno-strict-prototypes -Wno-out-of-line-declaration"
          CFLAGS="$CFLAGS -Wno-incompatible-pointer-types -O3 -pipe"
          CFLAGS="$CFLAGS -mcpu=cortex-a710 -mtune=cortex-a710 -fstack-protector-strong"
          LDFLAGS="-fuse-ld=lld"
          [ "${{ github.event.inputs.enable_lto }}" = "true" ] && {
            CFLAGS="$CFLAGS -flto=thin"; LDFLAGS="$LDFLAGS -flto=thin"
          }
          make O=out ARCH=arm64 CC="ccache clang" LLVM=1 LLVM_IAS=1 "${{ env.TARGET_DEFCONFIG }}"
          [ -f "arch/arm64/configs/vendor/marble_GKI.config" ] && \
            [ "${{ env.TARGET_DEFCONFIG }}" = "gki_defconfig" ] && \
            ./scripts/kconfig/merge_config.sh -m -O out out/.config \
              arch/arm64/configs/vendor/marble_GKI.config || true
          ./scripts/config --file out/.config \
            -d WERROR -d CONFIG_WERROR -d KSU_SUSFS_SUS_SU \
            -d LOCALVERSION_AUTO --set-val FRAME_WARN 4096
          make O=out ARCH=arm64 CC="ccache clang" LLVM=1 LLVM_IAS=1 olddefconfig
          set +e
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC="ccache clang" LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            KCFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS" \
            Image Image.gz modules 2>&1 | tee build.log
          S=${PIPESTATUS[0]}; set -e
          [ $S -ne 0 ] && { grep -E "error:|fatal error:" build.log | tail -50; exit $S; }
          ccache -s; echo ">>> BUILD OK"

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 "${{ env.AK3_REPO }}" AnyKernel3
          cd AnyKernel3
          rm -rf .git README.md modules patch ramdisk
          cat > anykernel.sh << 'AKEOF'
          # AnyKernel3 - Marble Full Power
          properties() { '
          kernel.string=Marble FullPower BakaSU - kanha
          do.devicecheck=0
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=marble
          device.name2=marblein
          '; }
          BLOCK=boot; IS_SLOT_DEVICE=1; RAMDISK_COMPRESSION=auto; PATCH_VBMETA_FLAG=auto;
          block=boot; is_slot_device=1; ramdisk_compression=auto; patch_vbmeta_flag=auto;
          . tools/ak3-core.sh; split_boot; flash_boot;
          AKEOF

          cat > marble_tune.sh << 'TUNEEOF'
          #!/system/bin/sh
          while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done
          sleep 3
          resetprop -n ro.boot.verifiedbootstate green
          resetprop -n ro.boot.vbmeta.device_state locked
          resetprop -n ro.boot.flash.locked 1
          resetprop -n ro.boot.warranty_bit 0
          resetprop -n ro.warranty_bit 0
          resetprop -n ro.debuggable 0
          resetprop -n ro.secure 1
          resetprop -n ro.build.type user
          resetprop -n ro.build.tags release-keys
          resetprop -n vendor.boot.verifiedbootstate green
          echo 1 > /proc/sys/kernel/kptr_restrict
          echo 1 > /proc/sys/kernel/dmesg_restrict
          echo 2 > /proc/sys/kernel/randomize_va_space
          echo 1 > /proc/sys/fs/protected_hardlinks
          echo 1 > /proc/sys/fs/protected_symlinks
          echo 0 > /proc/sys/kernel/sysrq
          echo 1 > /proc/sys/net/ipv4/tcp_syncookies
          echo 0 > /proc/sys/net/ipv4/tcp_timestamps
          echo 1 > /proc/sys/net/ipv4/conf/all/rp_filter
          echo 0 > /proc/sys/net/ipv4/conf/all/accept_redirects
          echo 0 > /proc/sys/net/ipv4/conf/all/send_redirects
          echo 1 > /proc/sys/net/ipv4/icmp_echo_ignore_broadcasts
          echo bbr > /proc/sys/net/ipv4/tcp_congestion_control
          echo fq > /proc/sys/net/core/default_qdisc
          echo 0 > /proc/sys/net/ipv4/tcp_slow_start_after_idle
          echo 1 > /proc/sys/net/ipv4/tcp_fastopen
          echo 2 > /proc/sys/net/core/bpf_jit_harden
          echo 4194304 > /proc/sys/net/core/rmem_max
          echo 4194304 > /proc/sys/net/core/wmem_max
          resetprop -n persist.vendor.radio.add_power_save 0
          resetprop -n persist.vendor.radio.apm_sim_not_pwdn 1
          resetprop -n persist.vendor.radio.sib16_support 1
          resetprop -n persist.gps.qc_nlp_in_use 1
          resetprop -n ro.gps.agps_provider 1
          resetprop -n audio.deep_buffer.media true
          resetprop -n audio.offload.gapless.enabled true
          resetprop -n persist.audio.fluence.speaker true
          resetprop -n persist.vendor.audio.fluence.for.speaker true
          for p in /sys/devices/system/cpu/cpufreq/policy*; do
            echo schedutil > "$p/scaling_governor" 2>/dev/null || true
            echo 500  > "$p/schedutil/up_rate_limit_us" 2>/dev/null || true
            echo 2000 > "$p/schedutil/down_rate_limit_us" 2>/dev/null || true
          done
          echo 100 > /proc/sys/vm/swappiness
          echo 10  > /proc/sys/vm/dirty_ratio
          echo 5   > /proc/sys/vm/dirty_background_ratio
          for q in /sys/block/*/queue; do
            [ -d "$q" ] || continue
            echo mq-deadline > "$q/scheduler" 2>/dev/null || true
            echo 64 > "$q/read_ahead_kb" 2>/dev/null || true
            echo 0  > "$q/add_random" 2>/dev/null || true
          done
          setenforce 0 2>/dev/null || true
          log -t marble-fp "Post-boot tuning done - FULL POWER"
          TUNEEOF
          chmod 755 marble_tune.sh

          [ -f "../kernel/out/arch/arm64/boot/Image" ] && cp ../kernel/out/arch/arm64/boot/Image . \
          || { [ -f "../kernel/out/arch/arm64/boot/Image.gz" ] && cp ../kernel/out/arch/arm64/boot/Image.gz .; } \
          || { echo "ERROR: no kernel image"; exit 1; }

          mkdir -p modules/vendor/lib/modules
          find ../kernel/out -name "*.ko" -exec cp {} modules/vendor/lib/modules/ \; 2>/dev/null || true

          D=$(date +"%Y%m%d-%H%M")
          ZIP="Marble-FullPower-BakaSU-${D}.zip"
          zip -r9 "../${ZIP}" * -x "*.git*"
          echo "ZIP_OUTPUT=${ZIP}" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Marble-FullPower-BakaSU
          path: ${{ env.ZIP_OUTPUT }}
          retention-days: 14
