      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          make -j2 \
            O=out \
            LLVM=1 \
            LLVM_IAS=1 \
            Image.gz \
            dtbs \
            2>&1 | tee build.log

      - name: Show build error
        if: failure()
        run: |
          echo "===== LAST 150 LINES ====="
          tail -n 150 build.log

          echo
          echo "===== ERRORS ====="
          grep -iE \
            "error:|fatal:|undefined|No such file|No rule|FAILED|Error [0-9]+" \
            build.log \
            | tail -n 100 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: marble-build-log
          path: build.log
