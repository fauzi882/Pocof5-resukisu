name: Build POCO F5 Marble BakaSU SUSFS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Marble BakaSU SUSFS
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT MARBLE KERNEL
      # ============================================================
      - name: Checkout Marble Kernel
        uses: actions/checkout@v4
        with:
          repository: Pzqqt/android_kernel_xiaomi_marble
          ref: melt-rebase
          fetch-depth: 1

      # ============================================================
      # 2. INSTALL BUILD DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            make \
            patch \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ============================================================
      # 3. INSTALL LLVM 22.1.8
      # ============================================================
      - name: Install LLVM 22.1.8
        run: |
          set -e

          TOOLCHAIN_DIR="$HOME/toolchains"

          mkdir -p "$TOOLCHAIN_DIR"

          cd "$TOOLCHAIN_DIR"

          wget -q --show-progress \
            https://www.kernel.org/pub/tools/llvm/files/llvm-22.1.8-x86_64.tar.xz

          tar -xf llvm-22.1.8-x86_64.tar.xz

          LLVM_DIR="$(find "$TOOLCHAIN_DIR" \
            -maxdepth 1 \
            -type d \
            -name 'llvm-22.1.8*' \
            | head -n 1)"

          if [ -z "$LLVM_DIR" ]; then
            echo "ERROR: LLVM directory not found."
            exit 1
          fi

          if [ ! -x "$LLVM_DIR/bin/clang" ]; then
            echo "ERROR: clang not found."
            find "$LLVM_DIR" -maxdepth 2 -type f | head -n 100
            exit 1
          fi

          echo "LLVM_DIR=$LLVM_DIR" >> "$GITHUB_ENV"
          echo "$LLVM_DIR/bin" >> "$GITHUB_PATH"

          echo "=========================================="
          echo "LLVM"
          echo "=========================================="

          clang --version
          ld.lld --version

      # ============================================================
      # 4. CONFIGURE LLVM
      # ============================================================
      - name: Configure LLVM environment
        run: |
          set -e

          echo "ARCH=arm64" >> "$GITHUB_ENV"
          echo "LLVM=1" >> "$GITHUB_ENV"
          echo "LLVM_IAS=1" >> "$GITHUB_ENV"

          echo "HOSTCC=gcc" >> "$GITHUB_ENV"
          echo "HOSTCXX=g++" >> "$GITHUB_ENV"

          echo "LLVM environment ready."

      # ============================================================
      # 5. SHOW KERNEL SOURCE
      # ============================================================
      - name: Show source information
        run: |
          echo "=========================================="
          echo "MARBLE KERNEL"
          echo "=========================================="

          echo ""
          echo "Commit:"
          git log -1 --oneline

          echo ""
          echo "Remote:"
          git remote -v

          echo ""
          echo "Compiler:"
          clang --version

      # ============================================================
      # 6. CREATE MARBLE DEFCONFIG
      # ============================================================
      - name: Prepare marble defconfig
        run: |
          set -e

          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            marble_defconfig

          test -f out/.config

          echo "Marble defconfig created."

      # ============================================================
      # 7. CLONE BAKASU
      # ============================================================
      - name: Clone BakaSU
        run: |
          set -e

          git clone \
            --depth=1 \
            https://github.com/Baka-SU/BakaSU.git \
            bakasu

          echo "=========================================="
          echo "BAKASU"
          echo "=========================================="

          cd bakasu

          git log -1 --oneline

          test -f kernel/Kconfig
          test -f kernel/Makefile

      # ============================================================
      # 8. INTEGRATE BAKASU
      # ============================================================
      - name: Integrate BakaSU
        run: |
          set -e

          rm -rf KernelSU

          mkdir -p KernelSU

          cp -a bakasu/kernel/. KernelSU/

          test -f KernelSU/Kconfig
          test -f KernelSU/Makefile

          echo "BakaSU kernel source integrated."

      # ============================================================
      # 9. CONNECT KERNELSU
      # ============================================================
      - name: Connect KernelSU Kconfig
        run: |
          set -e

          if grep -q 'source "KernelSU/Kconfig"' Kconfig; then
            echo "KernelSU already connected."
          else
            echo "" >> Kconfig
            echo 'source "KernelSU/Kconfig"' >> Kconfig
          fi

          grep -n 'KernelSU/Kconfig' Kconfig

      # ============================================================
      # 10. ENABLE KSU
      # ============================================================
      - name: Enable KernelSU
        run: |
          set -e

          CONFIG="out/.config"

          if grep -q '^CONFIG_KSU=' "$CONFIG"; then
            sed -i 's/^CONFIG_KSU=.*/CONFIG_KSU=y/' "$CONFIG"
          else
            echo "CONFIG_KSU=y" >> "$CONFIG"
          fi

      # ============================================================
      # 11. CLONE SUSFS
      #
      # Kernel 5.10 -> gki-android12-5.10
      # ============================================================
      - name: Clone SUSFS
        run: |
          set -e

          git clone \
            --depth=1 \
            --branch gki-android12-5.10 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            susfs

          echo "=========================================="
          echo "SUSFS"
          echo "=========================================="

          cd susfs

          git log -1 --oneline

          echo ""
          echo "SUSFS patch files:"

          find kernel_patches \
            -maxdepth 3 \
            -type f \
            | sort

      # ============================================================
      # 12. DETECT SUSFS KERNEL PATCH
      # ============================================================
      - name: Locate SUSFS kernel patch
        run: |
          set -e

          echo "Searching SUSFS kernel patch..."

          PATCH_FILE="$(find susfs/kernel_patches \
            -type f \
            -name '50_add_susfs_in_kernel-5.10*.patch' \
            | head -n 1)"

          if [ -z "$PATCH_FILE" ]; then
            echo "ERROR: SUSFS 5.10 kernel patch not found."

            find susfs/kernel_patches \
              -type f \
              | sort

            exit 1
          fi

          echo "SUSFS_PATCH=$PATCH_FILE" >> "$GITHUB_ENV"

          echo ""
          echo "Selected patch:"
          echo "$PATCH_FILE"

      # ============================================================
      # 13. COPY SUSFS FILES
      # ============================================================
      - name: Copy SUSFS kernel files
        run: |
          set -e

          echo "Copying SUSFS kernel files..."

          # SUSFS implementation
          cp -av \
            susfs/kernel_patches/fs/* \
            fs/

          # SUSFS headers
          cp -av \
            susfs/kernel_patches/include/linux/* \
            include/linux/

          echo ""
          echo "Checking SUSFS files..."

          find fs \
            -maxdepth 1 \
            -type f \
            -iname '*sus*' \
            -print

          find include/linux \
            -maxdepth 1 \
            -type f \
            -iname '*sus*' \
            -print

      # ============================================================
      # 14. APPLY SUSFS KERNELSU PATCH
      # ============================================================
      - name: Apply SUSFS KernelSU patch
        run: |
          set -e

          PATCH_KSU="susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

          if [ ! -f "$PATCH_KSU" ]; then
            echo "ERROR: KernelSU SUSFS patch not found."
            exit 1
          fi

          echo "Applying:"
          echo "$PATCH_KSU"

          cd KernelSU

          patch \
            --forward \
            -p1 \
            < "../$PATCH_KSU" \
            2>&1 | tee ../susfs-ksu-patch.log

          cd ..

          echo "KernelSU SUSFS patch step completed."

      # ============================================================
      # 15. APPLY SUSFS KERNEL PATCH
      # ============================================================
      - name: Apply SUSFS kernel patch
        run: |
          set -e

          if [ -z "$SUSFS_PATCH" ]; then
            echo "ERROR: SUSFS_PATCH is empty."
            exit 1
          fi

          echo "Applying:"
          echo "$SUSFS_PATCH"

          patch \
            --forward \
            -p1 \
            < "$SUSFS_PATCH" \
            2>&1 | tee susfs-kernel-patch.log

          echo "SUSFS kernel patch step completed."

      # ============================================================
      # 16. VERIFY SUSFS SOURCE
      # ============================================================
      - name: Verify SUSFS source
        run: |
          set -e

          echo "=========================================="
          echo "VERIFY SUSFS SOURCE"
          echo "=========================================="

          echo ""
          echo "susfs.c:"
          test -f fs/susfs.c
          ls -lh fs/susfs.c

          echo ""
          echo "susfs headers:"
          find include/linux \
            -maxdepth 1 \
            -type f \
            -iname 'susfs*.h' \
            -print

          echo ""
          echo "SUSFS references:"
          grep -R \
            "CONFIG_KSU_SUSFS" \
            -n KernelSU \
            fs \
            include/linux \
            2>/dev/null \
            | head -n 50 \
            || true

      # ============================================================
      # 17. REGENERATE CONFIG
      # ============================================================
      - name: Regenerate configuration
        run: |
          set -e

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          echo ""
          echo "=========================================="
          echo "SUSFS CONFIGURATION"
          echo "=========================================="

          grep -E \
            '^CONFIG_KSU|^CONFIG_KSU_SUSFS' \
            out/.config \
            || true

      # ============================================================
      # 18. FORCE REQUIRED SUSFS OPTIONS
      #
      # Only after source + Kconfig exist.
      # ============================================================
      - name: Enable SUSFS configuration
        run: |
          set -e

          CONFIG="out/.config"

          echo "Enabling SUSFS..."

          scripts/config \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_SUSFS

          # Do NOT enable SUS_SU blindly when another KSU hook
          # implementation is already present.
          scripts/config \
            --disable CONFIG_KSU_SUSFS_SUS_SU \
            || true

          # Magic mount support
          scripts/config \
            --enable CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT \
            || true

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          echo ""
          echo "Final SUSFS config:"

          grep -E \
            '^CONFIG_KSU=|^CONFIG_KSU_SUSFS=|^CONFIG_KSU_SUSFS_' \
            out/.config \
            || true

      # ============================================================
      # 19. HARD VALIDATION
      # ============================================================
      - name: Validate SUSFS configuration
        run: |
          set -e

          echo "Checking CONFIG_KSU..."

          grep -q '^CONFIG_KSU=y' out/.config

          echo "Checking CONFIG_KSU_SUSFS..."

          grep -q '^CONFIG_KSU_SUSFS=y' out/.config

          echo ""
          echo "=========================================="
          echo "SUSFS CONFIGURATION VALID"
          echo "=========================================="

      # ============================================================
      # 20. BUILD
      # ============================================================
      - name: Build kernel
        run: |
          set -o pipefail

          echo "=========================================="
          echo "BUILDING BAKASU + SUSFS"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"$(nproc)" \
            Image.gz \
            dtbs \
            2>&1 | tee build.log

      # ============================================================
      # 21. VERIFY IMAGE
      # ============================================================
      - name: Verify kernel image
        run: |
          set -e

          echo "=========================================="
          echo "VERIFY KERNEL"
          echo "=========================================="

          test -f out/arch/arm64/boot/Image

          echo ""
          echo "Image:"
          ls -lh out/arch/arm64/boot/Image

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            echo ""
            echo "Image.gz:"
            ls -lh out/arch/arm64/boot/Image.gz
          fi

      # ============================================================
      # 22. VERIFY FINAL CONFIG
      # ============================================================
      - name: Verify final configuration
        run: |
          echo "=========================================="
          echo "FINAL KERNEL CONFIG"
          echo "=========================================="

          grep -E \
            '^CONFIG_KSU=|^CONFIG_KSU_SUSFS=|^CONFIG_KSU_SUSFS_' \
            out/.config \
            || true

      # ============================================================
      # 23. COLLECT ARTIFACTS
      # ============================================================
      - name: Collect artifacts
        run: |
          set -e

          rm -rf artifacts
          mkdir -p artifacts

          cp \
            out/arch/arm64/boot/Image \
            artifacts/Image

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp \
              out/arch/arm64/boot/Image.gz \
              artifacts/Image.gz
          fi

          cp \
            out/.config \
            artifacts/kernel.config

          cp \
            build.log \
            artifacts/build.log

          cp \
            susfs-ksu-patch.log \
            artifacts/susfs-ksu-patch.log \
            || true

          cp \
            susfs-kernel-patch.log \
            artifacts/susfs-kernel-patch.log \
            || true

          echo ""
          echo "Collecting DTB/DTBO..."

          find out/arch/arm64/boot \
            -type f \
            \( \
              -name "*.dtb" \
              -o -name "*.dtbo" \
            \) \
            -exec cp {} artifacts/ \; \
            || true

          echo ""
          echo "Artifacts:"
          ls -lh artifacts

      # ============================================================
      # 24. SHA256
      # ============================================================
      - name: Generate SHA256
        run: |
          set -e

          cd artifacts

          sha256sum * \
            | tee SHA256SUMS.txt

      # ============================================================
      # 25. UPLOAD RESULT
      # ============================================================
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: POCO-F5-Marble-BakaSU-SUSFS-Kernel
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # 26. UPLOAD LOGS
      # ============================================================
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: POCO-F5-Marble-BakaSU-SUSFS-Logs
          path: |
            build.log
            susfs-ksu-patch.log
            susfs-kernel-patch.log
            out/.config
          if-no-files-found: warn
          retention-days: 7
