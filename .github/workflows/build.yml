name: Build Marble Kernel (BakaSU + SuSFS Fixed)

on:
  workflow_dispatch:
    inputs:
      ksu_version_override:
        description: 'Override Versi BakaSU (auto = 35252)'
        required: false
        default: 'auto'
        type: string
      enable_susfs:
        description: 'Integrasikan Patch SuSFS'
        required: true
        default: true
        type: boolean
      security_level:
        description: 'Level Keamanan'
        required: true
        default: 'standard_secure'
        type: choice
        options:
          - standard_secure
          - maximum_stealth
      tcp_profile:
        description: 'Optimasi TCP BBR'
        required: true
        default: 'bbr_plus_tuned'
        type: choice
        options:
          - bbr_plus_tuned
          - bbr_stock
      kernel_branch:
        description: 'Branch Source Kernel Pzqqt'
        required: true
        default: 'melt-rebase'
        type: choice
        options:
          - melt-rebase
          - bouquet

permissions:
  contents: read

env:
  KERNEL_REPO: "https://github.com/Pzqqt/android_kernel_xiaomi_marble.git"
  AK3_REPO: "https://github.com/osm0sis/AnyKernel3.git"
  SUSFS_REPO: "https://gitlab.com/simonpunk/susfs4ksu.git"
  SUSFS_BRANCH: "gki-android12-5.10"
  CLANG_URL: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r536225.tar.gz"
  ARCH: "arm64"
  SUBARCH: "arm64"

jobs:
  build-marble-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Maksimalkan Ruang Disk Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Install Dependensi Kompilasi
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache cpio curl flex git git-lfs \
            libelf-dev libncurses5-dev libssl-dev lld llvm lz4 pahole \
            python3 python3-pip rsync unzip wget xz-utils zip zstd \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu

      - name: Setup Toolchain Clang
        run: |
          mkdir -p "$HOME/toolchains/clang"
          CLANG_INSTALLED=false

          # ── source 1: googlesource (official, sering flaky) ──────────────────
          echo ">>> Mencoba googlesource..."
          if wget -q --timeout=120 --tries=2 -O clang.tar.gz "${{ env.CLANG_URL }}" 2>/dev/null; then
            if tar -xzf clang.tar.gz -C "$HOME/toolchains/clang" 2>/dev/null; then
              echo ">>> Clang dari googlesource OK"
              CLANG_INSTALLED=true
            fi
          fi
          rm -f clang.tar.gz

          # ── source 2: ZyCromerZ GitHub release (reliable mirror) ─────────────
          if [ "$CLANG_INSTALLED" = "false" ]; then
            echo ">>> googlesource gagal, mencoba ZyCromerZ clang-18..."
            ZYC_URL="https://github.com/ZyCromerZ/Clang/releases/download/18.0.0git-20240302-release/Clang-18.0.0git-20240302.tar.gz"
            if wget -q --timeout=180 --tries=2 -O clang.tar.gz "$ZYC_URL" 2>/dev/null; then
              if tar -xzf clang.tar.gz -C "$HOME/toolchains/clang" 2>/dev/null; then
                echo ">>> Clang dari ZyCromerZ OK"
                CLANG_INSTALLED=true
              fi
            fi
            rm -f clang.tar.gz
          fi

          # ── source 3: apt LLVM-17 (fallback pasti berhasil) ──────────────────
          if [ "$CLANG_INSTALLED" = "false" ]; then
            echo ">>> Semua download gagal, fallback ke apt LLVM-17..."
            wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
              | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
            echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-17 main" \
              | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
            sudo apt-get update -qq
            sudo apt-get install -y clang-17 lld-17 llvm-17
            mkdir -p "$HOME/toolchains/clang/bin"
            for tool in clang clang++ ld.lld llvm-ar llvm-nm \
                        llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
              if command -v "${tool}-17" >/dev/null 2>&1; then
                ln -sf "$(command -v ${tool}-17)" "$HOME/toolchains/clang/bin/${tool}"
              fi
            done
            # clang juga perlu alias tanpa suffix untuk CC=
            ln -sf "$(command -v clang-17)" "$HOME/toolchains/clang/bin/clang" 2>/dev/null || true
            echo ">>> apt LLVM-17 OK"
            CLANG_INSTALLED=true
          fi

          if [ "$CLANG_INSTALLED" = "false" ]; then
            echo "ERROR: semua sumber clang gagal"
            exit 1
          fi

          echo "$HOME/toolchains/clang/bin" >> $GITHUB_PATH
          clang --version || "$HOME/toolchains/clang/bin/clang" --version || true

      - name: Clone Source Kernel Pzqqt
        run: |
          git clone --depth=1 -b "${{ github.event.inputs.kernel_branch }}" "${{ env.KERNEL_REPO }}" kernel
          cd kernel
          git config user.name "build-user"
          git config user.email "build-user@android"

      - name: Siapkan Repo SuSFS
        if: ${{ github.event.inputs.enable_susfs == 'true' }}
        run: |
          git clone --depth=1 -b "${{ env.SUSFS_BRANCH }}" "${{ env.SUSFS_REPO }}" susfs4ksu
          echo ">>> SuSFS repo siap"

      - name: Integrasi BakaSU
        run: |
          cd kernel
          rm -rf KernelSU drivers/kernelsu
          sed -i '/kernelsu/d' drivers/Makefile || true
          sed -i '/kernelsu/d' drivers/Kconfig || true
          git add -A && git commit -m "clean-pre-root" || true

          echo ">>> Mengintegrasikan BakaSU..."
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -s main || \
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash

          if [ ! -d "KernelSU" ] && [ ! -d "drivers/kernelsu" ]; then
            echo "ERROR: BakaSU gagal diintegrasikan"
            exit 1
          fi

          if [ -d "KernelSU" ]; then
            cd KernelSU
            git config user.name "build-user"
            git config user.email "build-user@android"
            git fetch --all --tags || true
            LATEST_REF=$(git for-each-ref --sort=-committerdate --format='%(refname:short)' refs/remotes/origin/ | head -n 1)
            if [ -n "$LATEST_REF" ]; then
              git checkout -f "$LATEST_REF"
            fi
            cd ..
          fi

          git add -A && git commit -m "bakasu-integrated" || true

      - name: Sinkronisasi Versi BakaSU
        run: |
          cd kernel
          TARGET_VER="${{ github.event.inputs.ksu_version_override }}"
          if [ "$TARGET_VER" = "auto" ] || [ -z "$TARGET_VER" ]; then
            TARGET_VER="35252"
          fi
          echo ">>> Target versi: $TARGET_VER"
          for kdir in KernelSU drivers/kernelsu; do
            if [ -d "$kdir" ]; then
              cd "$kdir"
              git config user.name "build-user" || true
              git config user.email "build-user@android" || true
              find . -maxdepth 3 \( -name "Makefile" -o -name "Kbuild" -o -name "*.mk" \) | while read -r mf; do
                sed -i "s/KSU_VERSION := .*/KSU_VERSION := ${TARGET_VER}/g" "$mf" || true
                sed -i "s/^VERSION = .*/VERSION = ${TARGET_VER}/g" "$mf" || true
                sed -i 's/-dirty//g' "$mf" || true
              done
              git add -A && git commit -m "version-sync-${TARGET_VER}" || true
              cd - >/dev/null
            fi
          done
          git add -A && git commit -m "clean-version" || true

      - name: Integrasi SuSFS
        if: ${{ github.event.inputs.enable_susfs == 'true' }}
        run: |
          cd kernel
          SUSFS_OK="false"
          if [ -d "../susfs4ksu" ]; then
            cp -rv ../susfs4ksu/kernel_patches/fs/* fs/ || true
            cp -rv ../susfs4ksu/kernel_patches/include/linux/* include/linux/ || true
            PATCH_FILE="../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch"
            if [ ! -f "$PATCH_FILE" ]; then
              echo "ERROR: File patch tidak ditemukan"
            else
              if patch -p1 --dry-run < "$PATCH_FILE" >/dev/null 2>&1; then
                patch -p1 --forward < "$PATCH_FILE"
                SUSFS_OK="true"
                echo ">>> SUSFS: clean apply berhasil"
              elif patch -p1 --dry-run --fuzz=1 < "$PATCH_FILE" >/dev/null 2>&1; then
                patch -p1 --forward --fuzz=1 < "$PATCH_FILE"
                SUSFS_OK="true"
                echo ">>> SUSFS: fuzz=1 berhasil"
              elif git apply --3way --check "$PATCH_FILE" >/dev/null 2>&1; then
                git apply --3way "$PATCH_FILE"
                SUSFS_OK="true"
                echo ">>> SUSFS: 3way berhasil"
              else
                echo ">>> SUSFS: semua attempt gagal"
                rm -f fs/susfs.c fs/sus_su.c include/linux/susfs.h include/linux/susfs_def.h
                SUSFS_OK="false"
              fi
            fi
            if [ "$SUSFS_OK" = "true" ]; then
              find KernelSU drivers/kernelsu -name "*.mk" -o -name "Makefile" -o -name "Kbuild" 2>/dev/null | while read -r mkfile; do
                sed -i 's/\$(error /\$(warning /g' "$mkfile" || true
              done
              git add -A && git commit -m "susfs-applied" || true
            fi
          fi
          echo "SUSFS_APPLIED=$SUSFS_OK" >> $GITHUB_ENV

      - name: Bersihkan Extern Declarations Problematic
        run: |
          cd kernel

          # ── Python surgical patcher v3 untuk fs/exec.c ──────────────────────
          python3 - << 'PYEOF'
          import re, os

          # fungsi target dan return type-nya
          KSU_FUNCS = {
              "ksu_setup_preinit_file":           "void",
              "ksu_preinit_handle_post_execveat": "int",
          }

          BAD_MARKERS = [
              "Safe weak stubs for execveat preinit",
              "True SELinux passthrough bridges",
              "execveat preinit",
              "KSU forward declarations (auto-generated)",
          ]

          SELINUX_FILES = [
              "security/selinux/hooks.c",
              "security/selinux/selinuxfs.c",
          ]

          # ── cari signature asli dari tree (.c dan .h) ────────────────────────
          def find_real_signature(func_name):
              """
              Cari definisi atau deklarasi fungsi di seluruh tree.
              Return (return_type_str, args_str, filepath) atau None.
              Prioritas: .h declaration > .c definition
              """
              # pattern untuk definisi di .c:
              # contoh: void ksu_setup_preinit_file(struct file *f, struct linux_binprm *b)
              def_re = re.compile(
                  r'(?:^|\n)[ \t]*(?:static\s+)?(?:inline\s+)?(?:__\w+\s+)*'
                  r'(void|int|long|bool|unsigned\s+\w+|unsigned)\s*\*?\s*'
                  + re.escape(func_name) +
                  r'\s*\(([^)]+)\)\s*(?:\{|$)',
                  re.MULTILINE
              )
              # pattern untuk extern di .h:
              decl_re = re.compile(
                  r'extern\s+(void|int|long|bool|unsigned\s+\w+|unsigned)\s*\*?\s*'
                  + re.escape(func_name) +
                  r'\s*\(([^;)]+)\)\s*;',
                  re.MULTILINE
              )

              best_def  = None
              best_decl = None

              for root, dirs, files in os.walk('.'):
                  dirs[:] = [d for d in dirs if d not in ['.git', 'out']]
                  for fname in files:
                      ext = os.path.splitext(fname)[1]
                      if ext not in ('.c', '.h'):
                          continue
                      fpath = os.path.join(root, fname)
                      # skip exec.c itself
                      if os.path.abspath(fpath) == os.path.abspath('fs/exec.c'):
                          continue
                      try:
                          with open(fpath, 'r', encoding='utf-8', errors='ignore') as f:
                              src = f.read()
                      except Exception:
                          continue

                      if ext == '.h' and best_decl is None:
                          m = decl_re.search(src)
                          if m:
                              best_decl = (m.group(1).strip(), m.group(2).strip(), fpath)

                      if ext == '.c' and best_def is None:
                          m = def_re.search(src)
                          if m:
                              # jangan ambil kalau ada 'extern' sebelumnya di baris yang sama
                              line_start = src.rfind('\n', 0, m.start()) + 1
                              prefix = src[line_start:m.start()]
                              if 'extern' not in prefix:
                                  best_def = (m.group(1).strip(), m.group(2).strip(), fpath)

                      if best_def and best_decl:
                          break
                  if best_def and best_decl:
                      break

              # prefer header declaration (lebih precise), fallback ke definition
              return best_decl or best_def

          # ── bersihkan exec.c ─────────────────────────────────────────────────
          exec_path = 'fs/exec.c'
          if not os.path.isfile(exec_path):
              print(">>> fs/exec.c tidak ditemukan, skip")
              exit(0)

          with open(exec_path, 'r', encoding='utf-8', errors='replace') as f:
              raw = f.read()

          lines = raw.splitlines(keepends=True)
          out   = []
          i     = 0
          while i < len(lines):
              line = lines[i]

              # hapus baris marker buruk
              if any(m in line for m in BAD_MARKERS):
                  i += 1
                  continue

              # hapus __attribute__((weak)) / __weak stub untuk ksu_
              if re.search(r'(__attribute__\s*\(\s*\(weak\)\s*\)|__weak)\s[\w\s\*]*ksu_', line):
                  # kalau ini pembuka block {, skip sampai tutup }
                  if '{' in line:
                      depth = line.count('{') - line.count('}')
                      i += 1
                      while i < len(lines) and depth > 0:
                          depth += lines[i].count('{') - lines[i].count('}')
                          i += 1
                  else:
                      i += 1
                  continue

              # hapus extern / static ksu_ target (termasuk multi-line)
              is_bad = False
              for fn in KSU_FUNCS:
                  if fn in line and re.search(r'\b(extern|static)\b', line):
                      is_bad = True
                      break
              if is_bad:
                  if ';' in line or ('{' in line and '}' in line):
                      i += 1
                  elif '{' in line:
                      # skip sampai tutup block
                      depth = line.count('{') - line.count('}')
                      i += 1
                      while i < len(lines) and depth > 0:
                          depth += lines[i].count('{') - lines[i].count('}')
                          i += 1
                  else:
                      # deklarasi yang tidak ada ; di baris ini, skip sampai ;
                      i += 1
                      while i < len(lines) and ';' not in lines[i]:
                          i += 1
                      i += 1  # skip baris ;
                  continue

              out.append(line)
              i += 1

          content = ''.join(out)

          # buang blok auto-generated dari run sebelumnya kalau masih tersisa
          content = re.sub(
              r'\n/\* KSU forward declarations \(auto-generated\) \*/\n.*?(?=\n#|\nstatic|\nextern|\nvoid|\nint|\n\n)',
              '\n', content, flags=re.DOTALL
          )

          # ── inject extern yang benar ─────────────────────────────────────────
          injections = []
          for fn, ret_default in KSU_FUNCS.items():
              if not re.search(r'\b' + fn + r'\s*\(', content):
                  print(f">>> {fn}: tidak dipanggil di exec.c, skip")
                  continue

              found = find_real_signature(fn)
              if found:
                  ret, args, src_path = found
                  decl = f"extern {ret} {fn}({args});\n"
                  print(f">>> {fn}: signature dari {src_path} → {decl.strip()}")
              else:
                  # fallback: old-style C declaration tanpa prototype
                  # compiler tidak cek jumlah/tipe argumen → aman untuk call site apapun
                  decl = f"extern {ret_default} {fn}();\n"
                  print(f">>> {fn}: tidak ditemukan di tree, pakai old-style extern")

              injections.append(decl)

          if injections:
              # sisipkan setelah #include terakhir
              lines2     = content.split('\n')
              last_inc   = -1
              for idx, l in enumerate(lines2):
                  if l.strip().startswith('#include'):
                      last_inc = idx
              if last_inc >= 0:
                  block = '\n/* KSU forward declarations (auto-generated) */\n' + ''.join(injections)
                  lines2.insert(last_inc + 1, block)
                  content = '\n'.join(lines2)

          with open(exec_path, 'w', encoding='utf-8') as f:
              f.write(content)
          print(">>> fs/exec.c: surgical patch v3 selesai")

          # ── bersihkan selinux files ──────────────────────────────────────────
          for sf in SELINUX_FILES:
              if not os.path.isfile(sf):
                  continue
              with open(sf, 'r', encoding='utf-8', errors='replace') as f:
                  src = f.read()
              for m in BAD_MARKERS:
                  src = re.sub(r'/\*[^*]*' + re.escape(m) + r'[^*]*\*/', '', src)
              src = re.sub(
                  r'__attribute__\s*\(\s*\(weak\)\s*\)\s[\w\s\*]*ksu_[^\n]*\n', '', src
              )
              with open(sf, 'w', encoding='utf-8') as f:
                  f.write(src)
              print(f">>> {sf}: cleaned")
          PYEOF

          git add -A && git commit -m "clean-externs-surgical" || true

      - name: Patch BBR TCP
        run: |
          cd kernel
          if [ "${{ github.event.inputs.tcp_profile }}" = "bbr_plus_tuned" ] && [ -f "net/ipv4/tcp_bbr.c" ]; then
            sed -i 's/static const u32 bbr_min_rtt_win_sec = 10;/static const u32 bbr_min_rtt_win_sec = 5;/g' net/ipv4/tcp_bbr.c || true
            sed -i 's/static const u32 bbr_probe_rtt_mode_ms = 200;/static const u32 bbr_probe_rtt_mode_ms = 100;/g' net/ipv4/tcp_bbr.c || true
            echo ">>> BBR tuning applied"
          fi
          git add -A && git commit -m "bbr-tuned" || true

      - name: Konfigurasi Defconfig
        run: |
          cd kernel
          if [ -f "arch/arm64/configs/marble_defconfig" ]; then
            DEFCONFIG_NAME="marble_defconfig"
            DEFCONFIG_FILE="arch/arm64/configs/marble_defconfig"
          elif [ -f "arch/arm64/configs/vendor/marble_defconfig" ]; then
            DEFCONFIG_NAME="vendor/marble_defconfig"
            DEFCONFIG_FILE="arch/arm64/configs/vendor/marble_defconfig"
          else
            DEFCONFIG_NAME="gki_defconfig"
            DEFCONFIG_FILE="arch/arm64/configs/gki_defconfig"
          fi
          echo "TARGET_DEFCONFIG=$DEFCONFIG_NAME" >> $GITHUB_ENV
          echo ">>> Defconfig: $DEFCONFIG_NAME"

          python3 - "$DEFCONFIG_FILE" "${{ env.SUSFS_APPLIED }}" "${{ github.event.inputs.security_level }}" << 'PYEOF'
          import sys
          defconfig = sys.argv[1]
          susfs_applied = sys.argv[2]
          security_level = sys.argv[3]

          base_configs = [
              "CONFIG_WERROR=n",
              "CONFIG_KSU=y",
              "CONFIG_KPROBES=y",
              "CONFIG_HAVE_KPROBES=y",
              "CONFIG_KPROBE_EVENTS=y",
              "CONFIG_TCP_CONG_ADVANCED=y",
              "CONFIG_TCP_CONG_BBR=y",
              "CONFIG_DEFAULT_BBR=y",
              'CONFIG_DEFAULT_TCP_CONG="bbr"',
              "CONFIG_NET_SCH_FQ=y",
              "CONFIG_SYN_COOKIES=y",
              "CONFIG_SECURITY_DMESG_RESTRICT=y",
              "CONFIG_SECURITY_NETWORK=y",
              "CONFIG_SECURITY_SELINUX=y",
              "CONFIG_BPF_JIT_ALWAYS_ON=y",
          ]

          susfs_configs = [
              "CONFIG_KSU_SUSFS=y",
              "CONFIG_KSU_SUSFS_SUS_PATH=y",
              "CONFIG_KSU_SUSFS_SUS_MOUNT=y",
              "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y",
              "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y",
              "CONFIG_KSU_SUSFS_SUS_KSTAT=y",
              "CONFIG_KSU_SUSFS_TRY_UMOUNT=y",
              "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y",
              "CONFIG_KSU_SUSFS_SPOOF_UNAME=y",
              "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y",
              "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y",
              "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y",
              "CONFIG_KSU_SUSFS_SUS_SU=n",
          ]

          with open(defconfig, "a", encoding="utf-8") as f:
              f.write("\n")
              for c in base_configs:
                  f.write(c + "\n")
              if susfs_applied == "true":
                  for c in susfs_configs:
                      f.write(c + "\n")
                  if security_level == "maximum_stealth":
                      f.write("CONFIG_KSU_SUSFS_ENABLE_LOG=n\n")
                  else:
                      f.write("CONFIG_KSU_SUSFS_ENABLE_LOG=y\n")
              else:
                  f.write("CONFIG_KSU_SUSFS=n\n")

          print(">>> Defconfig updated OK")
          PYEOF

          git add -A && git commit -m "defconfig-ready" || true

      - name: Kompilasi Kernel
        run: |
          cd kernel
          export KBUILD_BUILD_USER="build-user"
          export KBUILD_BUILD_HOST="build-host"

          make O=out ARCH=arm64 \
            CC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            "${{ env.TARGET_DEFCONFIG }}"

          if [ -f "arch/arm64/configs/vendor/marble_GKI.config" ] && [ "${{ env.TARGET_DEFCONFIG }}" = "gki_defconfig" ]; then
            ./scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/marble_GKI.config
          fi

          ./scripts/config --file out/.config \
            -d WERROR \
            -d CONFIG_WERROR \
            -d KSU_SUSFS_SUS_SU \
            -d LOCALVERSION_AUTO \
            --set-val FRAME_WARN 4096

          make O=out ARCH=arm64 CC="ccache clang" LLVM=1 LLVM_IAS=1 olddefconfig

          set +e
          make -j$(nproc --all) \
            O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-unused-function -Wno-strict-prototypes -Wno-out-of-line-declaration -Wno-incompatible-pointer-types" \
            Image Image.gz 2>&1 | tee build_full.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ $BUILD_STATUS -ne 0 ]; then
            echo ">>> BUILD GAGAL"
            grep -E "error:|fatal error:|undefined reference|FAILED|\*\*\*.*Stop" build_full.log | tail -50 || true
            exit $BUILD_STATUS
          fi
          echo ">>> Build BERHASIL"

      - name: Paketkan ke AnyKernel3
        run: |
          git clone --depth=1 "${{ env.AK3_REPO }}" AnyKernel3
          cd AnyKernel3
          rm -rf .git README.md modules patch ramdisk

          python3 - << 'PYEOF'
          import os

          ak3 = (
              "### AnyKernel3 Ramdisk Mod Script\n"
              "## osm0sis @ xda-developers\n\n"
              "properties() { '\n"
              "kernel.string=Melt Kernel BakaSU POCO F5 (marble)\n"
              "do.devicecheck=0\n"
              "do.modules=0\n"
              "do.systemless=1\n"
              "do.cleanup=1\n"
              "do.cleanuponabort=0\n"
              "device.name1=marble\n"
              "device.name2=marblein\n"
              "supported.versions=\n"
              "supported.patchlevels=\n"
              "supported.vendorpatchlevels=\n"
              "'; } # end properties\n\n"
              "### AnyKernel install\n"
              "BLOCK=boot;\n"
              "IS_SLOT_DEVICE=1;\n"
              "RAMDISK_COMPRESSION=auto;\n"
              "PATCH_VBMETA_FLAG=auto;\n\n"
              "block=boot;\n"
              "is_slot_device=1;\n"
              "ramdisk_compression=auto;\n"
              "patch_vbmeta_flag=auto;\n\n"
              "## AnyKernel methods (DO NOT CHANGE)\n"
              ". tools/ak3-core.sh;\n\n"
              "## AnyKernel boot install\n"
              "split_boot;\n"
              "flash_boot;\n"
              "## end boot install\n"
          )

          sec = "\n".join([
              "#!/system/bin/sh",
              "while [ \"$(getprop sys.boot_completed)\" != \"1\" ]; do sleep 3; done",
              "echo 2 > /proc/sys/kernel/kptr_restrict 2>/dev/null",
              "echo 1 > /proc/sys/kernel/dmesg_restrict 2>/dev/null",
              "echo 3 > /proc/sys/kernel/perf_event_paranoid 2>/dev/null",
              "echo 1 > /proc/sys/kernel/unprivileged_bpf_disabled 2>/dev/null",
              "echo 2 > /proc/sys/kernel/randomize_va_space 2>/dev/null",
              "echo 1 > /proc/sys/fs/protected_hardlinks 2>/dev/null",
              "echo 1 > /proc/sys/fs/protected_symlinks 2>/dev/null",
              "echo 0 > /proc/sys/kernel/sysrq 2>/dev/null",
              "echo 1 > /proc/sys/net/ipv4/tcp_syncookies 2>/dev/null",
              "echo 1 > /proc/sys/net/ipv4/tcp_rfc1337 2>/dev/null",
              "echo 0 > /proc/sys/net/ipv4/tcp_timestamps 2>/dev/null",
              "echo 1 > /proc/sys/net/ipv4/conf/all/rp_filter 2>/dev/null",
              "echo 0 > /proc/sys/net/ipv4/conf/all/accept_redirects 2>/dev/null",
              "echo 0 > /proc/sys/net/ipv4/conf/all/send_redirects 2>/dev/null",
              "echo 0 > /proc/sys/net/ipv4/conf/all/accept_source_route 2>/dev/null",
              "echo 0 > /proc/sys/net/ipv6/conf/all/accept_redirects 2>/dev/null",
              "echo 1 > /proc/sys/net/ipv4/icmp_echo_ignore_broadcasts 2>/dev/null",
              "echo 1 > /proc/sys/net/ipv4/icmp_ignore_bogus_error_responses 2>/dev/null",
              "resetprop -n ro.boot.vbmeta.device_state locked",
              "resetprop -n ro.boot.verifiedbootstate green",
              "resetprop -n ro.boot.flash.locked 1",
              "resetprop -n ro.boot.veritymode enforcing",
              "resetprop -n ro.boot.warranty_bit 0",
              "resetprop -n ro.warranty_bit 0",
              "resetprop -n ro.debuggable 0",
              "resetprop -n ro.secure 1",
              "resetprop -n vendor.boot.vbmeta.device_state locked",
              "resetprop -n vendor.boot.verifiedbootstate green",
              "echo bbr > /proc/sys/net/ipv4/tcp_congestion_control 2>/dev/null",
              "echo fq > /proc/sys/net/core/default_qdisc 2>/dev/null",
              "echo 0 > /proc/sys/net/ipv4/tcp_slow_start_after_idle 2>/dev/null",
              "resetprop -n persist.vendor.radio.add_power_save 0",
              "resetprop -n persist.vendor.radio.apm_sim_not_pwdn 1",
              "resetprop -n persist.vendor.radio.sib16_support 1",
              "for gov in /sys/devices/system/cpu/cpufreq/policy*; do",
              "  echo 1000 > \"$gov/schedutil/up_rate_limit_us\" 2>/dev/null",
              "  echo 5000 > \"$gov/schedutil/down_rate_limit_us\" 2>/dev/null",
              "done",
              "",
          ])

          with open("anykernel.sh", "w", encoding="utf-8", newline="\n") as f:
              f.write(ak3)

          with open("marble_security_tune.sh", "w", encoding="utf-8", newline="\n") as f:
              f.write(sec)

          os.chmod("marble_security_tune.sh", 0o755)
          print(">>> Files created OK")
          PYEOF

          if [ -f "../kernel/out/arch/arm64/boot/Image" ]; then
            cp ../kernel/out/arch/arm64/boot/Image .
          elif [ -f "../kernel/out/arch/arm64/boot/Image.gz" ]; then
            cp ../kernel/out/arch/arm64/boot/Image.gz .
          else
            echo "ERROR: kernel image tidak ditemukan"
            exit 1
          fi

          BUILD_DATE=$(date +"%Y%m%d-%H%M")
          ZIP_NAME="Melt-Marble-BakaSU-SuSFS_${{ env.SUSFS_APPLIED }}-${BUILD_DATE}.zip"
          zip -r9 "../${ZIP_NAME}" * -x "*.git*"
          echo "ZIP_OUTPUT=${ZIP_NAME}" >> $GITHUB_ENV
          echo ">>> ZIP: ${ZIP_NAME}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Melt-Kernel-Marble-BakaSU-Fixed
          path: ${{ env.ZIP_OUTPUT }}
          retention-days: 14
