name: Build POCO F5 Marble BakaSU

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Marble Kernel
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT KERNEL
      # ============================================================
      - name: Checkout Marble Kernel
        uses: actions/checkout@v4
        with:
          repository: Pzqqt/android_kernel_xiaomi_marble
          ref: melt-rebase
          fetch-depth: 1

      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            make \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ============================================================
      # 3. INSTALL LLVM 22.1.8
      # ============================================================
      - name: Install LLVM 22.1.8
        run: |
          set -e

          TOOLCHAIN_DIR="$HOME/toolchains"

          mkdir -p "$TOOLCHAIN_DIR"

          cd "$TOOLCHAIN_DIR"

          echo "Downloading LLVM 22.1.8..."

          wget -q --show-progress \
            https://www.kernel.org/pub/tools/llvm/files/llvm-22.1.8-x86_64.tar.xz

          echo ""
          echo "Extracting LLVM..."

          tar -xf llvm-22.1.8-x86_64.tar.xz

          echo ""
          echo "Extracted directories:"
          find "$TOOLCHAIN_DIR" -maxdepth 1 -type d -print

          # Cari direktori LLVM hasil ekstraksi
          LLVM_DIR="$(find "$TOOLCHAIN_DIR" \
            -maxdepth 1 \
            -type d \
            -name 'llvm-22.1.8*' \
            | head -n 1)"

          if [ -z "$LLVM_DIR" ]; then
            echo "ERROR: LLVM directory tidak ditemukan."
            exit 1
          fi

          echo ""
          echo "LLVM directory:"
          echo "$LLVM_DIR"

          if [ ! -x "$LLVM_DIR/bin/clang" ]; then
            echo "ERROR: clang tidak ditemukan di:"
            echo "$LLVM_DIR/bin/clang"

            echo ""
            echo "Isi directory:"
            find "$LLVM_DIR" -maxdepth 2 -type f | head -n 100

            exit 1
          fi

          echo ""
          echo "LLVM clang ditemukan."

          echo "LLVM_DIR=$LLVM_DIR" >> "$GITHUB_ENV"
          echo "$LLVM_DIR/bin" >> "$GITHUB_PATH"

          echo ""
          echo "clang version:"
          "$LLVM_DIR/bin/clang" --version

          echo ""
          echo "ld.lld version:"
          "$LLVM_DIR/bin/ld.lld" --version

          echo ""
          echo "LLVM installation OK."

      # ============================================================
      # 4. CHECK TOOLCHAIN
      # ============================================================
      - name: Verify toolchain
        run: |
          set -e

          echo "=========================================="
          echo "TOOLCHAIN CHECK"
          echo "=========================================="

          echo ""
          echo "LLVM_DIR:"
          echo "$LLVM_DIR"

          echo ""
          echo "clang:"
          which clang
          clang --version

          echo ""
          echo "ld.lld:"
          which ld.lld
          ld.lld --version

          echo ""
          echo "llvm-ar:"
          which llvm-ar
          llvm-ar --version | head -n 1

          echo ""
          echo "LLVM TOOLCHAIN READY."

      # ============================================================
      # 5. KERNEL BUILD ENVIRONMENT
      # ============================================================
      - name: Configure build environment
        run: |
          set -e

          echo "ARCH=arm64" >> "$GITHUB_ENV"
          echo "LLVM=1" >> "$GITHUB_ENV"
          echo "LLVM_IAS=1" >> "$GITHUB_ENV"

          echo "HOSTCC=gcc" >> "$GITHUB_ENV"
          echo "HOSTCXX=g++" >> "$GITHUB_ENV"

          echo ""
          echo "Kernel build environment:"
          echo "ARCH=arm64"
          echo "LLVM=1"
          echo "LLVM_IAS=1"

      # ============================================================
      # 6. SHOW KERNEL INFORMATION
      # ============================================================
      - name: Show kernel information
        run: |
          echo "=========================================="
          echo "POCO F5 / MARBLE"
          echo "=========================================="

          echo ""
          echo "Repository:"
          git remote -v

          echo ""
          echo "Commit:"
          git log -1 --oneline

          echo ""
          echo "Branch:"
          git branch --show-current

          echo ""
          echo "Kernel Makefile:"
          head -n 15 Makefile

      # ============================================================
      # 7. CREATE MARBLE DEFCONFIG
      # ============================================================
      - name: Prepare marble defconfig
        run: |
          set -e

          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            marble_defconfig

          echo ""
          echo "=========================================="
          echo "MARBLE DEFCONFIG CREATED"
          echo "=========================================="

          test -f out/.config

          ls -lh out/.config

      # ============================================================
      # 8. CLONE BAKASU
      # ============================================================
      - name: Clone BakaSU
        run: |
          set -e

          git clone \
            --depth=1 \
            https://github.com/Baka-SU/BakaSU.git \
            bakasu

          echo ""
          echo "=========================================="
          echo "BAKASU SOURCE"
          echo "=========================================="

          cd bakasu

          git log -1 --oneline

          echo ""
          echo "Kernel directory:"
          ls -la kernel

      # ============================================================
      # 9. CHECK BAKASU KERNEL SOURCE
      # ============================================================
      - name: Check BakaSU kernel source
        run: |
          set -e

          if [ ! -d "bakasu/kernel" ]; then
            echo "ERROR: bakasu/kernel tidak ditemukan."
            exit 1
          fi

          if [ ! -f "bakasu/kernel/Kconfig" ]; then
            echo "ERROR: bakasu/kernel/Kconfig tidak ditemukan."
            exit 1
          fi

          if [ ! -f "bakasu/kernel/Makefile" ]; then
            echo "ERROR: bakasu/kernel/Makefile tidak ditemukan."
            exit 1
          fi

          echo "BakaSU kernel source:"
          echo "OK"

          echo ""
          echo "Kconfig:"
          head -n 30 bakasu/kernel/Kconfig

      # ============================================================
      # 10. INTEGRATE BAKASU
      # ============================================================
      - name: Integrate BakaSU
        run: |
          set -e

          rm -rf KernelSU

          mkdir -p KernelSU

          cp -a bakasu/kernel/. KernelSU/

          echo "BakaSU kernel source copied."

          test -f KernelSU/Kconfig
          test -f KernelSU/Makefile

          echo ""
          echo "KernelSU/Kconfig : OK"
          echo "KernelSU/Makefile: OK"

      # ============================================================
      # 11. CONNECT KERNELSU KCONFIG
      # ============================================================
      - name: Connect KernelSU Kconfig
        run: |
          set -e

          if grep -q 'source "KernelSU/Kconfig"' Kconfig; then
            echo "KernelSU Kconfig sudah terhubung."
          else
            echo "" >> Kconfig
            echo 'source "KernelSU/Kconfig"' >> Kconfig
            echo "KernelSU Kconfig ditambahkan."
          fi

          echo ""
          echo "KernelSU Kconfig entry:"
          grep -n 'KernelSU/Kconfig' Kconfig

      # ============================================================
      # 12. REGENERATE CONFIG
      # ============================================================
      - name: Regenerate kernel configuration
        run: |
          set -e

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          echo ""
          echo "Configuration regenerated."

      # ============================================================
      # 13. CHECK KSU CONFIG
      # ============================================================
      - name: Check KernelSU configuration
        run: |
          set -e

          echo "=========================================="
          echo "KSU CONFIG CHECK"
          echo "=========================================="

          grep -E \
            'CONFIG_KSU|CONFIG_KPROBES' \
            out/.config \
            || true

      # ============================================================
      # 14. BUILD KERNEL
      # ============================================================
      - name: Build kernel
        run: |
          set -o pipefail

          echo "=========================================="
          echo "START BUILD"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"$(nproc)" \
            Image.gz \
            dtbs \
            2>&1 | tee build.log

      # ============================================================
      # 15. VERIFY IMAGE
      # ============================================================
      - name: Verify kernel image
        run: |
          set -e

          echo "=========================================="
          echo "VERIFY BUILD"
          echo "=========================================="

          echo ""
          echo "Boot directory:"
          find out/arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            \( \
              -name "Image" \
              -o -name "Image.gz" \
              -o -name "*.dtb" \
              -o -name "*.dtbo" \
            \) \
            -print

          echo ""

          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "ERROR: Image tidak ditemukan."
            exit 1
          fi

          echo "Image:"
          ls -lh out/arch/arm64/boot/Image

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            echo ""
            echo "Image.gz:"
            ls -lh out/arch/arm64/boot/Image.gz
          fi

          echo ""
          echo "BUILD IMAGE OK."

      # ============================================================
      # 16. COLLECT ARTIFACTS
      # ============================================================
      - name: Collect artifacts
        run: |
          set -e

          rm -rf artifacts
          mkdir -p artifacts

          cp out/arch/arm64/boot/Image \
            artifacts/Image

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz \
              artifacts/Image.gz
          fi

          cp out/.config \
            artifacts/kernel.config

          cp build.log \
            artifacts/build.log

          echo ""
          echo "Collecting marble DTB/DTBO files..."

          find out/arch/arm64/boot \
            -type f \
            \( \
              -name "*.dtb" \
              -o -name "*.dtbo" \
            \) \
            -exec cp {} artifacts/ \; \
            || true

          echo ""
          echo "Artifacts:"
          ls -lh artifacts

      # ============================================================
      # 17. SHA256
      # ============================================================
      - name: Generate SHA256
        run: |
          set -e

          cd artifacts

          sha256sum * \
            | tee SHA256SUMS.txt

      # ============================================================
      # 18. UPLOAD KERNEL
      # ============================================================
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: POCO-F5-Marble-BakaSU-Kernel
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # 19. UPLOAD LOGS
      # ============================================================
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: POCO-F5-Marble-BakaSU-Build-Logs
          path: |
            build.log
            out/.config
          if-no-files-found: warn
          retention-days: 7
