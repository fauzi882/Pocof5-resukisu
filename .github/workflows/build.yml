name: Build POCO F5 Marble BakaSU SUSFS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Marble BakaSU SUSFS
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT MARBLE KERNEL
      # ============================================================
      - name: Checkout Marble Kernel
        uses: actions/checkout@v4
        with:
          repository: Pzqqt/android_kernel_xiaomi_marble
          ref: melt-rebase
          fetch-depth: 1

      # ============================================================
      # 2. INSTALL BUILD DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            make \
            patch \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ============================================================
      # 3. INSTALL LLVM 22.1.8
      # ============================================================
      - name: Install LLVM 22.1.8
        run: |
          set -euo pipefail

          TOOLCHAIN_DIR="$HOME/toolchains"

          mkdir -p "$TOOLCHAIN_DIR"

          cd "$TOOLCHAIN_DIR"

          wget -q --show-progress \
            https://www.kernel.org/pub/tools/llvm/files/llvm-22.1.8-x86_64.tar.xz

          tar -xf llvm-22.1.8-x86_64.tar.xz

          LLVM_DIR="$(find "$TOOLCHAIN_DIR" \
            -maxdepth 1 \
            -type d \
            -name 'llvm-22.1.8*' \
            | head -n 1)"

          test -n "$LLVM_DIR"

          test -x "$LLVM_DIR/bin/clang"

          echo "LLVM_DIR=$LLVM_DIR" >> "$GITHUB_ENV"
          echo "$LLVM_DIR/bin" >> "$GITHUB_PATH"

          echo "=========================================="
          echo "LLVM"
          echo "=========================================="

          clang --version
          ld.lld --version

      # ============================================================
      # 4. LLVM ENVIRONMENT
      # ============================================================
      - name: Configure LLVM environment
        run: |
          set -euo pipefail

          echo "ARCH=arm64" >> "$GITHUB_ENV"
          echo "LLVM=1" >> "$GITHUB_ENV"
          echo "LLVM_IAS=1" >> "$GITHUB_ENV"

          echo "HOSTCC=gcc" >> "$GITHUB_ENV"
          echo "HOSTCXX=g++" >> "$GITHUB_ENV"

      # ============================================================
      # 5. SHOW KERNEL SOURCE
      # ============================================================
      - name: Show source information
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "MARBLE KERNEL"
          echo "=========================================="

          echo ""
          echo "Commit:"
          git log -1 --oneline

          echo ""
          echo "Commit hash:"
          git rev-parse HEAD

          echo ""
          echo "Remote:"
          git remote -v

          echo ""
          echo "Compiler:"
          clang --version

      # ============================================================
      # 6. PREPARE DEFCONFIG
      # ============================================================
      - name: Prepare marble defconfig
        run: |
          set -euo pipefail

          rm -rf out
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            marble_defconfig

          test -f out/.config

          echo "Marble defconfig created."

      # ============================================================
      # 7. CLONE BAKASU
      # ============================================================
      - name: Clone BakaSU
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            https://github.com/Baka-SU/BakaSU.git \
            bakasu

          echo "=========================================="
          echo "BAKASU"
          echo "=========================================="

          cd bakasu

          echo "Commit:"
          git log -1 --oneline

          echo ""
          echo "Commit hash:"
          git rev-parse HEAD

          test -f kernel/Kconfig
          test -f kernel/Makefile

      # ============================================================
      # 8. INTEGRATE BAKASU
      # ============================================================
      - name: Integrate BakaSU
        run: |
          set -euo pipefail

          rm -rf KernelSU

          mkdir -p KernelSU

          cp -a bakasu/kernel/. KernelSU/

          test -f KernelSU/Kconfig
          test -f KernelSU/Makefile

          echo "=========================================="
          echo "BAKASU INTEGRATED"
          echo "=========================================="

          echo ""
          echo "KernelSU files:"
          find KernelSU \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -n 100

      # ============================================================
      # 9. CONNECT BAKASU KCONFIG
      # ============================================================
      - name: Connect BakaSU Kconfig
        run: |
          set -euo pipefail

          if grep -q 'source "KernelSU/Kconfig"' Kconfig; then
            echo "KernelSU Kconfig already connected."
          else
            echo "" >> Kconfig
            echo 'source "KernelSU/Kconfig"' >> Kconfig
          fi

          echo ""
          grep -n 'KernelSU/Kconfig' Kconfig

      # ============================================================
      # 10. CLONE SUSFS
      # ============================================================
      - name: Clone SUSFS
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            --branch gki-android12-5.10 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            susfs

          echo "=========================================="
          echo "SUSFS"
          echo "=========================================="

          cd susfs

          echo "Commit:"
          git log -1 --oneline

          echo ""
          echo "Commit hash:"
          git rev-parse HEAD

          echo ""
          echo "Branch:"
          git branch --show-current || true

          echo ""
          echo "Available patch files:"
          find kernel_patches \
            -type f \
            | sort

      # ============================================================
      # 11. LOCATE SUSFS KERNEL PATCH
      # ============================================================
      - name: Locate SUSFS kernel patch
        run: |
          set -euo pipefail

          SUSFS_PATCH="susfs/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch"

          if [ ! -f "$SUSFS_PATCH" ]; then
            echo "ERROR: SUSFS kernel patch not found."

            find susfs/kernel_patches \
              -type f \
              -name '*.patch' \
              | sort

            exit 1
          fi

          echo "SUSFS_PATCH=$SUSFS_PATCH" >> "$GITHUB_ENV"

          echo "Found:"
          echo "$SUSFS_PATCH"

      # ============================================================
      # 12. COPY SUSFS SOURCE FILES
      #
      # IMPORTANT:
      # SUSFS official integration copies these BEFORE applying
      # the kernel patch.
      # ============================================================
      - name: Import SUSFS source files
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "IMPORTING SUSFS SOURCE"
          echo "=========================================="

          cp -av \
            susfs/kernel_patches/fs/* \
            fs/

          cp -av \
            susfs/kernel_patches/include/linux/* \
            include/linux/

          echo ""
          echo "SUSFS files:"

          test -f fs/susfs.c
          test -f include/linux/susfs.h
          test -f include/linux/susfs_def.h

          ls -lh \
            fs/susfs.c \
            include/linux/susfs.h \
            include/linux/susfs_def.h

      # ============================================================
      # 13. VERIFY BAKASU SUSFS MODE
      # ============================================================
      - name: Verify BakaSU SUSFS support
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BAKASU SUSFS SUPPORT"
          echo "=========================================="

          echo ""
          echo "KSU + SUSFS entries:"
          grep -n \
            'CONFIG_KSU_SUSFS\|config KSU_SUSFS' \
            KernelSU/Kconfig \
            | head -n 100

          echo ""
          echo "SUSFS Inline Hook:"
          grep -n \
            'SUSFS Inline Hook' \
            KernelSU/Kconfig \
            || true

          echo ""
          echo "SUSFS source:"
          test -f fs/susfs.c
          test -f include/linux/susfs.h
          test -f include/linux/susfs_def.h

      # ============================================================
      # 14. INSPECT PATCH
      # ============================================================
      - name: Inspect SUSFS kernel patch
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SUSFS PATCH"
          echo "=========================================="

          echo "Patch:"
          echo "$SUSFS_PATCH"

          echo ""
          echo "Size:"
          ls -lh "$SUSFS_PATCH"

          echo ""
          echo "Files touched by patch:"

          grep '^diff --git ' "$SUSFS_PATCH" \
            | sed 's#diff --git a/##' \
            | sed 's# b/##' \
            | sort -u

      # ============================================================
      # 15. VALIDATE PATCH TARGETS
      #
      # Avoid interactive:
      # "File to patch:"
      # ============================================================
      - name: Validate SUSFS patch targets
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VALIDATING SUSFS PATCH TARGETS"
          echo "=========================================="

          REQUIRED_FILES=""

          while read -r line; do
            file="$(echo "$line" | sed -E 's#^diff --git a/(.*) b/.*#\1#')"

            if [ -n "$file" ]; then
              if [ -e "$file" ]; then
                echo "OK   $file"
              else
                echo "MISS $file"
                REQUIRED_FILES="$REQUIRED_FILES $file"
              fi
            fi
          done < <(grep '^diff --git ' "$SUSFS_PATCH")

          if [ -n "$REQUIRED_FILES" ]; then
            echo ""
            echo "ERROR: SUSFS patch references missing files:"
            echo "$REQUIRED_FILES"
            exit 1
          fi

          echo ""
          echo "All SUSFS patch target files exist."

      # ============================================================
      # 16. CHECK PATCH WITH GIT APPLY
      # ============================================================
      - name: Check SUSFS kernel patch
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CHECKING SUSFS PATCH"
          echo "=========================================="

          git apply \
            --check \
            --verbose \
            "$SUSFS_PATCH"

          echo ""
          echo "SUSFS patch check PASSED."

      # ============================================================
      # 17. APPLY SUSFS KERNEL PATCH
      # ============================================================
      - name: Apply SUSFS kernel patch
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "APPLYING SUSFS KERNEL PATCH"
          echo "=========================================="

          git apply \
            --verbose \
            "$SUSFS_PATCH"

          echo ""
          echo "SUSFS kernel patch applied."

      # ============================================================
      # 18. VERIFY SUSFS INTEGRATION
      # ============================================================
      - name: Verify SUSFS integration
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY SUSFS"
          echo "=========================================="

          test -f fs/susfs.c
          test -f include/linux/susfs.h
          test -f include/linux/susfs_def.h

          echo ""
          echo "SUSFS source:"
          ls -lh \
            fs/susfs.c \
            include/linux/susfs.h \
            include/linux/susfs_def.h

          echo ""
          echo "SUSFS Makefile integration:"
          grep -n \
            'CONFIG_KSU_SUSFS' \
            fs/Makefile \
            || true

          echo ""
          echo "SUSFS kernel references:"
          grep -R \
            'CONFIG_KSU_SUSFS' \
            fs \
            include/linux \
            -n \
            2>/dev/null \
            | head -n 100 \
            || true

      # ============================================================
      # 19. REGENERATE CONFIG
      # ============================================================
      - name: Regenerate kernel configuration
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "REGENERATING CONFIG"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          test -f out/.config

          echo ""
          echo "Current KSU/SUSFS configuration:"

          grep -E \
            '^CONFIG_KSU=|^CONFIG_KSU_SUSFS=|^CONFIG_KSU_SUSFS_' \
            out/.config \
            || true

            # ============================================================
      # 20. ENABLE BAKASU SUSFS
      # ============================================================
      - name: Enable BakaSU SUSFS
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ENABLE BAKASU SUSFS"
          echo "=========================================="

          CONFIG="$GITHUB_WORKSPACE/out/.config"

          echo ""
          echo "Config:"
          echo "$CONFIG"

          test -f "$CONFIG"

          echo ""
          echo "Current KSU/SUSFS config:"

          grep -E \
            '^CONFIG_KSU=|^CONFIG_KSU_SUSFS=|^CONFIG_KSU_SUSFS_' \
            "$CONFIG" \
            || true

          echo ""
          echo "Enabling CONFIG_KSU..."

          "$GITHUB_WORKSPACE/scripts/config" \
            --file "$CONFIG" \
            --enable CONFIG_KSU

          echo ""
          echo "Enabling CONFIG_KSU_SUSFS..."

          "$GITHUB_WORKSPACE/scripts/config" \
            --file "$CONFIG" \
            --enable CONFIG_KSU_SUSFS

          echo ""
          echo "Disabling SUS_SU..."

          "$GITHUB_WORKSPACE/scripts/config" \
            --file "$CONFIG" \
            --disable CONFIG_KSU_SUSFS_SUS_SU \
            || true

          echo ""
          echo "Current configuration after scripts/config:"

          grep -E \
            '^CONFIG_KSU=|^CONFIG_KSU_SUSFS=|^CONFIG_KSU_SUSFS_' \
            "$CONFIG" \
            || true

          echo ""
          echo "=========================================="
          echo "BAKASU SUSFS CONFIGURATION UPDATED"
          echo "=========================================="

      # ============================================================
      # 21. HARD CONFIG VALIDATION
      # ============================================================
      - name: Validate KSU SUSFS configuration
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "HARD VALIDATION"
          echo "=========================================="

          grep -q '^CONFIG_KSU=y' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y' out/.config

          echo ""
          echo "CONFIG_KSU=y       OK"
          echo "CONFIG_KSU_SUSFS=y  OK"

            # ============================================================
      # 22. BUILD KERNEL + CAPTURE REAL ERROR
      # ============================================================
      - name: Build kernel
        run: |
          set -uo pipefail

          echo "=========================================="
          echo "BUILDING POCO F5 MARBLE"
          echo "=========================================="

          export KBUILD_BUILD_USER="GitHub"
          export KBUILD_BUILD_HOST="Actions"

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"$(nproc)" \
            V=1 \
            Image.gz \
            dtbs \
            2>&1 | tee build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          echo ""
          echo "=========================================="
          echo "BUILD EXIT STATUS: $BUILD_STATUS"
          echo "=========================================="

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo ""
            echo "=========================================="
            echo "REAL COMPILER ERRORS"
            echo "=========================================="

            grep -nEi \
              '(^| )error:|fatal error:|undefined reference|implicit declaration|No such file or directory|unknown type name|undeclared|Incompatible pointer|conflicting types' \
              build.log \
              | head -n 100 \
              || true

            echo ""
            echo "=========================================="
            echo "LAST 150 BUILD LOG LINES"
            echo "=========================================="

            tail -n 150 build.log

            exit "$BUILD_STATUS"
          fi

          echo ""
          echo "=========================================="
          echo "KERNEL BUILD SUCCESS"
          echo "=========================================="

      # ============================================================
      # 23. VERIFY IMAGE
      # ============================================================
      - name: Verify kernel image
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY KERNEL"
          echo "=========================================="

          test -f out/arch/arm64/boot/Image

          echo ""
          echo "Image:"
          ls -lh out/arch/arm64/boot/Image

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            echo ""
            echo "Image.gz:"
            ls -lh out/arch/arm64/boot/Image.gz
          fi

      # ============================================================
      # 24. FINAL CONFIG
      # ============================================================
      - name: Verify final configuration
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FINAL CONFIGURATION"
          echo "=========================================="

          grep -E \
            '^CONFIG_KSU=|^CONFIG_KSU_SUSFS=|^CONFIG_KSU_SUSFS_' \
            out/.config \
            || true

      # ============================================================
      # 25. COLLECT ARTIFACTS
      # ============================================================
      - name: Collect artifacts
        run: |
          set -euo pipefail

          rm -rf artifacts
          mkdir -p artifacts

          cp \
            out/arch/arm64/boot/Image \
            artifacts/Image

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp \
              out/arch/arm64/boot/Image.gz \
              artifacts/Image.gz
          fi

          cp \
            out/.config \
            artifacts/kernel.config

          cp \
            build.log \
            artifacts/build.log

          find out/arch/arm64/boot \
            -type f \
            \( \
              -name "*.dtb" \
              -o -name "*.dtbo" \
            \) \
          -name "*.dtb" \
              -o -name "*.dtbo" \
            \) \
            -exec cp {} artifacts/ \; \
            || true

          echo ""
          echo "Artifacts:"
          ls -lh artifacts

      # ============================================================
      # 26. SHA256
      # ============================================================
      - name: Generate SHA256
        run: |
          set -euo pipefail

          cd artifacts

          sha256sum * \
            | tee SHA256SUMS.txt

      # ============================================================
      # 27. UPLOAD KERNEL
      # ============================================================
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: POCO-F5-Marble-BakaSU-SUSFS-Kernel
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # 28. UPLOAD LOGS
      # ============================================================
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: POCO-F5-Marble-BakaSU-SUSFS-Logs
          path: |
            build.log
            out/.config
          if-no-files-found: warn
          retention-days: 7
