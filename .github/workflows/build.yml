name: 🚀 Build Melt-RataKanan ULTIMATE POCO F5 (Inline-Hook + Built-in DLKM)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Pilih Branch Source Pzqqt (melt-rebase = Murni, bouquet = Ekstra Fitur)'
        required: true
        default: 'melt-rebase'
        type: choice
        options:
          - melt-rebase
          - bouquet
          - bouquet_ci
      ksu_branch:
        description: 'Pilih Branch KernelSU-Next (next = Stabil, dev = Paling Baru)'
        required: true
        default: 'next'
        type: choice
        options:
          - next
          - dev
      pure_inline_hook:
        description: 'Aktifkan Mode Siluman Inline Hook Murni (Matikan Kprobes)?'
        required: true
        default: true
        type: boolean

jobs:
  build-marble-ultimate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 🧹 1. Bersihkan Disk Runner & Install Senjata Kompilasi (+Aria2c)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            aria2 bc bison build-essential ccache curl device-tree-compiler \
            flex git libelf-dev libssl-dev libncurses5-dev lz4 \
            python3 python-is-python3 rsync unzip wget xz-utils zip zstd

      - name: 📥 2. Clone Source Kernel Pzqqt (POCO F5 / marble)
        run: |
          git clone --depth=1 -b ${{ github.event.inputs.kernel_branch }} \
            https://github.com/Pzqqt/android_kernel_xiaomi_marble.git kernel
          cd kernel
          echo "=== INFO COMMIT TERAKHIR SOURCE PZQQT ==="
          git log -1

      - name: ⚡ 3. Download Toolchain ZyC Clang/LLVM Terbaru (Anti-Limit + Aria2c Turbo)
        run: |
          mkdir -p clang
          # Bypass API Rate Limit: Ambil link langsung dari Clang-main-link.txt (Clang 23.0.0git)
          CLANG_URL=$(curl -fsSL "https://raw.githubusercontent.com/ZyCromerZ/Clang/refs/heads/main/Clang-main-link.txt" | tr -d '\r\n')

          # Jaring pengaman kedua menggunakan autentikasi GITHUB_TOKEN resmi
          if [ -z "$CLANG_URL" ]; then
            CLANG_URL=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              https://api.github.com/repos/ZyCromerZ/Clang/releases/latest | grep "browser_download_url.*tar.gz" | cut -d '"' -f 4 | head -n 1)
          fi

          echo "Mengunduh Toolchain dari: $CLANG_URL"
          aria2c -x16 -s16 --console-log-level=warn "$CLANG_URL" -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          rm clang.tar.gz
          ./clang/bin/clang --version

      - name: 🗂️ 4. Aktifkan CCACHE (Sedot Cache Lama Biar Ngebut)
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: marble-ccache-${{ github.event.inputs.kernel_branch }}-${{ github.run_id }}
          restore-keys: |
            marble-ccache-${{ github.event.inputs.kernel_branch }}-
            marble-ultimate-ccache-${{ github.event.inputs.kernel_branch }}-
            marble-ccache-
            marble-ultimate-ccache-

      - name: 🥷 5. Suntik KernelSU-Next + SuSFS + Verifikasi Inline Hook Murni
        run: |
          cd kernel

          echo "--> [1/4] Menghapus sisa KernelSU bawaan Pzqqt agar tidak bentrok..."
          rm -rf KernelSU KernelSU-Next drivers/kernelsu
          sed -i '/kernelsu/d' drivers/Makefile || true
          sed -i '/kernelsu/d' drivers/Kconfig || true

          echo "--> [2/4] Menarik KernelSU-Next branch: ${{ github.event.inputs.ksu_branch }}..."
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${{ github.event.inputs.ksu_branch }}/kernel/setup.sh" | bash -s ${{ github.event.inputs.ksu_branch }}

          echo "--> [3/4] Menarik SuSFS (gki-android12-5.10) & Menyalin Core File..."
          git clone --depth=1 -b gki-android12-5.10 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu
          cp -rv ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp -rv ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/

          if [ -d "KernelSU-Next" ]; then
            cd KernelSU-Next
          elif [ -d "KernelSU" ]; then
            cd KernelSU
          fi
          patch -p1 --forward < ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || true
          cd ..

          echo "--> [4/4] Menerapkan Patch SuSFS + Inline Hooks ke Kernel 5.10..."
          patch -p1 --forward < ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-5.10.patch || true

          echo "Daftar file .rej (jika ada):"
          find . -name "*.rej" -print -delete || true

          HOOK_OK=true
          for f in fs/exec.c fs/open.c fs/read_write.c fs/stat.c; do
            if ! grep -q -E "ksu_handle_|susfs_" "$f"; then
              echo "⚠️ Peringatan: Hook manual belum terdeteksi di $f!"
              HOOK_OK=false
            else
              echo "✅ Inline Hook terkonfirmasi aktif di $f"
            fi
          done
          echo "INLINE_HOOK_VERIFIED=$HOOK_OK" >> $GITHUB_ENV

      - name: ⚙️ 6. Racik Defconfig "RATA KANAN" (Performa, Baterai, TCP BBR, Sinyal, DLKM & KSU)
        run: |
          cd kernel
          export PATH="${GITHUB_WORKSPACE}/clang/bin:${PATH}"

          if [ -f "arch/arm64/configs/marble_defconfig" ]; then
            DEFCONFIG_TARGET="marble_defconfig"
          elif [ -f "arch/arm64/configs/vendor/marble_GKI.config" ]; then
            DEFCONFIG_TARGET="gki_defconfig vendor/marble_GKI.config"
          else
            DEFCONFIG_TARGET="gki_defconfig"
          fi
          echo "Menggunakan Defconfig: $DEFCONFIG_TARGET"

          make O=out ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1 $DEFCONFIG_TARGET

          # [1] Identitas Kernel Siluman
          ./scripts/config --file out/.config \
            --set-str CONFIG_LOCALVERSION "-Melt-RataKanan-Ultimate"

          # [2] Konfigurasi KernelSU-Next & SuSFS Lengkap
          ./scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_KSU_SUSFS \
            -e CONFIG_KSU_SUSFS_SUS_PATH \
            -e CONFIG_KSU_SUSFS_SUS_MOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            -e CONFIG_KSU_SUSFS_SUS_KSTAT \
            -e CONFIG_KSU_SUSFS_TRY_UMOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
            -e CONFIG_KSU_SUSFS_SPOOF_UNAME \
            -e CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            -d CONFIG_KSU_SUSFS_ENABLE_LOG \
            -d CONFIG_KSU_SUSFS_SUS_SU

          # [3] Logika Pintar Inline Hook Murni vs Fallback Kprobes
          if [ "${{ github.event.inputs.pure_inline_hook }}" = "true" ] && [ "${INLINE_HOOK_VERIFIED}" = "true" ]; then
            echo "🥷 MODE SILUMAN PENUH AKTIF: Mematikan KPROBES & Menggunakan Inline Hook Murni!"
            ./scripts/config --file out/.config \
              -d CONFIG_KSU_WITH_KPROBES \
              -d CONFIG_KSU_KPROBES_HOOK \
              -d CONFIG_KPROBES \
              -d CONFIG_KPROBE_EVENTS
          else
            echo "🛡️ MODE FALLBACK AMAN AKTIF: Mengaktifkan KPROBES agar Root 100% Terjamin Hidup!"
            ./scripts/config --file out/.config \
              -e CONFIG_KSU_WITH_KPROBES \
              -e CONFIG_KSU_KPROBES_HOOK \
              -e CONFIG_KPROBES \
              -e CONFIG_HAVE_KPROBES \
              -e CONFIG_KPROBE_EVENTS
          fi

          # [4] Leburkan Modul DLKM Penting Langsung ke Image.gz (=y) & Buka Kunci Modul Vendor ROM
          ./scripts/config --file out/.config \
            -e CONFIG_MODULES \
            -d CONFIG_MODULE_SIG_FORCE \
            -d CONFIG_MODULE_SIG_ALL \
            -e CONFIG_NTSYNC \
            -e CONFIG_MQ_IOSCHED_ADIOS \
            -e CONFIG_IOSCHED_BFQ \
            -e CONFIG_MTK_CPQ_IO_SCHED

          # [5] Upgrade TCP BBR + Fair Queue (FQ) Default & Bypass Tethering/TTL
          ./scripts/config --file out/.config \
            -e CONFIG_TCP_CONG_ADVANCED \
            -e CONFIG_TCP_CONG_BBR \
            -e CONFIG_TCP_CONG_WESTWOOD \
            -e CONFIG_DEFAULT_BBR \
            --set-str CONFIG_DEFAULT_TCP_CONG "bbr" \
            -e CONFIG_NET_SCHED \
            -e CONFIG_NET_SCH_FQ \
            -e CONFIG_NET_SCH_FQ_CODEL \
            -e CONFIG_DEFAULT_FQ \
            --set-str CONFIG_DEFAULT_NET_SCH "fq" \
            -e CONFIG_NETFILTER_XT_TARGET_HL \
            -e CONFIG_IP_NF_TARGET_TTL \
            -e CONFIG_IP6_NF_TARGET_HL \
            -e CONFIG_IP_SET

          # [6] Penguatan Jalur Sinyal Seluler & GPS (Bersihkan Bottleneck QMI/RMNET/IPA)
          ./scripts/config --file out/.config \
            -e CONFIG_RMNET_PERF \
            -e CONFIG_RMNET_SHS \
            -d CONFIG_IPA_DEBUG \
            -d CONFIG_IPC_LOGGING \
            -d CONFIG_QCOM_RTB \
            -e CONFIG_BOEFFLA_WL_BLOCKER

          # [7] Performa Rata Kanan & Efisiensi Baterai (ThinLTO + 300Hz + MGLRU Anti-Panic)
          ./scripts/config --file out/.config \
            -e CONFIG_LTO_CLANG_THIN \
            -e CONFIG_HZ_300 \
            --set-val CONFIG_HZ 300 \
            -e CONFIG_WQ_POWER_EFFICIENT_DEFAULT \
            -e CONFIG_ENERGY_MODEL \
            -e CONFIG_UCLAMP_TASK \
            -e CONFIG_UCLAMP_TASK_GROUP \
            -e CONFIG_LRU_GEN \
            -e CONFIG_LRU_GEN_ENABLED \
            -d CONFIG_KSHRINK_LRUVECD \
            -e CONFIG_CRYPTO_LZ4 \
            -e CONFIG_CRYPTO_ZSTD

          # [8] Diet Ketat Sampah Kernel (Hapus Overhead Tracing & Audit)
          ./scripts/config --file out/.config \
            -d CONFIG_AUDIT \
            -d CONFIG_DEBUG_FS \
            -d CONFIG_CORESIGHT \
            -d CONFIG_PAGE_OWNER \
            -d CONFIG_DEBUG_PAGEALLOC \
            -d CONFIG_SLUB_DEBUG \
            -d CONFIG_PRINTK_TIME

          make O=out ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

      - name: 🔥 7. Compile Kernel Image (Gaspol Semua Core + Turbo CCACHE)
        run: |
          cd kernel
          export PATH="/usr/lib/ccache:${GITHUB_WORKSPACE}/clang/bin:${PATH}"
          export CCACHE_DIR="${HOME}/.ccache"
          export CCACHE_SLOPPINESS="file_macro,locale,time_macros"
          export CCACHE_NOHASHDIR="true"
          export KBUILD_BUILD_TIMESTAMP="Thu Oct 15 00:00:00 UTC 2026"
          export KBUILD_BUILD_USER="Fauzi"
          export KBUILD_BUILD_HOST="RataKanan-Lab"

          ccache -M 5G
          ccache -z

          make -j$(nproc --all) \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            Image Image.gz

          ccache -s

      - name: 📦 8. Rakit AnyKernel3 + Auto-Installer Script Rata Kanan (TCP, Baterai & Sinyal)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/README.md

          sed -i 's/device.name1=.*/device.name1=marble/' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=marblein/' AnyKernel3/anykernel.sh
          sed -i 's/BLOCK=.*/BLOCK=auto;/' AnyKernel3/anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1;/' AnyKernel3/anykernel.sh

          if [ -f "kernel/out/arch/arm64/boot/Image.gz" ]; then
            cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
          else
            cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          fi

          cat << 'EOF' > AnyKernel3/99_marble_ratakanan.sh
          #!/system/bin/sh
          while [ "$(getprop sys.boot_completed)" != "1" ]; do
              sleep 2
          done

          # 1. Kunci Paksa TCP BBR + Fair Queue (FQ) + ECN + FastOpen
          sysctl -w net.core.default_qdisc=fq
          sysctl -w net.ipv4.tcp_congestion_control=bbr
          sysctl -w net.ipv4.tcp_ecn=1
          sysctl -w net.ipv4.tcp_fastopen=3
          sysctl -w net.ipv4.tcp_tw_reuse=1

          # 2. Perbesar Buffer Jaringan Seluler & WiFi (Anti-Lag Saat Sinyal Goyang)
          sysctl -w net.core.rmem_max=16777216
          sysctl -w net.core.wmem_max=16777216
          sysctl -w net.ipv4.tcp_rmem="4096 87380 16777216"
          sysctl -w net.ipv4.tcp_wmem="4096 65536 16777216"

          # 3. Aktifkan I/O Scheduler ADIOS / CPQ
          for queue in /sys/block/sd*/queue/scheduler /sys/block/mmcblk*/queue/scheduler; do
              if [ -f "$queue" ]; then
                  if grep -q "adios" "$queue"; then
                      echo "adios" > "$queue" 2>/dev/null
                  elif grep -q "cpq" "$queue"; then
                      echo "cpq" > "$queue" 2>/dev/null
                  fi
              fi
          done

          # 4. Blokir Wakelock Penyedot Baterai via Boeffla Wakelock Blocker
          if [ -f "/sys/class/misc/boeffla_wakelock_blocker/wakelock_blocker" ]; then
              echo "qcom_rx_wakelock;wlan_pno_wl;wlan_extscan_wl;ipa_client_apps_wan_cons;NETLINK" > /sys/class/misc/boeffla_wakelock_blocker/wakelock_blocker 2>/dev/null
          fi

          # 5. Pangkas Printk Log Spam Kernel di Background
          sysctl -w kernel.printk="0 0 0 0"
          EOF

          cat << 'EOF' >> AnyKernel3/anykernel.sh

          # === AUTO-INSTALL RATA KANAN SERVICE SCRIPT ===
          if [ -d "/data/adb/service.d" ]; then
            ui_print "- Memasang Script Auto-Tweak Rata Kanan (TCP BBR, I/O & Baterai)..."
            cp -f $home/99_marble_ratakanan.sh /data/adb/service.d/99_marble_ratakanan.sh
            chmod 0755 /data/adb/service.d/99_marble_ratakanan.sh
          fi
          EOF

          cd AnyKernel3
          ZIP_NAME="Melt-RataKanan-ULTIMATE-Marble-${{ github.event.inputs.kernel_branch }}-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "../${ZIP_NAME}" * -x "*.git*"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: 📤 9. Upload File Flashable ZIP Siap Tempur
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 14
          
