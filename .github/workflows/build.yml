# file: .github/workflows/build.yml
# repo: fauzi882/Pocof5-resukisu (fork)
# target: POCO F5 / Redmi Note 12 Turbo (marble) — GKI 5.10
# features: KernelSU-Next (legacy) · SuSFS · AnyKernel3

name: Build Templar Kernel (marble)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: Steambot12/Templar-Kernel-GKI-5.10
          ref: Templar-LinuxStable
          path: kernel
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3 python-is-python3

      - name: Setup KernelSU-Next (legacy / non-GKI)
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: Apply SuSFS patch (GKI 5.10)
        run: |
          cd kernel
          git clone --depth=1 https://github.com/Simonpunk/susfs4ksu.git ../susfs
          SUSFS_PATCH=$(find ../susfs/kernel_patches -name '50_add_susfs_in_gki-5.10*.patch' | head -n1)
          if [[ -z "$SUSFS_PATCH" ]]; then
            echo "no 5.10 SuSFS patch found"
            exit 1
          fi
          cp "$SUSFS_PATCH" ./common/
          cd common
          patch -p1 < "$(basename "$SUSFS_PATCH")" || {
            echo "susfs patch reject — inspect common/ for hunks"
            exit 1
          }

      - name: Clone toolchain (Neutron Clang)
        run: |
          mkdir -p toolchain
          cd toolchain
          curl -L "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/20250601/neutron-clang-20250601.tar.zst" \
            | tar --zstd -xf - --strip-components=1

      - name: Build kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export LLVM_IAS=1

          # defconfig marble — sesuaikan kalau nama file beda
          make O=out ARCH=arm64 vendor/marble_defconfig
          make O=out ARCH=arm64 olddefconfig

          make -j$(nproc) O=out \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            LLVM_IAS=1 Image.gz

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cd anykernel
          cp ../kernel/out/arch/arm64/boot/Image.gz ./Image.gz
          
          cat > anykernel.sh <<'EOF'
          properties() { '
          kernel.string=Templar GKI 5.10 — KSU-Next + SuSFS
          do.devicecheck=1
          do.modules=1
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=marble
          device.name2=marblein
          device.name3=POCO F5
          device.name4=Redmi Note 12 Turbo
          supported.versions=13-16
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          RAMDISK_PATCH_LEVEL=auto;
          NO_BLOCK_DISPLAY=1;

          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          EOF

          rm -rf .git
          zip -r9 "../Templar-marble-KSUN-SuSFS-$(date +%Y%m%d).zip" . -x '*.git*'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Templar-marble-KSUN-SuSFS
          path: Templar-marble-KSUN-SuSFS-*.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: build-$(date +%Y%m%d-%H%M)
          files: Templar-marble-KSUN-SuSFS-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
