name: Build Marble Kernel (Stable No-OC + KSU-Next / BakaSU + SuSFS)

on:
  workflow_dispatch:
    inputs:
      root_variant:
        description: 'Pilih Varian Root (BakaSU / ReSukiSU atau KernelSU Next)'
        required: true
        default: 'bakasu'
        type: choice
        options:
          - bakasu
          - kernelsu-next
      enable_susfs:
        description: 'Integrasikan Patch SuSFS (Root Hiding Level Kernel)'
        required: true
        default: true
        type: boolean
      tcp_profile:
        description: 'Optimasi Latensi BBR (Aman Tanpa Ubah Struktur ABI)'
        required: true
        default: 'bbr_plus_tuned'
        type: choice
        options:
          - bbr_plus_tuned
          - bbr_stock
      kernel_branch:
        description: 'Branch Source Kernel Pzqqt'
        required: true
        default: 'melt-rebase'
        type: choice
        options:
          - melt-rebase
          - bouquet

env:
  KERNEL_REPO: "https://github.com/Pzqqt/android_kernel_xiaomi_marble.git"
  AK3_MARBLE_REPO: "https://github.com/Pzqqt/AnyKernel3.git"
  AK3_FALLBACK_REPO: "https://github.com/osm0sis/AnyKernel3.git"
  SUSFS_REPO: "https://gitlab.com/simonpunk/susfs4ksu.git"
  SUSFS_BRANCH: "gki-android12-5.10"
  CLANG_URL: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r536225.tar.gz"
  ARCH: "arm64"
  SUBARCH: "arm64"

jobs:
  build-marble-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Maksimalkan Ruang Disk Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Install Dependensi Kompilasi
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache cpio curl flex git git-lfs \
            libelf-dev libncurses5-dev libssl-dev lld llvm lz4 pahole \
            python3 python3-pip rsync unzip wget xz-utils zip zstd \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu

      - name: Setup Direktori & Toolchain Clang/LLVM
        run: |
          mkdir -p "$HOME/toolchains/clang"
          wget -qO clang.tar.gz "${{ env.CLANG_URL }}"
          tar -xzf clang.tar.gz -C "$HOME/toolchains/clang"
          rm -f clang.tar.gz
          echo "$HOME/toolchains/clang/bin" >> $GITHUB_PATH

      - name: Clone Source Kernel Pzqqt (Marble)
        run: |
          git clone --depth=50 -b "${{ github.event.inputs.kernel_branch }}" "${{ env.KERNEL_REPO }}" kernel
          cd kernel
          git config user.name "kanha-builder"
          git config user.email "builder@localhost"

      - name: Siapkan Repo SuSFS (gki-android12-5.10)
        if: ${{ github.event.inputs.enable_susfs == 'true' }}
        run: |
          git clone --depth=1 -b "${{ env.SUSFS_BRANCH }}" "${{ env.SUSFS_REPO }}" susfs4ksu

      - name: Revert Hook KSU Custom Pzqqt & Integrasi BakaSU / KSU-Next + SuSFS
        run: |
          cd kernel

          # 1. Jika di log commit Pzqqt ada commit "KernelSU" bawaan yang memodifikasi fs/exec.c & selinux,
          #    kita revert commit hook spesifik tersebut agar fs/exec.c & selinux kembali 100% standar GKI!
          for commit_hash in $(git log --grep="KernelSU\|ksu\|KSU" --format="%H" -n 10); do
            git revert --no-commit "$commit_hash" 2>/dev/null || git revert --abort 2>/dev/null || true
          done

          # Pastikan direktori KernelSU lama bersih
          rm -rf KernelSU drivers/kernelsu
          sed -i '/kernelsu/d' drivers/Makefile || true
          sed -i '/kernelsu/d' drivers/Kconfig || true

          # 2. Pasang Root pilihan (BakaSU atau KernelSU Next)
          if [ "${{ github.event.inputs.root_variant }}" = "bakasu" ]; then
            echo ">>> Mengintegrasikan BakaSU (ReSukiSU)..."
            curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -s main || \
            curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash
          else
            echo ">>> Mengintegrasikan KernelSU Next..."
            if [ "${{ github.event.inputs.enable_susfs }}" = "true" ]; then
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next-susfs || \
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
            else
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
            fi
          fi

          # 3. Terapkan patch SuSFS
          SUSFS_OK="false"
          if [ "${{ github.event.inputs.enable_susfs }}" = "true" ] && [ -d "../susfs4ksu" ]; then
            cp -r ../susfs4ksu/kernel_patches/fs/* fs/
            cp -r ../susfs4ksu/kernel_patches/include/linux/* include/linux/

            PATCH_FILE="../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch"
            if [ -f "$PATCH_FILE" ]; then
              if patch -p1 --dry-run --fuzz=3 < "$PATCH_FILE" >/dev/null 2>&1; then
                patch -p1 --forward --fuzz=3 < "$PATCH_FILE"
                SUSFS_OK="true"
              elif git apply --3way --check "$PATCH_FILE" >/dev/null 2>&1; then
                git apply --3way "$PATCH_FILE"
                SUSFS_OK="true"
              else
                rm -f fs/susfs.c fs/sus_su.c include/linux/susfs*.h
                SUSFS_OK="false"
              fi
            fi

            if [ "$SUSFS_OK" = "true" ]; then
              find KernelSU drivers/kernelsu -name "*.mk" -o -name "Makefile" -o -name "Kbuild" 2>/dev/null | while read -r mkfile; do
                sed -i 's/\$(error /\$(warning /g' "$mkfile" || true
              done
            fi
          fi
          echo "SUSFS_APPLIED=$SUSFS_OK" >> $GITHUB_ENV

          # 4. Pengaman Fallback: Jika revert commit di atas tidak menghapus hook legacy Pzqqt,
          #    pasang jembatan aman yang memanggil fungsi SELinux asli beserta semua argumennya
          python3 - << 'PYEOF'
          import re

          with open("fs/exec.c", "r", encoding="utf-8", errors="ignore") as f:
              exec_content = f.read()

          stubs = []
          for fn in ["ksu_setup_preinit_file", "ksu_preinit_handle_post_execveat"]:
              pattern = r"extern\s+([^;]*?\b" + fn + r"\s*\([^;]*?\))\s*;"
              m = re.search(pattern, exec_content, re.DOTALL)
              if m:
                  decl = m.group(1).strip()
                  ret_part = decl.split(fn)[0].strip()
                  if "void" in ret_part and "*" not in ret_part:
                      stubs.append(f"__attribute__((weak)) {decl} {{}}\n")
                  else:
                      stubs.append(f"__attribute__((weak)) {decl} {{ return 0; }}\n")

          if stubs:
              with open("fs/exec.c", "a", encoding="utf-8") as f:
                  f.write("\n/* Safe no-op weak stubs */\n")
                  for s in stubs:
                      f.write(s)

          for filepath, replacements in [
              ("security/selinux/hooks.c", [("my_setprocattr", "selinux_setprocattr")]),
              ("security/selinux/selinuxfs.c", [("my_write_context", "sel_write_context"), ("my_write_access", "sel_write_access")])
          ]:
              with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()
              for old_fn, orig_fn in replacements:
                  content = content.replace(f"return {old_fn}(", f"return {orig_fn}(")
              with open(filepath, "w", encoding="utf-8") as f:
                  f.write(content)
          PYEOF

      - name: Konfigurasi Defconfig Minimal & Aman (Anti-Bootloop / ABI Safe)
        run: |
          cd kernel

          # Tuning ringan konstanta internal BBR (Tidak mengubah ABI atau struct kernel sama sekali)
          if [ "${{ github.event.inputs.tcp_profile }}" = "bbr_plus_tuned" ] && [ -f "net/ipv4/tcp_bbr.c" ]; then
            sed -i 's/static const u32 bbr_min_rtt_win_sec = 10;/static const u32 bbr_min_rtt_win_sec = 5;/g' net/ipv4/tcp_bbr.c || true
            sed -i 's/static const u32 bbr_probe_rtt_mode_ms = 200;/static const u32 bbr_probe_rtt_mode_ms = 100;/g' net/ipv4/tcp_bbr.c || true
          fi

          # Gunakan defconfig bawaan Pzqqt TANPA mengubah HZ, Scheduler, atau Memory Layout
          if [ -f "arch/arm64/configs/marble_defconfig" ]; then
            DEFCONFIG_NAME="marble_defconfig"
            DEFCONFIG_FILE="arch/arm64/configs/marble_defconfig"
          elif [ -f "arch/arm64/configs/vendor/marble_defconfig" ]; then
            DEFCONFIG_NAME="vendor/marble_defconfig"
            DEFCONFIG_FILE="arch/arm64/configs/vendor/marble_defconfig"
          else
            DEFCONFIG_NAME="gki_defconfig"
            DEFCONFIG_FILE="arch/arm64/configs/gki_defconfig"
          fi

          echo "TARGET_DEFCONFIG=$DEFCONFIG_NAME" >> $GITHUB_ENV
          echo ">>> Menggunakan Defconfig Asli: $DEFCONFIG_FILE"

          # HANYA tambahkan config KSU, SuSFS, dan BBR (Tanpa Overclock / Tanpa Ubah HZ)
          cat << 'EOF' >> "$DEFCONFIG_FILE"
          CONFIG_WERROR=n
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_NET_SCH_FQ=y
          EOF

          if [ "${{ env.SUSFS_APPLIED }}" = "true" ]; then
            cat << 'EOF' >> "$DEFCONFIG_FILE"
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          EOF
          else
            echo "CONFIG_KSU_SUSFS=n" >> "$DEFCONFIG_FILE"
          fi

      - name: Kompilasi Kernel Marble (Flag Standar GKI Tanpa Overclock)
        run: |
          cd kernel
          export KBUILD_BUILD_USER="melt"
          export KBUILD_BUILD_HOST="poco-f5"

          make O=out ARCH=arm64 \
            CC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            "${{ env.TARGET_DEFCONFIG }}"

          if [ -f "arch/arm64/configs/vendor/marble_GKI.config" ] && [ "${{ env.TARGET_DEFCONFIG }}" = "gki_defconfig" ]; then
            ./scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/marble_GKI.config
          fi

          ./scripts/config --file out/.config -d WERROR -d CONFIG_WERROR -d KSU_SUSFS_SUS_SU --set-val FRAME_WARN 4096
          make O=out ARCH=arm64 CC="ccache clang" LLVM=1 LLVM_IAS=1 olddefconfig

          # Kompilasi Murni Standar GKI (Tanpa -O3 atau -march custom yang bisa bikin panic)
          set +e
          make -j$(nproc --all) \
            O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            Image Image.gz 2>&1 | tee build_full.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ $BUILD_STATUS -ne 0 ]; then
            grep -E "error:|fatal error:|undefined reference|undefined symbol|FAILED|\*\*\*.*Stop" build_full.log | tail -n 50 || true
            exit $BUILD_STATUS
          fi

      - name: Paketkan ke AnyKernel3 Khusus Marble (Anti-Bootloop)
        run: |
          # Gunakan repo AnyKernel3 khusus Marble milik Pzqqt (fallback ke osm0sis dengan konfigurasi GKI murni)
          if git clone --depth=1 "${{ env.AK3_MARBLE_REPO }}" AnyKernel3 2>/dev/null; then
            echo ">>> Menggunakan AnyKernel3 resmi Pzqqt untuk Marble..."
          else
            git clone --depth=1 "${{ env.AK3_FALLBACK_REPO }}" AnyKernel3
            cd AnyKernel3
            cat << 'EOF' > anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script for POCO F5 (marble) GKI 2.0
          properties() { '
          kernel.string=Melt Kernel POCO F5 (marble)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=marble
          device.name2=marblein
          device.name3=POCO F5
          device.name4=Redmi Note 12 Turbo
          supported.versions=12-16
          supported.patchlevels=
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          EOF
            cd ..
          fi

          cd AnyKernel3
          rm -rf .git README.md

          # Pastikan menyalin format Image yang tepat (GKI 2.0 Marble memakai Image atau Image.gz)
          if grep -q "Image.gz" anykernel.sh 2>/dev/null && [ -f "../kernel/out/arch/arm64/boot/Image.gz" ]; then
            cp ../kernel/out/arch/arm64/boot/Image.gz .
          elif [ -f "../kernel/out/arch/arm64/boot/Image" ]; then
            cp ../kernel/out/arch/arm64/boot/Image .
            [ -f "../kernel/out/arch/arm64/boot/Image.gz" ] && cp ../kernel/out/arch/arm64/boot/Image.gz .
          fi

          # Sertakan skrip userspace tuning (Aman 100%, berjalan SETELAH HP selesai nyala)
          cat << 'EOF' > marble_postboot_tune.sh
          #!/system/bin/sh
          while [ "$(getprop sys.boot_completed)" != "1" ]; do
            sleep 3
          done

          # 1. BBR + FQ Network Latency Tune
          echo "bbr" > /proc/sys/net/ipv4/tcp_congestion_control 2>/dev/null
          echo "fq" > /proc/sys/net/core/default_qdisc 2>/dev/null
          echo 0 > /proc/sys/net/ipv4/tcp_slow_start_after_idle 2>/dev/null

          # 2. Penguat Sinyal & Stabilitas Modem
          resetprop -n persist.vendor.radio.add_power_save 0
          resetprop -n persist.vendor.radio.sib16_support 1

          # 3. Efisiensi Baterai & Responsivitas Schedutil Standar
          for gov in /sys/devices/system/cpu/cpufreq/policy*; do
            echo 1000 > "$gov/schedutil/up_rate_limit_us" 2>/dev/null
            echo 5000 > "$gov/schedutil/down_rate_limit_us" 2>/dev/null
          done
          EOF
          chmod 0755 marble_postboot_tune.sh

          BUILD_DATE=$(date +"%Y%m%d-%H%M")
          ZIP_NAME="Melt-Marble-Stable-${{ github.event.inputs.root_variant }}-SuSFS_${{ env.SUSFS_APPLIED }}-${BUILD_DATE}.zip"
          zip -r9 "../${ZIP_NAME}" * -x "*.git*"
          echo "ZIP_OUTPUT=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload Artifact Flashable Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Melt-Kernel-Marble-Stable-${{ github.event.inputs.root_variant }}
          path: ${{ env.ZIP_OUTPUT }}
          retention-days: 14
          
